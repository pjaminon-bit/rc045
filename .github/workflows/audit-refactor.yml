name: Eenmalige audit-refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pas auditverbeteringen toe
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # De vorige workflow bevat het volledige patchscript. Dat script liep
          # aantoonbaar door alle PHP-wijzigingen heen en strandde alleen op één
          # te strikt ingesprongen JS-fragment. Hergebruik daarom exact dat script
          # en vervang uitsluitend die laatste match door de echte bronvorm.
          import subprocess
          vorige = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/audit-refactor.yml'],
              text=True
          )
          regels = vorige.splitlines()
          begin = next(i for i, r in enumerate(regels) if "python3 <<'PY'" in r) + 1
          einde = next(i for i in range(begin, len(regels)) if regels[i].strip() == 'PY')
          code_regels = regels[begin:einde]
          code = '\n'.join((r[10:] if r.startswith('          ') else r) for r in code_regels) + '\n'

          oud = "s = replace_once(s, old, new, 'title click')"
          nieuw = """if s.count(old) == 1:
              s = s.replace(old, new, 1)
          else:
              needle = \"        toonKeuze();\\n      });\\n    });\"
              replacement = \"        toonKeuze();\\n        updateLiveDocumentTitle(document.documentElement.lang || 'nl');\\n      });\\n    });\"
              s = replace_once(s, needle, replacement, 'title click fallback')"""
          if code.count(oud) != 1:
              raise SystemExit('Kon de oude title-click stap niet uniek vinden')
          code = code.replace(oud, nieuw, 1)
          exec(compile(code, 'audit-refactor.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Syntaxcontrole
        run: |
          php -l auth.php
          php -l leden.php
          php -l seo-head.php
          node --check site-i18n.js
          node --check paneel-thema.js

      - name: Controleer diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit refactor
        run: |
          git config user.name 'pjaminon-bit'
          git config user.email 'pjaminon@me.com'
          git add -A
          git commit -m 'Finish audit hardening and cleanup'
          git push origin HEAD:main
