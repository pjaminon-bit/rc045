name: RC045 herstel ontbrekende sitegegevens (eenmalig)

on:
  push:
    branches:
      - fix/restore-missing-site-data-safe
      - main
    paths:
      - 'scripts/prepare-missing-public-data.php'
      - 'scripts/check-missing-public-data.mjs'
      - 'scripts/restore-missing-public-data-ftps.py'
      - '.github/workflows/restore-missing-public-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout broncode
        uses: actions/checkout@v4

      - name: Node 22 activeren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exacte CMS-standaardgegevens reconstrueren
        run: php scripts/prepare-missing-public-data.php

      - name: Alle velden en talen tegen huidige pagina-code vergelijken
        run: node scripts/check-missing-public-data.mjs

      - name: FTPS veilig vergelijken en uitsluitend ontbrekende bestanden toevoegen
        env:
          RC045_FTP_USERNAME: ${{ secrets.RC045_FTP_USERNAME }}
          RC045_FTP_PASSWORD: ${{ secrets.RC045_FTP_PASSWORD }}
          RC045_PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: python3 scripts/restore-missing-public-data-ftps.py

      - name: Publieke URLs controleren (alleen na daadwerkelijk herstel)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for name in bedankt.json aanmelden.json fotoboek-pagina.json; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 \
              -o "/tmp/$name" "https://rc045.nl/data/$name"
            cmp ".rc045-restore/data/$name" "/tmp/$name"
            echo "Live JSON gelijk aan websitefallback: $name"
          done
          curl --fail --silent --show-error \
            https://rc045.nl/404.shtml | grep -Fq 'Pagina niet gevonden'
          echo "Live foutpagina is bereikbaar"
