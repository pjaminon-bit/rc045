name: Eenmalige changelog-cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/changelog-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Herstel alleen de twee oude changelogzinnen
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('changelog-historie.php')
          s = p.read_text(encoding='utf-8')
          fixes = {
            'waarvoor je je zelf kunt inschrijven': 'waarvoor ze zich kunnen inschrijven',
            'Naast de aanvangstijd staat nu ook een veld voor de eindtijd.': 'Naast de aanvangstijd staat er nu ook een veld voor de eindtijd.'
          }
          for oud, nieuw in fixes.items():
              if s.count(oud) != 1:
                  raise SystemExit(f'Verwacht 1 match voor {oud!r}, gevonden {s.count(oud)}')
              s = s.replace(oud, nieuw, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/changelog-cleanup.yml').unlink()
          PY
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name 'pjaminon-bit'
          git config user.email 'pjaminon@me.com'
          git add -A
          git commit -m 'Preserve historical changelog wording'
          git push origin HEAD:main

      - name: Publiceer gecorrigeerde staat naar Strato
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './*'
          remote_path: '/'
