name: Radio browser-layouttests

on:
  pull_request:
    paths:
      - 'radio.html'
      - 'tests/radio-layout.test.mjs'
      - '.github/workflows/radio-layout-tests.yml'
  workflow_dispatch:

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installeer testbrowser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Meet desktop en mobiele layout in een echte browser
        run: node tests/radio-layout.test.mjs
      - name: Bewaar screenshots ook als een test faalt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radio-layout-screenshots
          path: radio-layout-screenshots/
          if-no-files-found: ignore
          retention-days: 7
