name: One-time fix relative home links

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make homepage links clean and relative
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              'aanmelden.php', 'ontstaan.php', 'baanreglement.php',
              'media.php', 'fotoboek.php', 'bedankt.php', 'site-i18n.js'
          ]
          for name in targets:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('index.html#', './#')
              s = s.replace('href="index.html"', 'href="./"')
              s = s.replace("href='index.html'", "href='./'")
              p.write_text(s, encoding='utf-8')

          p = Path('site-i18n.js')
          s = p.read_text(encoding='utf-8')
          old = """      // Alleen lokale .html links en lokale anchors, geen externe/mailto/tel links
      if (!href || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('#')) return;
      if (!href.endsWith('.html') && !href.includes('.html#') && !href.includes('.html?')) return;
      const url = new URL(href, window.location.href);
      if (lang === 'nl') {
        url.searchParams.delete('lang');
      } else {
        url.searchParams.set('lang', lang);
      }
      // Bouw relatieve href terug op (pad + query + hash)
      const newHref = url.pathname.split('/').pop() + url.search + url.hash;
      a.setAttribute('href', newHref);"""
          new = """      // Lokale .html-links en homepage-links (./ of ./#sectie). Externe,
      // mailto-, tel- en puur lokale anchors blijven ongemoeid.
      if (!href || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('#')) return;
      const isHomepageLink = href === './' || href.startsWith('./#') || href.startsWith('./?');
      const isHtmlLink = href.endsWith('.html') || href.includes('.html#') || href.includes('.html?');
      if (!isHomepageLink && !isHtmlLink) return;
      const url = new URL(href, window.location.href);
      if (lang === 'nl') {
        url.searchParams.delete('lang');
      } else {
        url.searchParams.set('lang', lang);
      }
      const newHref = isHomepageLink
        ? './' + url.search + url.hash
        : url.pathname.split('/').pop() + url.search + url.hash;
      a.setAttribute('href', newHref);"""
          if old not in s:
              raise SystemExit('updateInternalLinks-blok niet gevonden')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          php -l aanmelden.php
          php -l ontstaan.php
          php -l baanreglement.php
          php -l media.php
          php -l fotoboek.php
          php -l bedankt.php
          node --check site-i18n.js
          rm -f .github/workflows/fix-relative-home-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use clean relative homepage links'
          git push origin main
