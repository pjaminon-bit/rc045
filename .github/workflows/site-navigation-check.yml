name: RC045 publieke navigatie testen

on:
  push:
    branches:
      - main
      - feature/shared-public-navigation-20261029
      - fix/unified-css-no-cache-20261029
      - fix/contrast-wcag-public-panel-20261030
      - fix/responsive-public-nav-20261030
      - fix/mobile-page-overflow-20261030
      - fix/registration-mobile-faq-accessibility-20261030
      - refactor/centralized-public-page-css-20261030
      - fix/bedankt-footer-css-version-cache-20261030
    paths:
      - 'site-nav.php'
      - 'site-styles.php'
      - 'site-css-version.php'
      - 'styles.css'
      - 'page-styles/**'
      - 'page-styles.php'
      - 'paneel.css'
      - 'tests/contrast-styles.test.cjs'
      - 'tests/public-css-centralization.test.cjs'
      - '*.php'
      - 'site-i18n.js'
      - 'tests/shared-navigation.test.cjs'
      - 'tests/responsive-navigation.mjs'
      - 'tests/registration-accessibility.mjs'
      - 'tests/registration-faq-fixture.json'
      - '.github/workflows/site-navigation-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PHP syntaxis controleren
        run: |
          set -euo pipefail
          php -l site-nav.php
          php -l site-styles.php
          php -l site-css-version.php
          php -l page-styles.php
          for file in index.php aanmelden.php baanreglement.php fotoboek.php media.php ontstaan.php bedankt.php; do
            php -l "$file"
          done

      - name: Gedeelde menustructuur testen
        run: node --test tests/shared-navigation.test.cjs

      - name: Centrale pagina-CSS en stylesheetvolgorde toetsen
        run: node --test tests/public-css-centralization.test.cjs

      - name: WCAG AA contrastwaarden en gedeelde opmaak testen
        run: node --test tests/contrast-styles.test.cjs

      - name: HTTP-headers en glow van stylesheet controleren
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8123 -t . >/tmp/rc045-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error -D /tmp/rc045-css-headers -o /tmp/rc045-css-body http://127.0.0.1:8123/site-styles.php
          grep -qi '^Content-Type: text/css' /tmp/rc045-css-headers
          grep -qi '^Cache-Control: .*no-store' /tmp/rc045-css-headers
          grep -Fq '.nav-links .nav-lid.nav-active a' /tmp/rc045-css-body
          grep -Fq '@keyframes navJoinGlow' /tmp/rc045-css-body
          css_version=$(php -r "require 'site-css-version.php'; echo rc045CssVersion('styles.css');")
          test "${#css_version}" = 16
          curl --fail --silent --show-error -D /tmp/rc045-css-version-headers -o /tmp/rc045-versioned-css-body "http://127.0.0.1:8123/site-styles.php?v=$css_version"
          grep -qi '^Cache-Control: public, max-age=31536000, immutable' /tmp/rc045-css-version-headers
          cmp /tmp/rc045-css-body /tmp/rc045-versioned-css-body
          curl --fail --silent --show-error -D /tmp/rc045-css-stale-headers -o /dev/null "http://127.0.0.1:8123/site-styles.php?v=0000000000000000"
          grep -qi '^Cache-Control: .*no-store' /tmp/rc045-css-stale-headers
          for page in index aanmelden baanreglement fotoboek media ontstaan bedankt; do
            curl --fail --silent --show-error -D /tmp/rc045-page-css-headers \
              -o /tmp/rc045-page-css-body "http://127.0.0.1:8123/page-styles.php?page=$page"
            grep -qi '^Content-Type: text/css' /tmp/rc045-page-css-headers
            grep -qi '^Cache-Control: .*no-store' /tmp/rc045-page-css-headers
            test -s /tmp/rc045-page-css-body
            page_version=$(PAGE="$page" php -r "require 'site-css-version.php'; echo rc045CssVersion('page-styles/' . getenv('PAGE') . '.css');")
            test "${#page_version}" = 16
            curl --fail --silent --show-error -D /tmp/rc045-page-version-headers -o /tmp/rc045-page-version-body "http://127.0.0.1:8123/page-styles.php?page=$page&v=$page_version"
            grep -qi '^Cache-Control: public, max-age=31536000, immutable' /tmp/rc045-page-version-headers
            cmp /tmp/rc045-page-css-body /tmp/rc045-page-version-body
            curl --fail --silent --show-error -D /tmp/rc045-page-stale-headers -o /dev/null "http://127.0.0.1:8123/page-styles.php?page=$page&v=0000000000000000"
            grep -qi '^Cache-Control: .*no-store' /tmp/rc045-page-stale-headers
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8123/page-styles.php?page=../../../etc/passwd')" = 404

  viewport:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 22 beschikbaar maken
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Responsive navigatie en mobiele paginabreedte testen met Chrome
        run: |
          set -euo pipefail
          google-chrome --version
          # Alleen de CI-runner krijgt testdata; servergegevens blijven ongemoeid.
          mkdir -p data
          cp tests/registration-faq-fixture.json data/faq.json
          php -S 127.0.0.1:8123 -t . >/tmp/rc045-responsive-php.log 2>&1 &
          php_pid=$!
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-allow-origins='*' --remote-debugging-port=9222 --user-data-dir=/tmp/rc045-nav-cdp about:blank >/tmp/rc045-responsive-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then tail -60 /tmp/rc045-responsive-chrome.log || true; tail -40 /tmp/rc045-responsive-php.log || true; fi; kill "$php_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          node tests/responsive-navigation.mjs
          node tests/registration-accessibility.mjs
