name: Eenmalige audit-hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pas audit-hardening toe
        run: |
          python3 .github/audit-hardening.py
          php -l auth.php
          php -l data-slot.php
          php -l changelog-historie.php
          git diff --check
          grep -q 'loginLockoutIpDrempel = 20' auth.php
          grep -q 'HTTP 503' data-slot.php
          grep -q 'contents: read' .github/workflows/deploy.yml
          grep -q 'SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64' .github/workflows/deploy.yml

      - name: Commit hardening
        run: |
          git config user.name 'pjaminon-bit'
          git config user.email 'pjaminon@me.com'
          git add auth.php data-slot.php changelog-historie.php
          git commit -m 'Harden login limits and data locking'
          git push origin HEAD:main
