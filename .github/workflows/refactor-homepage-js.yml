name: Eenmalige homepage JS refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-homepage-js.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Refactor homepage JavaScript
        run: |
          python3 .github/refactor-homepage-js.py
          php -l index.php
          php -l changelog-historie.php
          node --check homepage.js
          node --check site-i18n.js
          git diff --check
          test "$(grep -c '<script src="homepage.js"></script>' index.php)" -eq 1
          test "$(grep -c 'function initHomepage()' homepage.js)" -eq 1
          test "$(grep -c 'window.setLang = setLang;' homepage.js)" -eq 1
          test "$(grep -c "if (currentLang !== 'nl') setLang(currentLang);" homepage.js)" -eq 1
          ! grep -q 'function setLang(lang)' index.php
          ! grep -q 'data/contact.json' index.php
      - name: Controleer functionele ankers
        run: |
          grep -q "fetch('data/homepage.json'" homepage.js
          grep -q "fetch('data/agenda.json'" homepage.js
          grep -q "fetch('data/nieuws.json'" homepage.js
          grep -q "fetch('data/contact.json'" homepage.js
          grep -q "fetch('data/actueel.json'" homepage.js
          grep -q "fetch('data/rekentabel.json'" homepage.js
          grep -q 'function renderAgenda()' homepage.js
          grep -q 'function renderNieuws()' homepage.js
          grep -q 'function renderContact()' homepage.js
          grep -q 'function updateWeatherDisplay()' homepage.js
          grep -q "form.addEventListener('submit'" homepage.js
          grep -q "carousel.querySelector('.carousel-prev')" homepage.js
          grep -q 'new IntersectionObserver' homepage.js
      - name: Commit refactor
        run: |
          git config user.name 'pjaminon-bit'
          git config user.email 'pjaminon@me.com'
          git add index.php homepage.js changelog-historie.php
          git commit -m 'Refactor homepage JavaScript lifecycle'
          git push origin HEAD:main
