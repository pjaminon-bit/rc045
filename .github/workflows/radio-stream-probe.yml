name: Controle nieuwe radiostreams

on:
  pull_request:
    paths:
      - 'radio.html'
      - 'tests/radio-stream-probe.mjs'
      - '.github/workflows/radio-stream-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Externe MP3-streams controleren
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer HTTP status en audiotype
        run: node tests/radio-stream-probe.mjs
