name: Radio technische controles

on:
  pull_request:
    paths:
      - 'radio.html'
      - 'tests/radio-technical.test.cjs'
      - '.github/workflows/radio-technical-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Radio player & herstel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer radio zonder metadata-aanroepen
        run: node --test tests/radio-technical.test.cjs
