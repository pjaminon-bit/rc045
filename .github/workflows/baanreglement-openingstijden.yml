name: Eenmalige baanreglement-openingstijden patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baanreglement-openingstijden.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Pas functionele wijzigingen toe
        run: |
          python3 .github/baanreglement-openingstijden-v2.py
          php -l baanreglement.php
          php -l changelog-historie.php
          git diff --check
          grep -q "fetch('data/contact.json'" baanreglement.php
          grep -q "var baanreglementArtikelen = \[2, 3, 4, 5, 6, 7, 8, 9, 10\]" baanreglement.php

      - name: Commit wijzigingen
        run: |
          git config user.name 'pjaminon-bit'
          git config user.email 'pjaminon@me.com'
          git add baanreglement.php changelog-historie.php
          git commit -m 'Use managed opening hours in track regulations'
          git push origin HEAD:main
