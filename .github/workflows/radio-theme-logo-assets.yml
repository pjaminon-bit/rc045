name: Prepare local thematic radio logos

on:
  push:
    branches:
      - feature/radio-themalogos-20261019

permissions:
  contents: write

jobs:
  cache-logo-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/radio-themalogos-20261019
          persist-credentials: true
      - name: Install image libraries
        run: python -m pip install --disable-pip-version-check Pillow cairosvg
      - name: Download verified station images and generate fallbacks
        run: python scripts/build-radio-theme-logos.py
      - name: Commit only generated logo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radio/logos/themes/
          if ! git diff --cached --quiet; then
            git commit -m "Cache 45 themed radio logos locally"
            git push origin HEAD:feature/radio-themalogos-20261019
          else
            echo "All generated radio logos are already up to date."
          fi
