<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    id="themeColor"
    name="theme-color"
    content="#080a0f"
  >

  <link
    id="dynamicFavicon"
    rel="icon"
    href=""
  >

  <title>radio.</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #080a0f;
      --panel: rgba(255,255,255,.055);
      --panel-hover: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.09);

      --text: #f7f7f8;
      --muted: #9297a2;

      --accent: #e63946;
      --accent-rgb: 230,57,70;

      --logo-surface: #fff;

      --play-bg: #f7f7f8;
      --play-fg: #080a0f;

      --menu-bg: #171a21;

      --shadow:
        0 30px 80px rgba(0,0,0,.35);

      --radius-xl: 32px;
      --radius-lg: 22px;
    }


    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;

        --bg: #f3f5f8;

        --panel: rgba(255,255,255,.72);
        --panel-hover: rgba(255,255,255,.98);
        --border: rgba(15,18,24,.09);

        --text: #111318;
        --muted: #6f7581;

        --play-bg: #111318;
        --play-fg: #fff;

        --menu-bg: #fff;

        --shadow:
          0 26px 65px rgba(26,32,44,.13);
      }
    }


    * {
      box-sizing: border-box;
    }


    [hidden] {
      display: none !important;
    }


    html {
      -webkit-text-size-adjust: 100%;
    }


    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100svh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(var(--accent-rgb), .16),
          transparent 40%
        ),
        var(--bg);

      transition:
        background .45s ease,
        color .25s ease;
    }


    button,
    input {
      font: inherit;
    }


    button {
      color: inherit;
    }


    .app {
      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      min-height: 100svh;

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      padding:
        max(24px, env(safe-area-inset-top))
        0
        max(24px, env(safe-area-inset-bottom));
    }


    /* HEADER */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom:
        clamp(30px, 6vh, 70px);
    }


    .brand {
      display: flex;
      align-items: center;

      gap: 11px;

      font-size: 20px;
      font-weight: 760;

      letter-spacing: -.04em;
    }


    .brand-dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 5px rgba(var(--accent-rgb), .12),
        0 0 28px rgba(var(--accent-rgb), .65);

      transition:
        background .4s ease,
        box-shadow .4s ease;
    }


    .station-count {
      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }


    /* MAIN */

    main {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    /* PLAYER */

    .player {
      display: grid;

      grid-template-columns:
        minmax(220px, 330px)
        minmax(0, 1fr);

      gap:
        clamp(32px, 7vw, 85px);

      align-items: center;

      margin-bottom:
        clamp(42px, 8vh, 78px);
    }


    /* ARTWORK */

    .artwork {
      position: relative;

      aspect-ratio: 1;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius:
        var(--radius-xl);

      background:
        linear-gradient(
          145deg,
          rgba(var(--accent-rgb), .98),
          rgba(var(--accent-rgb), .42)
        );

      box-shadow:
        0 34px 80px rgba(var(--accent-rgb), .16),
        inset 0 1px 0 rgba(255,255,255,.2);

      transition:
        background .5s ease,
        box-shadow .5s ease;
    }


    .artwork::before,
    .artwork::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,.14);

      pointer-events: none;
    }


    .artwork::before {
      width: 76%;
      height: 76%;
    }


    .artwork::after {
      width: 48%;
      height: 48%;
    }


    .main-logo-surface {
      position: relative;
      z-index: 2;

      width: 58%;
      aspect-ratio: 1;

      display: grid;
      place-items: center;

      padding: 11%;

      border-radius: 26%;

      background:
        var(--logo-surface);

      box-shadow:
        0 18px 45px rgba(0,0,0,.17),
        inset 0 0 0 1px rgba(0,0,0,.04);
    }


    .main-station-logo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      image-rendering: auto;

      transition:
        opacity .2s ease,
        transform .25s ease;
    }


    .station-mark {
      display: none;

      color: #111318;

      font-size:
        clamp(42px, 6vw, 74px);

      font-weight: 850;

      line-height: 1;

      letter-spacing: -.075em;
    }


    .playing-indicator {
      position: absolute;

      right: 20px;
      bottom: 20px;

      z-index: 3;

      height: 35px;

      padding: 0 14px;

      display: flex;
      align-items: center;

      gap: 8px;

      border-radius: 999px;

      color: #fff;

      background:
        rgba(0,0,0,.36);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      font-size: 11px;
      font-weight: 750;

      letter-spacing: .08em;

      opacity: .72;
    }


    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #fff;
    }


    body.is-playing .live-dot {
      animation:
        pulse 1.5s infinite;
    }


    @keyframes pulse {
      50% {
        opacity: .25;

        transform:
          scale(.8);
      }
    }


    /* INFO */

    .player-info {
      min-width: 0;
    }


    .eyebrow {
      margin-bottom: 9px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: .13em;

      text-transform: uppercase;
    }


    h1 {
      margin: 0;

      max-width: 720px;

      font-size:
        clamp(40px, 6vw, 72px);

      font-weight: 790;

      line-height: .98;
      letter-spacing: -.065em;

      text-wrap: balance;
    }


    /* TRACK */

    .track {
      min-height: 58px;

      margin-top: 20px;

      transition:
        opacity .25s ease;
    }


    .track.loading {
      opacity: .45;
    }


    .track-artist {
      min-height: 22px;

      color: var(--text);

      font-size:
        clamp(16px, 2vw, 20px);

      font-weight: 650;

      letter-spacing: -.025em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track-title {
      min-height: 21px;

      margin-top: 4px;

      color: var(--muted);

      font-size:
        clamp(14px, 1.7vw, 17px);

      font-weight: 500;

      letter-spacing: -.015em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track.single .track-artist {
      display: none;
    }


    /* CONTROLS */

    .controls {
      display: flex;
      align-items: center;

      gap: 20px;

      margin-top: 27px;
    }


    .play-button {
      appearance: none;

      width: 72px;
      height: 72px;

      flex: 0 0 72px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background:
        var(--play-bg);

      color:
        var(--play-fg);

      cursor: pointer;

      box-shadow:
        var(--shadow);

      transition:
        transform .16s ease;
    }


    .play-button:hover {
      transform:
        scale(1.055);
    }


    .play-button:active {
      transform:
        scale(.96);
    }


    .play-button svg {
      width: 27px;
      height: 27px;
    }


    .play-icon {
      margin-left: 4px;
    }


    body.is-playing .play-icon {
      display: none;
    }


    .pause-icon {
      display: none;
    }


    body.is-playing .pause-icon {
      display: block;
    }


    .secondary-controls {
      width:
        min(310px, 100%);
    }


    .status {
      min-height: 20px;

      margin-bottom: 12px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 550;
    }


    .control-row {
      display: flex;
      align-items: center;

      gap: 10px;
    }


    .icon-button {
      appearance: none;

      width: 38px;
      height: 38px;

      flex: 0 0 38px;

      display: grid;
      place-items: center;

      padding: 0;

      border:
        1px solid transparent;

      border-radius: 12px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;

      transition:
        color .16s ease,
        background .16s ease,
        border-color .16s ease,
        box-shadow .16s ease,
        transform .16s ease;
    }


    .icon-button:hover {
      color: var(--text);

      background:
        var(--panel-hover);
    }


    .icon-button:active {
      transform:
        scale(.94);
    }


    .icon-button svg {
      width: 19px;
      height: 19px;
    }


    /* MUTE */

    .mute-button.muted {
      color: #fff;

      background: #e5484d;

      border-color: #e5484d;

      box-shadow:
        0 0 0 4px rgba(229,72,77,.20),
        0 8px 22px rgba(229,72,77,.22);
    }


    .volume-on-icon {
      display: block;
    }


    .volume-off-icon {
      display: none;
    }


    .mute-button.muted .volume-on-icon {
      display: none;
    }


    .mute-button.muted .volume-off-icon {
      display: block;
    }


    /* VOLUME */

    .volume-slider {
      flex: 1;

      min-width: 50px;
    }


    input[type="range"] {
      width: 100%;

      appearance: none;
      -webkit-appearance: none;

      height: 4px;

      border-radius: 999px;

      background:
        linear-gradient(
          to right,
          var(--text) 0,
          var(--text) var(--volume),
          rgba(128,128,128,.23) var(--volume),
          rgba(128,128,128,.23) 100%
        );

      cursor: pointer;
    }


    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background:
        var(--text);
    }


    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background:
        var(--text);
    }


    /* SLEEP */

    .sleep-wrap {
      position: relative;
    }


    .sleep-button {
      width: auto;

      min-width: 38px;

      padding: 0 10px;

      gap: 6px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .sleep-button.active {
      color: var(--accent);

      border-color:
        rgba(var(--accent-rgb), .28);

      background:
        rgba(var(--accent-rgb), .10);
    }


    .sleep-text {
      display: none;

      font-size: 11px;
      font-weight: 750;

      white-space: nowrap;
    }


    .sleep-button.active .sleep-text {
      display: block;
    }


    .sleep-menu {
      position: absolute;

      right: 0;
      bottom:
        calc(100% + 10px);

      z-index: 20;

      width: 150px;

      padding: 6px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      background:
        var(--menu-bg);

      box-shadow:
        0 20px 55px rgba(0,0,0,.20);
    }


    .sleep-option {
      appearance: none;

      width: 100%;

      padding: 10px 11px;

      border: 0;
      border-radius: 10px;

      background: transparent;

      color: var(--text);

      text-align: left;

      cursor: pointer;
    }


    .sleep-option:hover {
      background:
        var(--panel-hover);
    }


    /* STATIONS */

    .stations {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(145px, 1fr)
        );

      gap: 12px;
    }


    .station {
      position: relative;

      min-width: 0;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-lg);

      background:
        var(--panel);

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }


    .station:hover {
      background:
        var(--panel-hover);

      transform:
        translateY(-2px);
    }


    .station.active {
      border-color:
        rgba(var(--accent-rgb), .52);

      background:
        rgba(var(--accent-rgb), .11);
    }


    .station-select {
      appearance: none;

      width: 100%;

      min-height: 112px;

      padding: 17px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;

      border: 0;

      background: transparent;

      text-align: left;

      cursor: pointer;
    }


    /* LOGOS */

    .station-logo-wrap {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      padding: 5px;

      overflow: hidden;

      border-radius: 12px;

      background: #fff;

      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.05);
    }


    .station-logo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      image-rendering: auto;
    }


    .station-logo-fallback {
      display: none;

      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;

      color: #111318;

      font-size: 10px;
      font-weight: 850;
    }


    .station-name {
      width: 100%;

      margin-top: 18px;

      padding-right: 20px;

      overflow: hidden;

      font-size: 14px;
      font-weight: 680;

      letter-spacing: -.025em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    /* FAVORITES */

    .favorite-button {
      appearance: none;

      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 5;

      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      font-size: 18px;

      cursor: pointer;

      opacity: .48;

      transition:
        opacity .16s ease,
        color .16s ease,
        transform .16s ease;
    }


    .favorite-button:hover,
    .favorite-button.active {
      color: var(--accent);

      opacity: 1;
    }


    .favorite-button:active {
      transform:
        scale(.86);
    }


    footer {
      display: flex;
      justify-content: center;

      margin-top: 28px;

      color: var(--muted);

      opacity: .64;

      font-size: 11px;
    }


    :focus-visible {
      outline:
        2px solid var(--text);

      outline-offset: 4px;
    }


    @media (max-width: 760px) {

      .app {
        width:
          min(
            100% - 24px,
            620px
          );
      }


      header {
        margin-bottom: 32px;
      }


      .player {
        grid-template-columns: 1fr;

        gap: 26px;

        margin-bottom: 38px;
      }


      .artwork {
        width:
          min(58vw, 255px);

        justify-self: center;
      }


      .player-info {
        text-align: center;
      }


      h1 {
        margin-inline: auto;

        font-size:
          clamp(40px, 12vw, 60px);
      }


      .controls {
        justify-content: center;
      }


      .secondary-controls {
        width:
          min(300px, 100%);

        text-align: left;
      }


      .stations {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }


      footer {
        display: none;
      }
    }


    @media (max-width: 420px) {

      .app {
        width:
          calc(100% - 20px);
      }


      .station-count {
        display: none;
      }


      .artwork {
        width:
          min(54vw, 205px);

        border-radius: 26px;
      }


      .controls {
        flex-direction: column;

        gap: 18px;
      }


      .secondary-controls {
        width:
          min(290px, 92%);
      }


      .station-select {
        min-height: 97px;

        padding: 14px;
      }


      .station-logo-wrap {
        width: 38px;
        height: 38px;
      }
    }


    @media (prefers-reduced-motion: reduce) {

      * {
        transition-duration:
          .01ms !important;

        animation-duration:
          .01ms !important;
      }
    }
  </style>
</head>


<body>

<div class="app">

  <header>

    <div class="brand">
      <span class="brand-dot"></span>
      radio.
    </div>

    <div
      id="stationCount"
      class="station-count"
    ></div>

  </header>


  <main>

    <section class="player">

      <div class="artwork">

        <div class="main-logo-surface">

          <img
            id="mainStationLogo"
            class="main-station-logo"
            alt=""
          >

          <div
            id="stationMark"
            class="station-mark"
          ></div>

        </div>


        <div class="playing-indicator">

          <span class="live-dot"></span>

          LIVE

        </div>

      </div>


      <div class="player-info">

        <div class="eyebrow">
          Nu geselecteerd
        </div>


        <h1 id="stationTitle"></h1>


        <div
          id="trackInfo"
          class="track"
          aria-live="polite"
        >

          <div
            id="trackArtist"
            class="track-artist"
          ></div>

          <div
            id="trackTitle"
            class="track-title"
          >
            Trackinformatie ophalen…
          </div>

        </div>


        <div class="controls">

          <button
            id="playButton"
            class="play-button"
            type="button"
            aria-label="Afspelen"
          >

            <svg
              class="play-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M8 5v14l11-7z"/>
            </svg>

            <svg
              class="pause-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M7 5h4v14H7zm6 0h4v14h-4z"/>
            </svg>

          </button>


          <div class="secondary-controls">

            <div
              id="status"
              class="status"
            >
              Klaar om te luisteren
            </div>


            <div class="control-row">

              <button
                id="muteButton"
                class="icon-button mute-button"
                type="button"
                aria-label="Geluid dempen"
              >

                <svg
                  class="volume-on-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M11 5 6 9H2v6h4l5 4z"/>
                  <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                  <path d="M18 6a8 8 0 0 1 0 12"/>
                </svg>


                <svg
                  class="volume-off-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M11 5 6 9H2v6h4l5 4z"/>
                  <path d="m16 9 5 5"/>
                  <path d="m21 9-5 5"/>
                </svg>

              </button>


              <div class="volume-slider">

                <input
                  id="volume"
                  type="range"
                  min="0"
                  max="1"
                  step=".01"
                  value=".75"
                  aria-label="Volume"
                  style="--volume:75%"
                >

              </div>


              <div class="sleep-wrap">

                <button
                  id="sleepButton"
                  class="icon-button sleep-button"
                  type="button"
                  aria-label="Slaaptimer"
                  aria-expanded="false"
                >

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="8"/>
                    <path d="M12 8v4l2.5 2"/>
                  </svg>

                  <span
                    id="sleepText"
                    class="sleep-text"
                  ></span>

                </button>


                <div
                  id="sleepMenu"
                  class="sleep-menu"
                  hidden
                >

                  <button
                    class="sleep-option"
                    data-minutes="15"
                  >
                    15 minuten
                  </button>

                  <button
                    class="sleep-option"
                    data-minutes="30"
                  >
                    30 minuten
                  </button>

                  <button
                    class="sleep-option"
                    data-minutes="60"
                  >
                    60 minuten
                  </button>

                  <button
                    class="sleep-option"
                    data-minutes="0"
                  >
                    Timer uit
                  </button>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </section>


    <section
      id="stations"
      class="stations"
      aria-label="Radiostations"
    ></section>

  </main>


  <footer>
    Spatie: play/pauze · ← →: zender wisselen
  </footer>

</div>


<audio
  id="audio"
  preload="none"
></audio>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const METADATA_REFRESH =
  15000;


const REQUEST_TIMEOUT =
  6500;


const CORS_RELAYS = [

  url =>
    "https://api.allorigins.win/raw?url=" +
    encodeURIComponent(url),

  url =>
    "https://corsproxy.io/?url=" +
    encodeURIComponent(url)

];


/* =========================================================
   SHARP INLINE VECTOR LOGOS
   ========================================================= */

function makeWordLogo(
  text,
  background,
  foreground,
  fontSize = 62
) {

  const svg =
    `
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 300 160">
      <rect width="300"
            height="160"
            rx="22"
            fill="${background}"/>
      <text x="150"
            y="84"
            text-anchor="middle"
            dominant-baseline="middle"
            font-family="Arial,Helvetica,sans-serif"
            font-size="${fontSize}"
            font-weight="900"
            fill="${foreground}"
            letter-spacing="-2">
        ${text}
      </text>
    </svg>
    `;


  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );

}

function getStationLogo(

) {

function updateMainLogo() {

  const station =
    stations[
      currentIndex

  stationMark.textContent =
    station.mark;


  mainStationLogo.style.display =
    "block";


  stationMark.style.display =

);


/* =========================================================
   FAVORITES
   ========================================================= */

function getDisplayOrder() {

  return stations
    .map(
      (
        station,
        index
      ) => ({
        station,
        index
      })
    )
    .sort(
      (
        a,
        b
      ) => {

        const af =
          favoriteIds.has(
            a.station.id
          );


        const bf =
          favoriteIds.has(
            b.station.id
          );


        if (
          af !== bf
        ) {

          return af
            ? -1
            : 1;

        }


        return (
          a.index -
          b.index
        );

      }
    );

}


function toggleFavorite(
  index
) {

  const id =
    stations[
      index
    ].id;


  if (
    favoriteIds.has(
      id
    )
  ) {

    favoriteIds.delete(
      id
    );

  }

  else {

    favoriteIds.add(
      id
    );

  }


  localStorage.setItem(
    "radio-favorites",

    JSON.stringify(
      [
        ...favoriteIds
      ]
    )
  );


  renderStations();

}


/* =========================================================
   STATION CARDS
   ========================================================= */

function renderStations() {

  stationsContainer.innerHTML =
    "";


  for (
    const {
      station,
      index
    }
    of getDisplayOrder()
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "station";


    card.classList.toggle(
      "active",
      index ===
      currentIndex
    );


    const select =
      document.createElement(
        "button"
      );


    select.type =
      "button";


    select.className =
      "station-select";


    select.setAttribute(
      "aria-label",
      `Luister naar ${station.name}`
    );


    select.innerHTML = `

      <span
        class="station-logo-wrap"
      >

        <img
          class="station-logo"
          src="${getStationLogo(station)}"
          alt=""
          loading="lazy"
        >

        <span
          class="station-logo-fallback"
        >
          ${station.mark}
        </span>

      </span>


      <span
        class="station-name"
      >
        ${station.name}
      </span>

    `;


    const logo =
      select.querySelector(
        ".station-logo"
      );


    const fallback =
      select.querySelector(
        ".station-logo-fallback"
      );


    logo.addEventListener(
      "error",
      () => {

        logo.style.display =
          "none";


        fallback.style.display =
          "flex";

      }
    );


    select.addEventListener(
      "click",
      () => {

        selectStation(
          index,
          true
        );

      }
    );


    const favorite =
      document.createElement(
        "button"
      );


    const isFavorite =
      favoriteIds.has(
        station.id
      );


    favorite.type =
      "button";


    favorite.className =
      "favorite-button";


    favorite.classList.toggle(
      "active",
      isFavorite
    );


    favorite.textContent =
      isFavorite
        ? "★"
        : "☆";


    favorite.setAttribute(
      "aria-label",

      isFavorite
        ? `${station.name} uit favorieten`
        : `${station.name} toevoegen aan favorieten`
    );


    favorite.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        toggleFavorite(
          index
        );

      }
    );


    card.appendChild(
      select
    );


    card.appendChild(
      favorite
    );


    stationsContainer.appendChild(
      card
    );

  }


  const favs =
    favoriteIds.size;


  stationCount.textContent =
    favs
      ? `${stations.length} stations · ${favs} favoriet`
      : `${stations.length} stations`;

}


/* =========================================================
   SELECT STATION
   ========================================================= */

function selectStation(
  index,
  autoPlay = false
) {

  if (
    index === currentIndex &&
    audio.src
  ) {

    if (
      autoPlay &&
      audio.paused
    ) {

      play();

    }


    return;

  }


  const wasPlaying =
    !audio.paused;


  currentIndex =
    index;


  metadataGeneration++;


  const station =
    stations[
      currentIndex
    ];


  localStorage.setItem(
    "radio-station-id",
    station.id
  );


  stationTitle.textContent =
    station.name;


  stationMark.textContent =
    station.mark;


  document.documentElement
    .style
    .setProperty(
      "--accent",
      station.accent
    );


  document.documentElement
    .style
    .setProperty(
      "--accent-rgb",
      station.rgb
    );


  updateMainLogo();


  currentTrack = {
    artist: "",
    title: ""
  };


  setTrackLoading();


  audio.pause();


  audio.src =
    station.stream;


  audio.load();


  status.textContent =
    "Zender geselecteerd";


  renderStations();


  updateBrowserIdentity();


  updateMediaSession();


  refreshMetadata(
    true
  );


  if (
    wasPlaying ||
    autoPlay
  ) {

    play();

  }

}

/* =========================================================
   CLEAN TEXT
   ========================================================= */

function cleanText(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  const text =
    String(
      value
    )
    .replace(
      /[\u0000-\u001f\u007f]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();


  if (
    !text ||
    text.length > 250
  ) {

    return "";

  }


  const invalid = [

    /^unknown$/i,
    /^undefined$/i,
    /^null$/i,

    /^no metadata/i,
    /^no information/i,

    /^metadata unavailable$/i,

    /^not available$/i,
    /^unavailable$/i,

    /^sin información$/i,
    /^sin informacion$/i,
    /^sin datos$/i,

    /^sem informação$/i,
    /^sem informacao$/i,

    /^offline$/i

  ];


  if (
    invalid.some(
      regex =>
        regex.test(
          text
        )
    )
  ) {

    return "";

  }


  return text;

}


/* =========================================================
   ARTIST - TITLE SPLIT
   ========================================================= */

function splitTrack(
  value
) {

  const text =
    cleanText(
      value
    );


  if (
    !text
  ) {

    return null;

  }


  const separators = [
    " - ",
    " – ",
    " — ",
    " | "
  ];


  for (
    const separator
    of separators
  ) {

    const position =
      text.indexOf(
        separator
      );


    if (
      position <= 0
    ) {

      continue;

    }


    const artist =
      cleanText(
        text.slice(
          0,
          position
        )
      );


    const title =
      cleanText(
        text.slice(
          position +
          separator.length
        )
      );


    if (
      artist &&
      title
    ) {

      return {
        artist,
        title
      };

    }

  }


  return null;

}


/* =========================================================
   FETCH
   ========================================================= */

async function fetchTextWithTimeout(
  url,
  timeout =
    REQUEST_TIMEOUT
) {

  const controller =
    new AbortController();


  const timer =
    window.setTimeout(
      () =>
        controller.abort(),
      timeout
    );


  try {

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    return await response.text();

  }

  finally {

    clearTimeout(
      timer
    );

  }

}


async function fetchTextSmart(
  url,
  cacheBust = false
) {

  let target =
    url;


  if (
    cacheBust
  ) {

    const separator =
      target.includes("?")
        ? "&"
        : "?";


    target +=
      separator +
      "_radio=" +
      Math.floor(
        Date.now() /
        15000
      );

  }


  /*
   * Eerst direct.
   */

  try {

    return await fetchTextWithTimeout(
      target,
      2200
    );

  }

  catch {}


  /*
   * Daarna beide browserrelays tegelijk.
   */

  const attempts =
    CORS_RELAYS.map(
      relay =>
        fetchTextWithTimeout(
          relay(
            target
          ),
          REQUEST_TIMEOUT
        )
    );


  return await Promise.any(
    attempts
  );

}


async function fetchJsonSmart(
  url
) {

  const text =
    await fetchTextSmart(
      url,
      true
    );


  return JSON.parse(
    text
  );

}


/* =========================================================
   STATION NOISE
   ========================================================= */

function isStationNoise(
  value,
  station
) {

  const text =
    cleanText(
      value
    )
    .toLowerCase();


  if (
    !text
  ) {

    return true;

  }


  if (
    text ===
    "ad break"
  ) {

    return true;

  }


  if (
    /^dynamic break/i
      .test(
        text
      )
  ) {

    return true;

  }


  if (
    /^ad start/i
      .test(
        text
      )
  ) {

    return true;

  }


  for (
    const noise
    of station.noise || []
  ) {

    const lowered =
      noise.toLowerCase();


    if (
      text === lowered ||
      text.startsWith(
        lowered +
        " - "
      )
    ) {

      return true;

    }

  }


  return false;

}


/* =========================================================
   ONLINE RADIO BOX
   ========================================================= */

async function getOrbMetadata(
  provider,
  station
) {

  const html =
    await fetchTextSmart(
      provider.url,
      true
    );


  const doc =
    new DOMParser()
      .parseFromString(
        html,
        "text/html"
      );


  const rows =
    [
      ...doc.querySelectorAll(
        "tr"
      )
    ]
    .map(
      row => {

        const time =
          cleanText(
            row
              .querySelector(
                ".tablelist-schedule__time"
              )
              ?.textContent
          );


        const text =
          cleanText(
            row
              .querySelector(
                ".track_history_item"
              )
              ?.textContent
          );


        if (
          !time ||
          !text
        ) {

          return null;

        }


        return {

          time,

          text,

          active:
            row.classList
              .contains(
                "active"
              )

        };

      }
    )
    .filter(Boolean);


  if (
    !rows.length
  ) {

    return null;

  }


  if (
    provider.format ===
    "classical"
  ) {

    return parseClassicalRows(
      rows,
      station
    );

  }


  /*
   * Eerst LIVE.
   */

  for (
    const row
    of rows.slice(
      0,
      20
    )
  ) {

    if (
      row.time.toLowerCase() !==
        "live" &&
      !row.active
    ) {

      continue;

    }


    if (
      isStationNoise(
        row.text,
        station
      )
    ) {

      continue;

    }


    const split =
      splitTrack(
        row.text
      );


    if (
      split
    ) {

      return applyTrackOrder(
        split,
        provider
      );

    }

  }


  /*
   * Geen bruikbare LIVE-regel?
   * Pak de eerste echte track eronder.
   */

  for (
    const row
    of rows.slice(
      0,
      45
    )
  ) {

    if (
      isStationNoise(
        row.text,
        station
      )
    ) {

      continue;

    }


    const split =
      splitTrack(
        row.text
      );


    if (
      !split
    ) {

      continue;

    }


    return applyTrackOrder(
      split,
      provider
    );

  }


  return null;

}


function applyTrackOrder(
  split,
  provider
) {

  if (
    provider.order ===
    "title-artist"
  ) {

    return {

      artist:
        split.title,

      title:
        split.artist

    };

  }


  return split;

}


/* =========================================================
   KLARA / CLASSICAL
   ========================================================= */

function parseClassicalRows(
  rows,
  station
) {

  const useful =
    rows
      .slice(
        0,
        40
      )
      .filter(
        row =>
          !isStationNoise(
            row.text,
            station
          )
      );


  if (
    !useful.length
  ) {

    return null;

  }


  /*
   * Gewone artist-title heeft voorrang.
   */

  for (
    const row
    of useful.slice(
      0,
      10
    )
  ) {

    const split =
      splitTrack(
        row.text
      );


    if (
      split
    ) {

      return split;

    }

  }


  const groups =
    new Map();


  for (
    const row
    of useful
  ) {

    if (
      !/^\d{1,2}:\d{2}$/
        .test(
          row.time
        )
    ) {

      continue;

    }


    if (
      !groups.has(
        row.time
      )
    ) {

      groups.set(
        row.time,
        []
      );

    }


    const values =
      groups.get(
        row.time
      );


    if (
      !values.includes(
        row.text
      )
    ) {

      values.push(
        row.text
      );

    }


    if (
      values.length >= 3
    ) {

      const result =
        classifyClassical(
          values.slice(
            0,
            3
          )
        );


      if (
        result
      ) {

        return result;

      }

    }

  }


  const unique =
    [];


  for (
    const row
    of useful
  ) {

    if (
      !unique.includes(
        row.text
      )
    ) {

      unique.push(
        row.text
      );

    }


    if (
      unique.length === 3
    ) {

      break;

    }

  }


  return classifyClassical(
    unique
  );

}


function classifyClassical(
  values
) {

  values =
    values
      .map(
        cleanText
      )
      .filter(Boolean);


  if (
    values.length < 2
  ) {

    return null;

  }


  const workRegex =
    /(concerto|concert|sonat|symfon|symphon|suite|serenad|requiem|aria|partita|nocturne|prelude|fuga|fugue|rondo|opus|op\.|bwv|adagio|allegro|andante|wals|walz|mazurka|polonaise)/i;


  let workIndex =
    values.findIndex(
      value =>
        workRegex.test(
          value
        )
    );


  if (
    workIndex < 0
  ) {

    workIndex =
      values
        .map(
          (
            value,
            index
          ) => ({
            index,
            length:
              value.length
          })
        )
        .sort(
          (
            a,
            b
          ) =>
            b.length -
            a.length
        )[0]
        ?.index ?? 1;

  }


  const work =
    values[
      workIndex
    ];


  const composer =
    values.find(
      (
        value,
        index
      ) =>
        index !== workIndex &&
        !/\(|orchestra|orkest|ensemble|piano|violin|viool|cello|koor|choir|tenor|sopraan|bariton/i
          .test(
            value
          )
    ) ||
    values.find(
      (
        value,
        index
      ) =>
        index !== workIndex
    );


  if (
    !composer ||
    !work
  ) {

    return null;

  }


  return {

    artist:
      composer,

    title:
      work

  };

}


/* =========================================================
   NPO TRACK API
   ========================================================= */

async function getNpoMetadata(
  provider
) {

  const data =
    await fetchJsonSmart(
      provider.url
    );


  const candidates =
    [];


  findTrackObjects(
    data,
    candidates,
    0
  );


  if (
    !candidates.length
  ) {

    return null;

  }


  candidates.sort(
    (
      a,
      b
    ) =>
      b.score -
      a.score
  );


  return {

    artist:
      candidates[0]
        .artist,

    title:
      candidates[0]
        .title

  };

}


function findTrackObjects(
  value,
  results,
  depth
) {

  if (
    !value ||
    depth > 10
  ) {

    return;

  }


  if (
    Array.isArray(
      value
    )
  ) {

    value.forEach(
      child =>
        findTrackObjects(
          child,
          results,
          depth + 1
        )
    );


    return;

  }


  if (
    typeof value !==
    "object"
  ) {

    return;

  }


  const artist =
    extractArtist(

      value.artist ||
      value.artists ||
      value.performer ||
      value.performers

    );


  let title =
    cleanText(

      value.trackTitle ||
      value.track_title ||
      value.songTitle ||
      value.song_title ||
      value.title ||
      ""

    );


  if (
    artist &&
    !title
  ) {

    title =
      cleanText(
        value.name
      );

  }


  if (
    artist &&
    title &&
    artist.toLowerCase() !==
      title.toLowerCase()
  ) {

    let score =
      1;


    const state =
      JSON.stringify({

        state:
          value.state,

        status:
          value.status,

        current:
          value.current,

        playing:
          value.playing

      })
      .toLowerCase();


    if (
      state.includes(
        "current"
      ) ||
      state.includes(
        "playing"
      ) ||
      state.includes(
        "now"
      )
    ) {

      score +=
        100;

    }


    const timestamp =
      getTimestamp(
        value
      );


    if (
      timestamp
    ) {

      const ageMinutes =
        Math.abs(
          Date.now() -
          timestamp
        ) /
        60000;


      score +=
        Math.max(
          0,
          60 -
          ageMinutes
        );

    }


    results.push({

      artist,

      title,

      score

    });

  }


  for (
    const child
    of Object.values(
      value
    )
  ) {

    if (
      child &&
      typeof child ===
      "object"
    ) {

      findTrackObjects(
        child,
        results,
        depth + 1
      );

    }

  }

}


function extractArtist(
  value
) {

  if (
    !value
  ) {

    return "";

  }


  if (
    typeof value ===
    "string"
  ) {

    return cleanText(
      value
    );

  }


  if (
    Array.isArray(
      value
    )
  ) {

    return value
      .map(
        extractArtist
      )
      .filter(Boolean)
      .join(" & ");

  }


  if (
    typeof value ===
    "object"
  ) {

    return cleanText(

      value.name ||
      value.artist ||
      value.title ||
      ""

    );

  }


  return "";

}


function getTimestamp(
  value
) {

  const possible = [

    value.start,
    value.startTime,
    value.start_time,

    value.playedAt,
    value.played_at,

    value.timestamp

  ];


  for (
    const item
    of possible
  ) {

    if (
      !item
    ) {

      continue;

    }


    if (
      typeof item ===
      "number"
    ) {

      return (
        item >
        100000000000
      )
        ? item
        : item * 1000;

    }


    const time =
      Date.parse(
        item
      );


    if (
      Number.isFinite(
        time
      )
    ) {

      return time;

    }

  }


  return 0;

}


/* =========================================================
   TRITON — 538
   ========================================================= */

async function getTritonMetadata(
  provider
) {

  const url =

    "https://np.tritondigital.com/public/nowplaying" +

    "?mountName=" +
    encodeURIComponent(
      provider.mount
    ) +

    "&numberToFetch=5";


  const xml =
    await fetchTextSmart(
      url,
      true
    );


  const doc =
    new DOMParser()
      .parseFromString(
        xml,
        "application/xml"
      );


  if (
    doc.querySelector(
      "parsererror"
    )
  ) {

    return null;

  }


  const blocks =
    [
      ...doc.querySelectorAll(
        "nowplaying-info, cuepoint, track"
      )
    ];


  for (
    const block
    of blocks
  ) {

    const values =
      {};


    block
      .querySelectorAll(
        "property, attribute"
      )
      .forEach(
        item => {

          const name =
            (
              item.getAttribute(
                "name"
              ) ||
              ""
            )
            .toLowerCase();


          values[name] =
            cleanText(
              item.textContent
            );

        }
      );


    const artist =
      cleanText(

        values.track_artist_name ||
        values.cue_artist ||
        values.artist ||
        ""

      );


    const title =
      cleanText(

        values.cue_title ||
        values.track_title ||
        values.song_title ||
        ""

      );


    if (
      artist &&
      title
    ) {

      return {
        artist,
        title
      };

    }


    const split =
      splitTrack(

        values.streamtitle ||
        values.songtitle ||
        ""

      );


    if (
      split
    ) {

      return split;

    }

  }


  return null;

}


/* =========================================================
   BNR CURRENT PROGRAM
   ========================================================= */

async function getBnrMetadata(
  provider
) {

  const html =
    await fetchTextSmart(
      provider.url,
      true
    );


  const doc =
    new DOMParser()
      .parseFromString(
        html,
        "text/html"
      );


  doc
    .querySelectorAll(
      "script,style,noscript"
    )
    .forEach(
      element =>
        element.remove()
    );


  const lines =
    (
      doc.body?.innerText ||
      doc.body?.textContent ||
      ""
    )
    .split(/\r?\n/)
    .map(
      cleanText
    )
    .filter(Boolean);


  let start =
    lines.findIndex(
      line =>
        /^nu op de radio$/i
          .test(
            line
          )
    );


  if (
    start < 0
  ) {

    start =
      lines.findIndex(
        line =>
          /^bnr nieuwsradio$/i
            .test(
              line
            )
      );

  }


  const area =
    lines.slice(
      Math.max(
        0,
        start
      ),
      Math.max(
        0,
        start
      ) + 30
    );


  const skip = [

    /^nu op de radio$/i,

    /^bnr nieuwsradio$/i,

    /^live radio$/i,

    /^luister live$/i,

    /^kijk live$/i,

    /^straks$/i,

    /^net gemist$/i,

    /^bekijk programmagids$/i,

    /^nieuws$/i,

    /^muziek$/i,

    /^luister naar actueel nieuws/i

  ];


  for (
    const original
    of area
  ) {

    if (
      skip.some(
        regex =>
          regex.test(
            original
          )
      )
    ) {

      continue;

    }


    /*
     * Voorbeeld:
     *
     * Doorgelicht19:30 - 20:00 uur
     */

    const match =
      original.match(
        /^(.+?)\s*\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}\s*(?:uur)?$/i
      );


    if (
      match
    ) {

      const programme =
        cleanText(
          match[1]
        );


      if (
        programme
      ) {

        return {

          artist:
            "Nu op BNR",

          title:
            programme

        };

      }

    }

  }


  return {

    artist:
      "",

    title:
      "Live nieuws"

  };

}


/* =========================================================
   METADATA ROUTER
   ========================================================= */

async function resolveProvider(
  provider,
  station
) {

  switch (
    provider.type
  ) {

    case "npo":

      return await getNpoMetadata(
        provider
      );


    case "triton":

      return await getTritonMetadata(
        provider
      );


    case "orb":

      return await getOrbMetadata(
        provider,
        station
      );


    case "bnr":

      return await getBnrMetadata(
        provider
      );


    default:

      return null;

  }

}


/* =========================================================
   REFRESH METADATA
   ========================================================= */

async function refreshMetadata(
  showLoading = false
) {

  if (
    document.visibilityState ===
    "hidden"
  ) {

    return;

  }


  const generation =
    metadataGeneration;


  const stationIndex =
    currentIndex;


  const station =
    stations[
      stationIndex
    ];


  if (
    showLoading &&
    !currentTrack.title
  ) {

    setTrackLoading();

  }


  for (
    const provider
    of station.metadata
  ) {

    if (
      generation !==
        metadataGeneration ||
      stationIndex !==
        currentIndex
    ) {

      return;

    }


    try {

      const result =
        await resolveProvider(
          provider,
          station
        );


      if (
        generation !==
          metadataGeneration ||
        stationIndex !==
          currentIndex
      ) {

        return;

      }


      if (
        result?.title
      ) {

        if (
          setTrack(
            result.artist ||
            "",
            result.title
          )
        ) {

          console.debug(
            `[radio] ${station.name}: ${provider.type}`
          );


          return;

        }

      }

    }

    catch (error) {

      console.debug(
        `[radio] ${station.name}: ${provider.type} niet beschikbaar`
      );

    }

  }


  /*
   * Een tijdelijke fout verwijdert
   * een al bekende track niet.
   */

  if (
    !currentTrack.title
  ) {

    setTrackUnavailable();

  }

}


window.setInterval(
  () =>
    refreshMetadata(
      false
    ),
  METADATA_REFRESH
);


document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      refreshMetadata(
        false
      );


      updateSleepTimer();

    }

  }
);


/* =========================================================
   SLEEP TIMER
   ========================================================= */

function openSleepMenu() {

  sleepMenu.hidden =
    false;


  sleepButton.setAttribute(
    "aria-expanded",
    "true"
  );

}


function closeSleepMenu() {

  sleepMenu.hidden =
    true;


  sleepButton.setAttribute(
    "aria-expanded",
    "false"
  );

}


sleepButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();


    if (
      sleepMenu.hidden
    ) {

      openSleepMenu();

    }

    else {

      closeSleepMenu();

    }

  }
);


document
  .querySelectorAll(
    ".sleep-option"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          setSleepTimer(
            Number(
              button.dataset.minutes
            )
          );


          closeSleepMenu();

        }
      );

    }
  );


document.addEventListener(
  "click",
  event => {

    if (
      !event.target.closest(
        ".sleep-wrap"
      )
    ) {

      closeSleepMenu();

    }

  }
);


function setSleepTimer(
  minutes
) {

  if (
    !minutes
  ) {

    sleepUntil =
      0;


    localStorage.removeItem(
      "radio-sleep-until"
    );


    updateSleepTimer();


    return;

  }


  sleepUntil =
    Date.now() +
    minutes *
    60000;


  localStorage.setItem(
    "radio-sleep-until",
    String(
      sleepUntil
    )
  );


  updateSleepTimer();

}


function updateSleepTimer() {

  if (
    !sleepUntil
  ) {

    sleepButton
      .classList
      .remove(
        "active"
      );


    sleepText.textContent =
      "";


    return;

  }


  const remaining =
    sleepUntil -
    Date.now();


  if (
    remaining <= 0
  ) {

    sleepUntil =
      0;


    localStorage.removeItem(
      "radio-sleep-until"
    );


    sleepButton
      .classList
      .remove(
        "active"
      );


    sleepText.textContent =
      "";


    if (
      !audio.paused
    ) {

      pause(
        "Slaaptimer afgelopen"
      );

    }


    return;

  }


  const totalSeconds =
    Math.ceil(
      remaining /
      1000
    );


  const minutes =
    Math.floor(
      totalSeconds /
      60
    );


  const seconds =
    totalSeconds %
    60;


  sleepButton
    .classList
    .add(
      "active"
    );


  sleepText.textContent =
    `${minutes}:${
      String(
        seconds
      )
      .padStart(
        2,
        "0"
      )
    }`;

}


window.setInterval(
  updateSleepTimer,
  1000
);


/* =========================================================
   NEXT / PREVIOUS
   ========================================================= */

function nextStation() {

  const order =
    getDisplayOrder()
      .map(
        item =>
          item.index
      );


  const position =
    order.indexOf(
      currentIndex
    );


  const next =
    order[
      (
        position + 1
      ) %
      order.length
    ];


  selectStation(
    next,
    !audio.paused
  );

}


function previousStation() {

  const order =
    getDisplayOrder()
      .map(
        item =>
          item.index
      );


  const position =
    order.indexOf(
      currentIndex
    );


  const previous =
    order[
      (
        position -
        1 +
        order.length
      ) %
      order.length
    ];


  selectStation(
    previous,
    !audio.paused
  );

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      document.activeElement
        .tagName ===
      "INPUT"
    ) {

      return;

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();


      togglePlay();

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      event.preventDefault();


      nextStation();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      event.preventDefault();


      previousStation();

    }


    if (
      event.key ===
      "Escape"
    ) {

      closeSleepMenu();

    }

  }
);


/* =========================================================
   MEDIA SESSION
   ========================================================= */

function updateMediaSession() {

  if (
    !(
      "mediaSession"
      in navigator
    )
  ) {

    return;

  }


  const station =
    stations[
      currentIndex
    ];


  const metadata = {

    title:
      currentTrack.title ||
      station.name,

    artist:
      currentTrack.artist ||
      "Live radio",

    album:
      station.name

  };


  const logo =
    getStationLogo(
      station
    );


  try {

    if (
      logo
    ) {

      metadata.artwork = [
        {
          src:
            logo
        }
      ];

    }


    navigator
      .mediaSession
      .metadata =
      new MediaMetadata(
        metadata
      );

  }

  catch {

    delete metadata.artwork;


    navigator
      .mediaSession
      .metadata =
      new MediaMetadata(
        metadata
      );

  }

}


if (
  "mediaSession"
  in navigator
) {

  navigator
    .mediaSession
    .setActionHandler(
      "play",
      play
    );


  navigator
    .mediaSession
    .setActionHandler(
      "pause",
      pause
    );


  navigator
    .mediaSession
    .setActionHandler(
      "nexttrack",
      nextStation
    );


  navigator
    .mediaSession
    .setActionHandler(
      "previoustrack",
      previousStation
    );

}


/* =========================================================
   NETWORK
   ========================================================= */

window.addEventListener(
  "offline",
  () => {

    status.textContent =
      "Geen internetverbinding";

  }
);


window.addEventListener(
  "online",
  () => {

    status.textContent =
      audio.paused
        ? "Internetverbinding hersteld"
        : "Live";


    refreshMetadata(
      false
    );

  }
);


/* =========================================================
   START
   ========================================================= */

function initialise() {

  const station =
    stations[
      currentIndex
    ];


  stationTitle.textContent =
    station.name;


  stationMark.textContent =
    station.mark;


  document.documentElement
    .style
    .setProperty(
      "--accent",
      station.accent
    );


  document.documentElement
    .style
    .setProperty(
      "--accent-rgb",
      station.rgb
    );


  audio.src =
    station.stream;


  updateVolumeBar();


  updateMuteUI();


  updateMainLogo();


  renderStations();


  updateBrowserIdentity();


  updateMediaSession();


  updateSleepTimer();


  refreshMetadata(
    true
  );

}


initialise();

</script>
