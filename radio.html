<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    id="themeColor"
    content="#080a0f"
  >

  <link
    id="dynamicFavicon"
    rel="icon"
    href=""
  >

  <title>Radio</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #080a0f;
      --panel: rgba(255,255,255,.055);
      --panel-hover: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.09);

      --text: #f7f7f8;
      --muted: #9297a2;

      --accent: #e63946;
      --accent-rgb: 230,57,70;

      --logo-surface: rgba(255,255,255,.97);

      --play-bg: #f7f7f8;
      --play-fg: #080a0f;

      --menu-bg: #171a21;

      --shadow:
        0 30px 80px rgba(0,0,0,.35);

      --radius-xl: 32px;
      --radius-lg: 22px;
    }


    /* =========================================================
       LIGHT MODE — automatisch volgens OS
       ========================================================= */

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;

        --bg: #f3f5f8;

        --panel: rgba(255,255,255,.72);
        --panel-hover: rgba(255,255,255,.98);
        --border: rgba(15,18,24,.09);

        --text: #111318;
        --muted: #6f7581;

        --logo-surface: #ffffff;

        --play-bg: #111318;
        --play-fg: #ffffff;

        --menu-bg: #ffffff;

        --shadow:
          0 26px 65px rgba(26,32,44,.13);
      }
    }


    * {
      box-sizing: border-box;
    }


    [hidden] {
      display: none !important;
    }


    html {
      -webkit-text-size-adjust: 100%;
    }


    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100svh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(var(--accent-rgb), .16),
          transparent 40%
        ),
        var(--bg);

      transition:
        background .45s ease,
        color .25s ease;
    }


    button,
    input {
      font: inherit;
    }


    button {
      color: inherit;
    }


    .app {
      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      min-height: 100svh;

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      padding:
        max(24px, env(safe-area-inset-top))
        0
        max(24px, env(safe-area-inset-bottom));
    }


    /* =========================================================
       HEADER
       ========================================================= */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom:
        clamp(30px, 6vh, 70px);
    }


    .brand {
      display: flex;
      align-items: center;

      gap: 11px;

      font-size: 20px;
      font-weight: 760;

      letter-spacing: -.04em;
    }


    .brand-dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 5px
        rgba(var(--accent-rgb), .12),

        0 0 28px
        rgba(var(--accent-rgb), .65);

      transition:
        background .4s ease,
        box-shadow .4s ease;
    }


    .station-count {
      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    /* =========================================================
       PLAYER
       ========================================================= */

    .player {
      display: grid;

      grid-template-columns:
        minmax(220px, 330px)
        minmax(0, 1fr);

      gap:
        clamp(32px, 7vw, 85px);

      align-items: center;

      margin-bottom:
        clamp(42px, 8vh, 78px);
    }


    /* =========================================================
       ARTWORK
       ========================================================= */

    .artwork {
      position: relative;

      aspect-ratio: 1;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius:
        var(--radius-xl);

      background:
        linear-gradient(
          145deg,
          rgba(var(--accent-rgb), .98),
          rgba(var(--accent-rgb), .42)
        );

      box-shadow:
        0 34px 80px
        rgba(var(--accent-rgb), .16),

        inset 0 1px 0
        rgba(255,255,255,.2);

      transition:
        background .5s ease,
        box-shadow .5s ease;
    }


    .artwork::before,
    .artwork::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,.14);

      pointer-events: none;
    }


    .artwork::before {
      width: 76%;
      height: 76%;
    }


    .artwork::after {
      width: 48%;
      height: 48%;
    }


    .main-logo-surface {
      position: relative;

      z-index: 2;

      width: 58%;
      aspect-ratio: 1;

      display: grid;
      place-items: center;

      padding: 12%;

      border-radius: 26%;

      background:
        var(--logo-surface);

      box-shadow:
        0 18px 45px
        rgba(0,0,0,.17),

        inset 0 0 0 1px
        rgba(0,0,0,.04);
    }


    .main-station-logo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      image-rendering: auto;

      transition:
        opacity .2s ease,
        transform .25s ease;
    }


    .station-mark {
      display: none;

      color: #111318;

      font-size:
        clamp(42px, 6vw, 74px);

      font-weight: 850;

      line-height: 1;
      letter-spacing: -.075em;
    }


    .playing-indicator {
      position: absolute;

      right: 20px;
      bottom: 20px;

      z-index: 3;

      height: 35px;

      padding: 0 14px;

      display: flex;
      align-items: center;

      gap: 8px;

      border-radius: 999px;

      color: white;

      background:
        rgba(0,0,0,.36);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      font-size: 11px;
      font-weight: 750;

      letter-spacing: .08em;

      opacity: .72;
    }


    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: white;
    }


    body.is-playing
    .live-dot {
      animation:
        pulse 1.5s infinite;
    }


    @keyframes pulse {
      50% {
        opacity: .25;
        transform: scale(.8);
      }
    }


    /* =========================================================
       PLAYER INFO
       ========================================================= */

    .player-info {
      min-width: 0;
    }


    .eyebrow {
      margin-bottom: 9px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: .13em;
      text-transform: uppercase;
    }


    h1 {
      margin: 0;

      max-width: 720px;

      font-size:
        clamp(40px, 6vw, 72px);

      font-weight: 790;

      line-height: .98;
      letter-spacing: -.065em;

      text-wrap: balance;
    }


    /* =========================================================
       NOW PLAYING
       ========================================================= */

    .track {
      min-height: 58px;

      margin-top: 20px;

      transition:
        opacity .25s ease;
    }


    .track.loading {
      opacity: .45;
    }


    .track-artist {
      min-height: 22px;

      color: var(--text);

      font-size:
        clamp(16px, 2vw, 20px);

      font-weight: 650;

      letter-spacing: -.025em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track-title {
      min-height: 21px;

      margin-top: 4px;

      color: var(--muted);

      font-size:
        clamp(14px, 1.7vw, 17px);

      font-weight: 500;

      letter-spacing: -.015em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track-unavailable
    .track-artist {
      display: none;
    }


    /* =========================================================
       CONTROLS
       ========================================================= */

    .controls {
      display: flex;
      align-items: center;

      gap: 20px;

      margin-top: 27px;
    }


    .play-button {
      appearance: none;

      width: 72px;
      height: 72px;

      flex: 0 0 72px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background:
        var(--play-bg);

      color:
        var(--play-fg);

      cursor: pointer;

      box-shadow:
        var(--shadow);

      transition:
        transform .16s ease,
        opacity .16s ease;
    }


    .play-button:hover {
      transform:
        scale(1.055);
    }


    .play-button:active {
      transform:
        scale(.96);
    }


    .play-button svg {
      width: 27px;
      height: 27px;
    }


    .play-icon {
      margin-left: 4px;
    }


    body.is-playing
    .play-icon {
      display: none;
    }


    .pause-icon {
      display: none;
    }


    body.is-playing
    .pause-icon {
      display: block;
    }


    .secondary-controls {
      width:
        min(310px, 100%);
    }


    .status {
      min-height: 20px;

      margin-bottom: 12px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 550;
    }


    .control-row {
      display: flex;
      align-items: center;

      gap: 10px;
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .icon-button {
      appearance: none;

      width: 38px;
      height: 38px;

      flex: 0 0 38px;

      display: grid;
      place-items: center;

      padding: 0;

      border:
        1px solid transparent;

      border-radius: 12px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;

      transition:
        color .16s ease,
        background .16s ease,
        border-color .16s ease,
        box-shadow .16s ease,
        transform .16s ease;
    }


    .icon-button:hover {
      color: var(--text);

      background:
        var(--panel-hover);
    }


    .icon-button:active {
      transform:
        scale(.94);
    }


    .icon-button svg {
      width: 19px;
      height: 19px;
    }


    /* =========================================================
       MUTE
       ========================================================= */

    .mute-button.muted {
      color: white;

      background:
        var(--accent);

      border-color:
        var(--accent);

      box-shadow:
        0 0 0 4px
        rgba(var(--accent-rgb), .20),

        0 8px 22px
        rgba(var(--accent-rgb), .20);
    }


    .volume-on-icon {
      display: block;
    }


    .volume-off-icon {
      display: none;
    }


    .mute-button.muted
    .volume-on-icon {
      display: none;
    }


    .mute-button.muted
    .volume-off-icon {
      display: block;
    }


    /* =========================================================
       VOLUME
       ========================================================= */

    .volume-slider {
      flex: 1;

      min-width: 50px;
    }


    input[type="range"] {
      width: 100%;

      display: block;

      appearance: none;
      -webkit-appearance: none;

      height: 4px;

      border-radius: 999px;

      background:
        linear-gradient(
          to right,

          var(--text) 0,
          var(--text)
          var(--volume),

          rgba(128,128,128,.23)
          var(--volume),

          rgba(128,128,128,.23)
          100%
        );

      cursor: pointer;
    }


    input[type="range"]
    ::-webkit-slider-thumb {
      appearance: none;
    }


    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background:
        var(--text);
    }


    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background:
        var(--text);
    }


    /* =========================================================
       SLEEP TIMER
       ========================================================= */

    .sleep-wrap {
      position: relative;
    }


    .sleep-button {
      width: auto;

      min-width: 38px;

      padding: 0 10px;

      gap: 6px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .sleep-button.active {
      color:
        var(--accent);

      border-color:
        rgba(var(--accent-rgb), .28);

      background:
        rgba(var(--accent-rgb), .10);
    }


    .sleep-text {
      display: none;

      font-size: 11px;
      font-weight: 750;

      white-space: nowrap;
    }


    .sleep-button.active
    .sleep-text {
      display: block;
    }


    .sleep-menu {
      position: absolute;

      right: 0;
      bottom:
        calc(100% + 10px);

      z-index: 20;

      width: 150px;

      padding: 6px;

      border:
        1px solid
        var(--border);

      border-radius: 15px;

      background:
        var(--menu-bg);

      box-shadow:
        0 20px 55px
        rgba(0,0,0,.20);
    }


    .sleep-option {
      appearance: none;

      width: 100%;

      padding: 10px 11px;

      border: 0;
      border-radius: 10px;

      background: transparent;

      color: var(--text);

      text-align: left;

      font-size: 13px;

      cursor: pointer;
    }


    .sleep-option:hover {
      background:
        var(--panel-hover);
    }


    /* =========================================================
       STATIONS
       ========================================================= */

    .stations {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(145px, 1fr)
        );

      gap: 12px;
    }


    .station {
      position: relative;

      min-width: 0;

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius-lg);

      background:
        var(--panel);

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
    }


    .station:hover {
      background:
        var(--panel-hover);

      transform:
        translateY(-2px);
    }


    .station.active {
      border-color:
        rgba(var(--accent-rgb), .52);

      background:
        rgba(var(--accent-rgb), .11);

      box-shadow:
        inset 0 0 0 1px
        rgba(var(--accent-rgb), .07);
    }


    .station-select {
      appearance: none;

      width: 100%;

      min-height: 112px;

      padding: 17px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;

      border: 0;

      background: transparent;

      color: inherit;

      text-align: left;

      cursor: pointer;
    }


    /* =========================================================
       STATION LOGOS
       ========================================================= */

    .station-logo-wrap {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      padding: 5px;

      overflow: hidden;

      border-radius: 12px;

      background:
        var(--logo-surface);

      box-shadow:
        inset 0 0 0 1px
        rgba(0,0,0,.05);

      transition:
        box-shadow .18s ease,
        transform .18s ease;
    }


    .station:hover
    .station-logo-wrap {
      transform:
        scale(1.03);
    }


    .station.active
    .station-logo-wrap {
      box-shadow:
        0 0 0 2px
        rgba(var(--accent-rgb), .45),

        0 7px 22px
        rgba(var(--accent-rgb), .15);
    }


    .station-logo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      image-rendering: auto;
    }


    .station-logo-fallback {
      display: none;

      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;

      color: #111318;

      font-size: 10px;
      font-weight: 850;
    }


    .station-name {
      width: 100%;

      margin-top: 18px;

      padding-right: 20px;

      overflow: hidden;

      font-size: 14px;
      font-weight: 680;

      letter-spacing: -.025em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    /* =========================================================
       FAVORITES
       ========================================================= */

    .favorite-button {
      appearance: none;

      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 5;

      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      font-size: 18px;

      cursor: pointer;

      opacity: .48;

      transition:
        opacity .16s ease,
        background .16s ease,
        color .16s ease,
        transform .16s ease;
    }


    .station:hover
    .favorite-button {
      opacity: .8;
    }


    .favorite-button:hover {
      background:
        rgba(var(--accent-rgb), .11);

      color:
        var(--accent);

      opacity: 1;
    }


    .favorite-button.active {
      color:
        var(--accent);

      opacity: 1;
    }


    .favorite-button:active {
      transform:
        scale(.86);
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      display: flex;
      justify-content: center;

      margin-top: 28px;

      color: var(--muted);

      opacity: .64;

      font-size: 11px;
    }


    :focus-visible {
      outline:
        2px solid
        var(--text);

      outline-offset: 4px;
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 760px) {

      .app {
        width:
          min(
            100% - 24px,
            620px
          );
      }


      header {
        margin-bottom: 32px;
      }


      .player {
        grid-template-columns: 1fr;

        gap: 26px;

        margin-bottom: 38px;
      }


      .artwork {
        width:
          min(58vw, 255px);

        justify-self: center;
      }


      .player-info {
        text-align: center;
      }


      h1 {
        margin-inline: auto;

        font-size:
          clamp(40px, 12vw, 60px);
      }


      .track {
        margin-top: 16px;
      }


      .controls {
        justify-content: center;

        margin-top: 24px;
      }


      .secondary-controls {
        width:
          min(300px, 100%);

        text-align: left;
      }


      .stations {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }


      footer {
        display: none;
      }

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 420px) {

      .app {
        width:
          calc(100% - 20px);

        padding-top:
          max(
            18px,
            env(safe-area-inset-top)
          );
      }


      header {
        margin-bottom: 25px;
      }


      .station-count {
        display: none;
      }


      .artwork {
        width:
          min(54vw, 205px);

        border-radius: 26px;
      }


      .main-logo-surface {
        width: 59%;
        border-radius: 25%;
      }


      .playing-indicator {
        right: 14px;
        bottom: 14px;
      }


      .controls {
        flex-direction: column;

        gap: 18px;
      }


      .secondary-controls {
        width:
          min(290px, 92%);
      }


      .station-select {
        min-height: 97px;

        padding: 14px;
      }


      .station-logo-wrap {
        width: 38px;
        height: 38px;

        padding: 4px;

        border-radius: 10px;
      }


      .station-name {
        margin-top: 13px;

        font-size: 13px;
      }


      .favorite-button {
        top: 9px;
        right: 9px;
      }

    }


    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration:
          .01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          .01ms !important;
      }

    }

  </style>
</head>


<body>

<div class="app">


  <header>

    <div class="brand">

      <span class="brand-dot"></span>

      radio.

    </div>


    <div
      class="station-count"
      id="stationCount"
    ></div>

  </header>


  <main>


    <section
      class="player"
      aria-label="Radioplayer"
    >


      <div class="artwork">


        <div
          class="main-logo-surface"
          aria-hidden="true"
        >

          <img
            class="main-station-logo"
            id="mainStationLogo"
            src=""
            alt=""
          >


          <div
            class="station-mark"
            id="stationMark"
          >
            1
          </div>

        </div>


        <div class="playing-indicator">

          <span class="live-dot"></span>

          LIVE

        </div>

      </div>


      <div class="player-info">


        <div class="eyebrow">
          Nu geselecteerd
        </div>


        <h1 id="stationTitle">
          NPO Radio 1
        </h1>


        <div
          class="track"
          id="trackInfo"
          aria-live="polite"
        >

          <div
            class="track-artist"
            id="trackArtist"
          ></div>


          <div
            class="track-title"
            id="trackTitle"
          >
            Trackinformatie ophalen…
          </div>

        </div>


        <div class="controls">


          <button
            class="play-button"
            id="playButton"
            type="button"
            aria-label="Afspelen"
          >

            <svg
              class="play-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M8 5v14l11-7z"/>
            </svg>


            <svg
              class="pause-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M7 5h4v14H7zm6 0h4v14h-4z"
              />
            </svg>

          </button>


          <div class="secondary-controls">


            <div
              class="status"
              id="status"
              aria-live="polite"
            >
              Klaar om te luisteren
            </div>


            <div class="control-row">


              <button
                class="icon-button mute-button"
                id="muteButton"
                type="button"
                aria-label="Geluid dempen"
              >

                <svg
                  class="volume-on-icon"
                  viewBox="0 0 24 24"

  function getStationLogo(
    station,
    size = 256

    if (station.logo) {
      return station.logo;

    if (station.logoDomain) {

      return (
        "https://www.google.com/s2/favicons" +
        "?domain=" +
        encodeURIComponent(
          station.logoDomain

        "&sz=" +
        size

    return "";

  }

      "block";

    mainStationLogo.style.transform =

  /* =========================================================
     FAVORITES
     ========================================================= */

  function getDisplayOrder() {

    return stations
      .map(
        (station, index) => ({
          station,
          index
        })
      )
      .sort(
        (a, b) => {

          const aFavorite =
            favoriteIds.has(
              a.station.id
            );


          const bFavorite =
            favoriteIds.has(
              b.station.id
            );


          if (
            aFavorite !==
            bFavorite
          ) {

            return aFavorite
              ? -1
              : 1;

          }


          return (
            a.index -
            b.index
          );

        }
      );

  }


  function toggleFavorite(
    index
  ) {

    const station =
      stations[index];


    if (
      favoriteIds.has(
        station.id
      )
    ) {

      favoriteIds.delete(
        station.id
      );

    }

    else {

      favoriteIds.add(
        station.id
      );

    }


    localStorage.setItem(
      "radio-favorites",

      JSON.stringify(
        [...favoriteIds]
      )
    );


    renderStations();

  }


  /* =========================================================
     STATION CARDS
     ========================================================= */

  function renderStations() {

    stationsContainer.innerHTML =
      "";


    const ordered =
      getDisplayOrder();


    ordered.forEach(
      ({station, index}) => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "station";


        if (
          index ===
          currentIndex
        ) {

          card.classList.add(
            "active"
          );

        }


        const select =
          document.createElement(
            "button"
          );


        select.type =
          "button";


        select.className =
          "station-select";


        select.setAttribute(
          "aria-label",
          `Luister naar ${station.name}`
        );


        select.setAttribute(
          "aria-pressed",
          index === currentIndex
            ? "true"
            : "false"
        );


        const logo =
          getStationLogo(
            station,
            256
          );


        select.innerHTML = `

          <span
            class="station-logo-wrap"
          >

            <img
              class="station-logo"
              src="${logo}"
              alt=""
              loading="lazy"
            >

            <span
              class="station-logo-fallback"
            >
              ${station.mark}
            </span>

          </span>


          <span
            class="station-name"
          >
            ${station.name}
          </span>

        `;


        const logoImage =
          select.querySelector(
            ".station-logo"
          );


        const fallback =
          select.querySelector(
            ".station-logo-fallback"
          );


        logoImage.addEventListener(
          "error",
          () => {

            logoImage.style.display =
              "none";


            fallback.style.display =
              "flex";

          }
        );


        select.addEventListener(
          "click",
          () => {

            selectStation(
              index,
              true
            );

          }
        );


        const favorite =
          document.createElement(
            "button"
          );


        favorite.type =
          "button";


        favorite.className =
          "favorite-button";


        const isFavorite =
          favoriteIds.has(
            station.id
          );


        favorite.classList.toggle(
          "active",
          isFavorite
        );


        favorite.textContent =
          isFavorite
            ? "★"
            : "☆";


        favorite.setAttribute(
          "aria-label",
          isFavorite
            ? `${station.name} uit favorieten verwijderen`
            : `${station.name} aan favorieten toevoegen`
        );


        favorite.addEventListener(
          "click",
          event => {

            event.stopPropagation();


            toggleFavorite(
              index
            );

          }
        );


        card.appendChild(
          select
        );


        card.appendChild(
          favorite
        );


        stationsContainer.appendChild(
          card
        );

      }
    );


    const favorites =
      favoriteIds.size;


    stationCount.textContent =
      favorites
        ? `${stations.length} stations · ${favorites} favoriet`
        : `${stations.length} stations`;

  }


  /* =========================================================
     SELECT STATION
     ========================================================= */

  function selectStation(
    index,
    autoPlay = false
  ) {

    if (
      index === currentIndex &&
      audio.src
    ) {

      if (
        autoPlay &&
        audio.paused
      ) {

        play();

      }


      return;

    }


    const wasPlaying =
      !audio.paused;


    currentIndex =
      index;


    /*
     * Alle nog lopende metadata
     * van de vorige zender negeren.
     */

    metadataGeneration++;


    const station =
      stations[
        currentIndex
      ];


    localStorage.setItem(
      "radio-station-id",
      station.id
    );


    stationTitle.textContent =
      station.name;


    stationMark.textContent =
      station.mark;


    document
      .documentElement
      .style
      .setProperty(
        "--accent",
        station.accent
      );


    document
      .documentElement
      .style
      .setProperty(
        "--accent-rgb",
        station.rgb
      );


    updateMainLogo();


    currentTrack = {
      artist: "",
      title: ""
    };


    setTrackLoading();


    audio.pause();


    audio.src =
      station.stream;


    audio.load();


    status.textContent =
      "Zender geselecteerd";


    renderStations();


    updateBrowserIdentity();


    refreshMetadata(
      true
    );


    updateMediaSession();


    if (
      wasPlaying ||
      autoPlay
    ) {

      play();

    }

  }


  /* =========================================================
     PLAY / PAUSE
     ========================================================= */

  async function play() {

    if (!audio.src) {

      const station =
        stations[
          currentIndex
        ];


      audio.src =
        station.stream;


      audio.load();

    }


    status.textContent =
      "Verbinden…";


    try {

      await audio.play();

    }

    catch (error) {

      console.error(
        "Stream kon niet worden gestart:",
        error
      );


      document
        .body
        .classList
        .remove(
          "is-playing"
        );


      status.textContent =
        "Kan de stream niet starten";


      updateBrowserIdentity();

    }

  }


  function pause(
    customStatus =
      "Gepauzeerd"
  ) {

    audio.pause();


    document
      .body
      .classList
      .remove(
        "is-playing"
      );


    status.textContent =
      customStatus;


    updateBrowserIdentity();

  }


  function togglePlay() {

    if (audio.paused) {

      play();

    }

    else {

      pause();

    }

  }


  playButton.addEventListener(
    "click",

  function formatRemaining(
    milliseconds
  ) {

    const totalSeconds =
      Math.max(
        0,
        Math.ceil(
          milliseconds /
          1000
        )
      );


    const minutes =
      Math.floor(
        totalSeconds /
        60
      );


    const seconds =
      totalSeconds % 60;


    return (
      `${minutes}:` +
      String(seconds)
        .padStart(
          2,
          "0"
        )
    );

  }

  /* =========================================================
     METADATA CLEANING
     ========================================================= */

  const SYSTEM_TEXT_PATTERNS = [

    /^sin\s+(informaci[oó]n|datos|t[ií]tulo|artista)/i,
    /^informaci[oó]n\s+no\s+disponible/i,
    /^no\s+hay\s+/i,
    /^no\s+se\s+(encontr[oó]|pudo|puede)/i,

    /^sem\s+(informa[cç][aã]o|dados)/i,
    /^n[aã]o\s+(dispon[ií]vel|encontrado)/i,

    /^no\s+(information|metadata|data|song|title|artist)/i,
    /^metadata\s+(unavailable|not available)/i,

    /^unknown(\s+(artist|title|song))?$/i,
    /^not\s+available$/i,
    /^unavailable$/i,

    /^failed\s+to/i,
    /^error\b/i,

    /^offline$/i,
    /^undefined$/i,
    /^null$/i,

    /^http[s]?:\/\//i,
    /^<[^>]+>/i

  ];


  function cleanMetadataText(
    value
  ) {

    if (
      value === undefined ||
      value === null
    ) {

      return "";

    }


    if (
      typeof value !==
      "string"
    ) {

      value =
        String(value);

    }


    const cleaned =
      value
        .replace(
          /[\u0000-\u001F\u007F]/g,
          " "
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();


    if (
      !cleaned ||
      cleaned.length > 220
    ) {

      return "";

    }


    if (
      SYSTEM_TEXT_PATTERNS.some(
        pattern =>
          pattern.test(
            cleaned
          )
      )
    ) {

      return "";

    }


    return cleaned;

  }


  function validTrack(
    track
  ) {

    if (!track) {
      return false;
    }


    const artist =
      cleanMetadataText(
        track.artist
      );


    const title =
      cleanMetadataText(
        track.title
      );


    if (
      !artist ||
      !title
    ) {

      return false;

    }


    if (
      artist.toLowerCase() ===
      title.toLowerCase()
    ) {

      return false;

    }


    return true;

  }


  function splitArtistTitle(
    value
  ) {

    const text =
      cleanMetadataText(
        value
      );


    if (!text) {
      return null;
    }


    const separators = [
      " - ",
      " – ",
      " — ",
      " | "
    ];


    for (
      const separator
      of separators
    ) {

      const index =
        text.indexOf(
          separator
        );


      if (
        index <= 0
      ) {

        continue;

      }


      const artist =
        cleanMetadataText(
          text.slice(
            0,
            index
          )
        );


      const title =
        cleanMetadataText(
          text.slice(
            index +
            separator.length
          )
        );


      if (
        artist &&
        title
      ) {

        return {
          artist,
          title
        };

      }

    }


    return null;

  }


  function valueToArtist(
    value
  ) {

    if (!value) {
      return "";
    }


    if (
      typeof value ===
      "string"
    ) {

      return cleanMetadataText(
        value
      );

    }


    if (
      Array.isArray(value)
    ) {

      return value
        .map(
          valueToArtist
        )
        .filter(Boolean)
        .join(" & ");

    }


    if (
      typeof value ===
      "object"
    ) {

      return cleanMetadataText(

        value.name ||
        value.artist ||
        value.title ||
        value.value ||
        ""

      );

    }


    return "";

  }


  /* =========================================================
     FETCH HELPERS
     ========================================================= */

  async function fetchTextDirect(
    url
  ) {

    const controller =
      new AbortController();


    const timer =
      window.setTimeout(
        () =>
          controller.abort(),
        REQUEST_TIMEOUT
      );


    try {

      const response =
        await fetch(
          url,
          {
            signal:
              controller.signal,

            cache:
              "no-store"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      return await response.text();

    }

    finally {

      clearTimeout(
        timer
      );

    }

  }


  /*
   * Probeer eerst rechtstreeks.
   * Alleen wanneer CORS/server dat blokkeert
   * gebruiken we de raw metadata-proxy.
   */

  async function fetchTextSmart(
    url,
    allowProxy = true
  ) {

    try {

      return await fetchTextDirect(
        url
      );

    }

    catch (directError) {

      if (!allowProxy) {

        throw directError;

      }


      const proxyUrl =
        CORS_FALLBACK +
        encodeURIComponent(
          url
        );


      return await fetchTextDirect(
        proxyUrl
      );

    }

  }


  async function fetchJsonSmart(
    url,
    allowProxy = true
  ) {

    const text =
      await fetchTextSmart(
        url,
        allowProxy
      );


    return JSON.parse(
      text
    );

  }


  /* =========================================================
     NPO METADATA
     ========================================================= */

  function getPossibleTime(
    object
  ) {

    const values = [

      object.start,
      object.startTime,
      object.start_time,
      object.startDate,
      object.startDateTime,
      object.playedAt,
      object.played_at,
      object.date,
      object.datetime,
      object.timestamp

    ];


    for (
      const value
      of values
    ) {

      if (
        value === undefined ||
        value === null
      ) {

        continue;

      }


      if (
        typeof value ===
        "number"
      ) {

        /*
         * seconden of milliseconden.
         */

        return value > 100000000000
          ? value
          : value * 1000;

      }


      const parsed =
        Date.parse(
          value
        );


      if (
        Number.isFinite(
          parsed
        )
      ) {

        return parsed;

      }

    }


    return 0;

  }


  function extractNpoTrack(
    data
  ) {

    const candidates =
      [];


    let order =
      0;


    function walk(
      node,
      depth = 0
    ) {

      if (
        node === null ||
        node === undefined ||
        depth > 9
      ) {

        return;

      }


      if (
        Array.isArray(
          node
        )
      ) {

        node.forEach(
          child =>
            walk(
              child,
              depth + 1
            )
        );


        return;

      }


      if (
        typeof node !==
        "object"
      ) {

        return;

      }


      const artist =
        valueToArtist(

          node.artist ||
          node.artists ||
          node.performer ||
          node.performers ||
          node.creator

        );


      let title =
        cleanMetadataText(

          node.title ||
          node.trackTitle ||
          node.track_title ||
          node.songTitle ||
          node.song_title ||
          ""

        );


      /*
       * Sommige NPO-objecten gebruiken
       * name voor de tracknaam.
       * Alleen accepteren als er ook
       * daadwerkelijk een artiest bestaat.
       */

      if (
        artist &&
        !title
      ) {

        title =
          cleanMetadataText(
            node.name
          );

      }


      if (
        artist &&
        title
      ) {

        let score =
          0;


        const serial =
          JSON.stringify({

            status:
              node.status,

            state:
              node.state,

            playing:
              node.playing,

            current:
              node.current

          })
          .toLowerCase();


        if (
          serial.includes(
            "current"
          ) ||
          serial.includes(
            "playing"
          ) ||
          serial.includes(
            "now"
          )
        ) {

          score +=
            100;

        }


        const time =
          getPossibleTime(
            node
          );


        if (time) {

          const age =
            Math.abs(
              Date.now() -
              time
            );


          /*
           * Recentste tracks krijgen
           * voorrang.
           */

          score +=
            Math.max(
              0,
              60 -
              age /
              60000
            );

        }


        candidates.push({

          artist,
          title,
          time,
          score,
          order:
            order++

        });

      }


      Object
        .values(node)
        .forEach(
          child => {

            if (
              typeof child ===
              "object" &&
              child !== null
            ) {

              walk(
                child,
                depth + 1
              );

            }

          }
        );

    }


    walk(
      data
    );


    if (
      !candidates.length
    ) {

      return null;

    }


    candidates.sort(
      (a, b) => {

        if (
          b.score !==
          a.score
        ) {

          return (
            b.score -
            a.score
          );

        }


        if (
          a.time &&
          b.time
        ) {

          return (
            b.time -
            a.time
          );

        }


        return (
          a.order -
          b.order
        );

      }
    );


    return {
      artist:
        candidates[0].artist,

      title:
        candidates[0].title
    };

  }


  async function resolveNpo(
    provider
  ) {

    const data =
      await fetchJsonSmart(
        provider.url
      );


    return extractNpoTrack(
      data
    );

  }


  /* =========================================================
     ICECAST METADATA
     ========================================================= */

  async function resolveIcecast(
    provider
  ) {

    const url =
      provider.root
        .replace(/\/+$/, "") +
      "/status-json.xsl";


    const data =
      await fetchJsonSmart(
        url
      );


    let sources =
      data
        ?.icestats
        ?.source;


    if (!sources) {

      return null;

    }


    if (
      !Array.isArray(
        sources
      )
    ) {

      sources = [
        sources
      ];

    }


    const wanted =
      String(
        provider.mount ||
        ""
      )
      .toLowerCase();


    let source =
      null;


    if (wanted) {

      source =
        sources.find(
          item => {

            const haystack =
              [

                item.listenurl,
                item.server_url,
                item.server_name,
                item.mount

              ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


            return haystack.includes(
              wanted
            );

          }
        );

    }


    /*
     * Bij een server met maar één mount
     * is selectie niet nodig.
     */

    if (
      !source &&
      sources.length === 1
    ) {

      source =
        sources[0];

    }


    /*
     * Relaxtere match voor bijvoorbeeld
     * DPG redirectnamen.
     */

    if (
      !source &&
      wanted
    ) {

      const pieces =
        wanted
          .replace(
            /\.mp3$/i,
            ""
          )
          .split(
            /[-_/]+/
          )
          .filter(
            piece =>
              piece.length >= 3
          );


      source =
        sources.find(
          item => {

            const haystack =
              JSON.stringify(
                item
              )
              .toLowerCase();


            return pieces.some(
              piece =>
                haystack.includes(
                  piece
                )
            );

          }
        );

    }


    if (!source) {

      return null;

    }


    const explicitArtist =
      valueToArtist(

        source.artist ||
        source.track_artist_name ||
        source.performer

      );


    const explicitTitle =
      cleanMetadataText(

        source.song ||
        source.track ||
        source.track_title ||
        source.cue_title

      );


    if (
      explicitArtist &&
      explicitTitle
    ) {

      return {
        artist:
          explicitArtist,

        title:
          explicitTitle
      };

    }


    const combined =
      source.title ||
      source.songtitle ||
      source.streamtitle ||
      "";


    return splitArtistTitle(
      combined
    );

  }


  /* =========================================================
     TRITON / STREAMTHEWORLD — RADIO 538
     ========================================================= */

  function readTritonAttributes(
    element
  ) {

    const values =
      {};


    element
      .querySelectorAll(
        "property, attribute"
      )
      .forEach(
        property => {

          const name =
            (
              property.getAttribute(
                "name"
              ) ||
              ""
            )
            .toLowerCase();


          if (!name) {
            return;
          }


          values[name] =
            cleanMetadataText(
              property.textContent
            );

        }
      );


    return values;

  }


  async function resolveTriton(
    provider
  ) {

    const url =

      "https://np.tritondigital.com/public/nowplaying" +

      "?mountName=" +
      encodeURIComponent(
        provider.mount
      ) +

      "&numberToFetch=5" +

      "&eventType=track";


    const xml =
      await fetchTextSmart(
        url
      );


    const documentXml =
      new DOMParser()
        .parseFromString(
          xml,
          "application/xml"
        );


    if (
      documentXml
        .querySelector(
          "parsererror"
        )
    ) {

      return null;

    }


    const blocks =
      [

        ...documentXml
          .querySelectorAll(
            "nowplaying-info, cuepoint, track"
          )

      ];


    for (
      const block
      of blocks
    ) {

      const data =
        readTritonAttributes(
          block
        );


      const artist =
        cleanMetadataText(

          data.track_artist_name ||
          data.cue_artist ||
          data.artist ||
          data.artist_name

        );


      const title =
        cleanMetadataText(

          data.cue_title ||
          data.track_title ||
          data.title ||
          data.song_title

        );


      if (
        artist &&
        title
      ) {

        return {
          artist,
          title
        };

      }


      const combined =

        data.streamtitle ||
        data.songtitle ||
        data.title;


      const split =
        splitArtistTitle(
          combined
        );


      if (split) {

        return split;

      }

    }


    /*
     * Sommige responses hebben de
     * properties direct onder root.
     */

    const rootData =
      readTritonAttributes(
        documentXml
      );


    const artist =
      cleanMetadataText(

        rootData.track_artist_name ||
        rootData.cue_artist ||
        rootData.artist

      );


    const title =
      cleanMetadataText(

        rootData.cue_title ||
        rootData.track_title ||
        rootData.title

      );


    if (
      artist &&
      title
    ) {

      return {
        artist,
        title
      };

    }


    return null;

  }


  /* =========================================================
     TWJ GENERIC STREAM METADATA
     ========================================================= */

  async function resolveTwj(
    station
  ) {

    const url =
      TWJ_API +
      "?url=" +
      encodeURIComponent(
        station.stream
      );


    /*
     * Deze API is juist voor
     * browsergebruik bedoeld,
     * dus geen extra proxy nodig.
     */

    const data =
      await fetchJsonSmart(
        url,
        false
      );


    const artist =
      cleanMetadataText(
        data.artist
      );


    const song =
      cleanMetadataText(
        data.song
      );


    if (
      artist &&
      song
    ) {

      return {
        artist,
        title:
          song
      };

    }


    const split =
      splitArtistTitle(

        data.songtitle ||
        data.streamtitle ||
        data.currentSong ||
        ""

      );


    if (split) {

      return split;

    }


    /*
     * AzuraCast-achtige response
     */

    const azArtist =
      cleanMetadataText(
        data
          ?.now_playing
          ?.song
          ?.artist
      );


    const azTitle =
      cleanMetadataText(
        data
          ?.now_playing
          ?.song
          ?.title
      );


    if (
      azArtist &&
      azTitle
    ) {

      return {
        artist:
          azArtist,

        title:
          azTitle
      };

    }


    return null;

  }


  /* =========================================================
     OFFICIËLE PLAYLISTPAGINA FALLBACK
     ========================================================= */

  const PLAYLIST_NOISE = [

    "open of sluit track acties",
    "voeg toe aan spotify",
    "open in apple music",
    "speel fragment",
    "toon meer",
    "meer laden",
    "playlist",
    "vandaag",
    "gisteren",
    "select"

  ];


  function isPlaylistNoise(
    text
  ) {

    const lower =
      text
        .toLowerCase()
        .trim();


    if (!lower) {
      return true;
    }


    return PLAYLIST_NOISE.some(
      noise =>
        lower === noise
    );

  }


  function normalizePlaylistLines(
    html
  ) {

    const documentHtml =
      new DOMParser()
        .parseFromString(
          html,
          "text/html"
        );


    /*
     * Scripts/style verwijderen,
     * zodat hun code niet tussen
     * de playlistregels komt.
     */

    documentHtml
      .querySelectorAll(
        "script, style, noscript"
      )
      .forEach(
        element =>
          element.remove()
      );


    return (
      documentHtml
        .body
        ?.innerText ||
      ""
    )
    .split(
      /\r?\n/
    )
    .map(
      line =>
        cleanMetadataText(
          line
        )
    )
    .filter(Boolean);

  }


  function playlistTime(
    text
  ) {

    return (
      /^\d{1,2}:\d{2}$/
        .test(text)
      ||
      /^\d{1,2}u\d{2}$/i
        .test(text)
    );

  }


  function extractTrackFromPlaylistHtml(
    html
  ) {

    const lines =
      normalizePlaylistLines(
        html
      );


    for (
      let i = 0;
      i < lines.length;
      i++
    ) {

      if (
        !playlistTime(
          lines[i]
        )
      ) {

        continue;

      }


      const values =
        [];


      for (
        let j =
          i + 1;

        j < lines.length &&
        j <
          i + 12;

        j++
      ) {

        const value =
          lines[j];


        if (
          playlistTime(
            value
          )
        ) {

          break;

        }


        if (
          isPlaylistNoise(
            value
          )
        ) {

          continue;

        }


        /*
         * Image-alt uit sommige pagina's
         * overslaan.
         */

        if (
          /^image:?$/i
            .test(
              value
            )
        ) {

          continue;

        }


        values.push(
          value
        );


        if (
          values.length === 2
        ) {

          break;

        }

      }


      /*
       * DPG-pagina's gebruiken na tijd:
       *
       * titel
       * artiest
       */

      if (
        values.length >= 2
      ) {

        const title =
          cleanMetadataText(
            values[0]
          );


        const artist =
          cleanMetadataText(
            values[1]
          );


        if (
          artist &&
          title
        ) {

          return {
            artist,
            title
          };

        }

      }

    }


    return null;

  }


  async function resolvePlaylist(
    provider
  ) {

    const html =
      await fetchTextSmart(
        provider.url
      );


    return (
      extractTrackFromPlaylistHtml(
        html
      )
    );

  }


  /* =========================================================
     PROVIDER ROUTER
     ========================================================= */

  async function resolveMetadataProvider(
    provider,
    station
  ) {

    switch (
      provider.type
    ) {

      case "npo":

        return await resolveNpo(
          provider
        );


      case "icecast":

        return await resolveIcecast(
          provider
        );


      case "triton":

        return await resolveTriton(
          provider
        );


      case "playlist":

        return await resolvePlaylist(
          provider
        );


      case "twj":

        return await resolveTwj(
          station
        );


      default:

        return null;

    }

  }


  /* =========================================================
     METADATA ENGINE
     ========================================================= */

  async function refreshMetadata(
    showLoading = false
  ) {

    const generation =
      metadataGeneration;


    const stationIndex =
      currentIndex;


    const station =
      stations[
        stationIndex
      ];


    /*
     * Bij normale 15 sec-refresh houden
     * we de huidige titel gewoon in beeld.
     *
     * Geen flikkeren dus.
     */

    if (
      showLoading &&
      !currentTrack.title
    ) {

      setTrackLoading();

    }


    for (
      const provider
      of station.metadata || []
    ) {

      /*
       * Intussen zender gewisseld.
       */

      if (
        generation !==
          metadataGeneration ||
        stationIndex !==
          currentIndex
      ) {

        return;

      }


      try {

        const result =
          await resolveMetadataProvider(
            provider,
            station
          );


        if (
          generation !==
            metadataGeneration ||
          stationIndex !==
            currentIndex
        ) {

          return;

        }


        if (
          validTrack(
            result
          )
        ) {

          setTrack(
            cleanMetadataText(
              result.artist
            ),

            cleanMetadataText(
              result.title
            )
          );


          /*
           * Voor debuggen zichtbaar
           * in developer console,
           * niet in interface.
           */

          console.debug(
            `[radio] ${station.name}: metadata via ${provider.type}`
          );


          return;

        }

      }

      catch (error) {

        /*
         * Eén bron mag de volgende
         * bron niet tegenhouden.
         */

        console.debug(
          `[radio] ${station.name}: ${provider.type} metadata niet beschikbaar`
        );

      }

    }


    /*
     * Een tijdelijke mislukte refresh
     * wist een nog geldige bestaande
     * titel niet.
     */

    if (
      !currentTrack.title
    ) {

      setTrackUnavailable();

    }

  }


  window.setInterval(
    () =>
      refreshMetadata(
        false
      ),
    METADATA_REFRESH
  );


  document.addEventListener(
    "visibilitychange",
    () => {

      if (
        document.visibilityState ===
        "visible"
      ) {

        refreshMetadata(
          false
        );


        updateSleepTimer();

      }

    }
  );


  /* =========================================================
     NETWORK
     ========================================================= */

  window.addEventListener(
    "offline",
    () => {

      status.textContent =
        "Geen internetverbinding";

    }
  );


  window.addEventListener(
    "online",
    () => {

      status.textContent =
        audio.paused
          ? "Internetverbinding hersteld"
          : "Live";


      refreshMetadata(
        false
      );

    }
  );


  /* =========================================================
     NEXT / PREVIOUS
     ========================================================= */

  function nextStation() {

    const order =
      getDisplayOrder()
        .map(
          item =>
            item.index
        );


    const position =
      order.indexOf(
        currentIndex
      );


    const next =
      order[
        (
          position + 1
        ) %
        order.length
      ];


    selectStation(
      next,
      !audio.paused
    );

  }


  function previousStation() {

    const order =
      getDisplayOrder()
        .map(
          item =>
            item.index
        );


    const position =
      order.indexOf(
        currentIndex
      );


    const previous =
      order[
        (
          position -
          1 +
          order.length
        ) %
        order.length
      ];


    selectStation(
      previous,
      !audio.paused
    );

  }


  /* =========================================================
     KEYBOARD
     ========================================================= */

  document.addEventListener(
    "keydown",
    event => {

      const tag =
        document
          .activeElement
          .tagName;


      if (
        tag === "INPUT"
      ) {

        return;

      }


      if (
        event.code ===
        "Space"
      ) {

        event.preventDefault();

        togglePlay();

      }


      if (
        event.key ===
        "ArrowRight"
      ) {

        event.preventDefault();

        nextStation();

      }


      if (
        event.key ===
        "ArrowLeft"
      ) {

        event.preventDefault();

        previousStation();

      }


      if (
        event.key ===
        "Escape"
      ) {

        closeSleepMenu();

      }

    }
  );


  /* =========================================================
     MEDIA SESSION
     ========================================================= */

  function updateMediaSession() {

    if (
      !(
        "mediaSession"
        in navigator
      )
    ) {

      return;

    }


    const station =
      stations[
        currentIndex
      ];


    const logo =
      getStationLogo(
        station,
        512
      );


    const metadata = {

      title:
        currentTrack.title ||
        station.name,

      artist:
        currentTrack.artist ||
        "Live radio",

      album:
        station.name

    };


    if (logo) {

      metadata.artwork = [
        {
          src: logo,
          sizes: "512x512"
        }
      ];

    }


    try {

      navigator
        .mediaSession
        .metadata =
        new MediaMetadata(
          metadata
        );

    }

    catch {

      /*
       * Sommige browsers accepteren
       * bepaalde externe artwork-url's
       * niet voor MediaSession.
       *
       * Dan zonder artwork.
       */

      delete metadata.artwork;


      navigator
        .mediaSession
        .metadata =
        new MediaMetadata(
          metadata
        );

    }

  }


  if (
    "mediaSession"
    in navigator
  ) {

    navigator
      .mediaSession
      .setActionHandler(
        "play",
        play
      );


    navigator
      .mediaSession
      .setActionHandler(
        "pause",
        pause
      );


    navigator
      .mediaSession
      .setActionHandler(
        "nexttrack",
        nextStation
      );


    navigator
      .mediaSession
      .setActionHandler(
        "previoustrack",
        previousStation
      );

  }


  /* =========================================================
     INITIALISE
     ========================================================= */

  function initialise() {

    const station =
      stations[
        currentIndex
      ];


    stationTitle.textContent =
      station.name;


    stationMark.textContent =
      station.mark;


    document
      .documentElement
      .style
      .setProperty(
        "--accent",
        station.accent
      );


    document
      .documentElement
      .style
      .setProperty(
        "--accent-rgb",
        station.rgb
      );


    audio.src =
      station.stream;


    updateMainLogo();


    renderStations();


    updateBrowserIdentity();


    updateMediaSession();


    updateMuteUI();


    updateSleepTimer();


    refreshMetadata(
      true
    );

  }


  initialise();

</script>
