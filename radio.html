<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    id="themeColor"
    name="theme-color"
    content="#080a0f"
  >

  <link
    id="dynamicFavicon"
    rel="icon"
    href=""
  >

  <title>radio.</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #080a0f;
      --panel: rgba(255,255,255,.055);
      --panel-hover: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.09);

      --text: #f7f7f8;
      --muted: #9297a2;

      --accent: #e63946;
      --accent-rgb: 230,57,70;

      --logo-surface: #fff;

      --play-bg: #f7f7f8;
      --play-fg: #080a0f;

      --menu-bg: #171a21;

      --shadow:
        0 30px 80px rgba(0,0,0,.35);

      --radius-xl: 32px;
      --radius-lg: 22px;
    }


    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;

        --bg: #f3f5f8;

        --panel: rgba(255,255,255,.72);
        --panel-hover: rgba(255,255,255,.98);
        --border: rgba(15,18,24,.09);

        --text: #111318;
        --muted: #6f7581;

        --play-bg: #111318;
        --play-fg: #fff;

        --menu-bg: #fff;

        --shadow:
          0 26px 65px rgba(26,32,44,.13);
      }
    }


    * {
      box-sizing: border-box;
    }


    [hidden] {
      display: none !important;
    }


    html {
      -webkit-text-size-adjust: 100%;
    }


    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100svh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(var(--accent-rgb), .16),
          transparent 40%
        ),
        var(--bg);

      transition:
        background .45s ease,
        color .25s ease;
    }


    button,
    input {
      font: inherit;
    }


    button {
      color: inherit;
    }


    .app {
      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      min-height: 100svh;

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      padding:
        max(24px, env(safe-area-inset-top))
        0
        max(24px, env(safe-area-inset-bottom));
    }


    /* =========================================================
       HEADER
       ========================================================= */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom:
        clamp(30px, 6vh, 70px);
    }


    .brand {
      display: flex;
      align-items: center;

      gap: 11px;

      font-size: 20px;
      font-weight: 760;

      letter-spacing: -.04em;
    }


    .brand-dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 5px rgba(var(--accent-rgb), .12),
        0 0 28px rgba(var(--accent-rgb), .65);
    }


    .station-count {
      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    /* =========================================================
       PLAYER
       ========================================================= */

    .player {
      display: grid;

      grid-template-columns:
        minmax(220px, 330px)
        minmax(0, 1fr);

      gap:
        clamp(32px, 7vw, 85px);

      align-items: center;

      margin-bottom:
        clamp(42px, 8vh, 78px);
    }


    /* =========================================================
       ARTWORK
       ========================================================= */

    .artwork {
      position: relative;

      aspect-ratio: 1;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius:
        var(--radius-xl);

      background:
        linear-gradient(
          145deg,
          rgba(var(--accent-rgb), .98),
          rgba(var(--accent-rgb), .42)
        );

      box-shadow:
        0 34px 80px rgba(var(--accent-rgb), .16),
        inset 0 1px 0 rgba(255,255,255,.2);
    }


    .artwork::before,
    .artwork::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,.14);

      pointer-events: none;
    }


    .artwork::before {
      width: 76%;
      height: 76%;
    }


    .artwork::after {
      width: 48%;
      height: 48%;
    }


    .main-logo-surface {
      position: relative;
      z-index: 2;

      width: 58%;
      aspect-ratio: 1;

      display: grid;
      place-items: center;

      padding: 11%;

      border-radius: 26%;

      background:
        var(--logo-surface);

      box-shadow:
        0 18px 45px rgba(0,0,0,.17),
        inset 0 0 0 1px rgba(0,0,0,.04);
    }


    .main-station-logo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      transition:
        opacity .2s ease,
        transform .25s ease;
    }


    .station-mark {
      display: none;

      color: #111318;

      font-size:
        clamp(42px, 6vw, 74px);

      font-weight: 850;

      line-height: 1;
      letter-spacing: -.075em;
    }


    .playing-indicator {
      position: absolute;

      right: 20px;
      bottom: 20px;

      z-index: 3;

      height: 35px;

      padding: 0 14px;

      display: flex;
      align-items: center;
      gap: 8px;

      border-radius: 999px;

      color: #fff;

      background:
        rgba(0,0,0,.36);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      font-size: 11px;
      font-weight: 750;

      letter-spacing: .08em;

      opacity: .72;
    }


    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #fff;
    }


    body.is-playing .live-dot {
      animation:
        pulse 1.5s infinite;
    }


    @keyframes pulse {
      50% {
        opacity: .25;
        transform: scale(.8);
      }
    }


    /* =========================================================
       INFO
       ========================================================= */

    .player-info {
      min-width: 0;
    }


    h1 {
      margin: 0;

      max-width: 720px;

      font-size:
        clamp(40px, 6vw, 72px);

      font-weight: 790;

      line-height: .98;
      letter-spacing: -.065em;

      text-wrap: balance;
    }


    /* =========================================================
       PROGRAM
       ========================================================= */

    .program-title {
      width: fit-content;
      max-width: 100%;

      margin-top: 15px;

      color: var(--muted);

      font-size:
        clamp(14px, 1.7vw, 17px);

      font-weight: 620;

      line-height: 1.3;

      letter-spacing: -.015em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    /* =========================================================
       TRACK
       ========================================================= */

    .track {
      margin-top: 14px;
    }


    .track-artist,
    .track-title {
      display: block;

      width: fit-content;
      max-width: 100%;

      text-decoration: none;

      cursor: default;

      transition:
        color .16s ease,
        opacity .16s ease;
    }


    .track-artist {
      color: var(--text);

      font-size:
        clamp(16px, 2vw, 20px);

      font-weight: 650;

      letter-spacing: -.025em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track-title {
      margin-top: 4px;

      color: var(--muted);

      font-size:
        clamp(14px, 1.7vw, 17px);

      font-weight: 500;

      letter-spacing: -.015em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track.single .track-artist {
      display: none;
    }


    .track-link.has-wiki {
      cursor: pointer;

      text-decoration-line: underline;
      text-decoration-style: dotted;
      text-decoration-thickness: 1px;

      text-underline-offset: 4px;

      text-decoration-color:
        rgba(var(--accent-rgb), .6);
    }


    .track-link.has-wiki::after {
      content: " ↗";

      font-size: .68em;
      font-weight: 700;

      opacity: .48;

      vertical-align: .1em;
    }


    .track-link.has-wiki:hover {
      color: var(--accent);

      text-decoration-color:
        var(--accent);
    }


    .track-link.has-wiki:hover::after {
      opacity: .9;
    }


    /* =========================================================
       CONTROLS
       ========================================================= */

    .controls {
      display: flex;
      align-items: center;

      gap: 20px;

      margin-top: 27px;
    }


    .play-button {
      appearance: none;

      width: 72px;
      height: 72px;

      flex: 0 0 72px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background:
        var(--play-bg);

      color:
        var(--play-fg);

      cursor: pointer;

      box-shadow:
        var(--shadow);

      transition:
        transform .16s ease;
    }


    .play-button:hover {
      transform: scale(1.055);
    }


    .play-button:active {
      transform: scale(.96);
    }


    .play-button svg {
      width: 27px;
      height: 27px;
    }


    .play-icon {
      margin-left: 4px;
    }


    body.is-playing .play-icon {
      display: none;
    }


    .pause-icon {
      display: none;
    }


    body.is-playing .pause-icon {
      display: block;
    }


    .secondary-controls {
      width:
        min(310px, 100%);
    }


    .status {
      min-height: 20px;

      margin-bottom: 12px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 550;
    }


    .control-row {
      display: flex;
      align-items: center;

      gap: 10px;
    }


    .icon-button {
      appearance: none;

      width: 38px;
      height: 38px;

      flex: 0 0 38px;

      display: grid;
      place-items: center;

      padding: 0;

      border:
        1px solid transparent;

      border-radius: 12px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;
    }


    .icon-button:hover {
      color: var(--text);

      background:
        var(--panel-hover);
    }


    .icon-button svg {
      width: 19px;
      height: 19px;
    }


    /* MUTE */

    .mute-button.muted {
      color: #fff;

      background: #e5484d;

      border-color: #e5484d;

      box-shadow:
        0 0 0 4px rgba(229,72,77,.20),
        0 8px 22px rgba(229,72,77,.22);
    }


    .volume-on-icon {
      display: block;
    }


    .volume-off-icon {
      display: none;
    }


    .mute-button.muted .volume-on-icon {
      display: none;
    }


    .mute-button.muted .volume-off-icon {
      display: block;
    }


    /* VOLUME */

    .volume-slider {
      flex: 1;

      min-width: 50px;
    }


    input[type="range"] {
      width: 100%;

      appearance: none;
      -webkit-appearance: none;

      height: 4px;

      border-radius: 999px;

      background:
        linear-gradient(
          to right,
          var(--text) 0,
          var(--text) var(--volume),
          rgba(128,128,128,.23) var(--volume),
          rgba(128,128,128,.23) 100%
        );

      cursor: pointer;
    }


    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background:
        var(--text);
    }


    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background:
        var(--text);
    }


    /* SLEEP TIMER */

    .sleep-wrap {
      position: relative;
    }


    .sleep-button {
      width: auto;

      min-width: 38px;

      padding: 0 10px;

      gap: 6px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .sleep-button.active {
      color: var(--accent);

      border-color:
        rgba(var(--accent-rgb), .28);

      background:
        rgba(var(--accent-rgb), .10);
    }


    .sleep-text {
      display: none;

      font-size: 11px;
      font-weight: 750;
    }


    .sleep-button.active .sleep-text {
      display: block;
    }


    .sleep-menu {
      position: absolute;

      right: 0;
      bottom:
        calc(100% + 10px);

      z-index: 20;

      width: 150px;

      padding: 6px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      background:
        var(--menu-bg);

      box-shadow:
        0 20px 55px rgba(0,0,0,.20);
    }


    .sleep-option {
      appearance: none;

      width: 100%;

      padding: 10px 11px;

      border: 0;
      border-radius: 10px;

      background: transparent;

      text-align: left;

      cursor: pointer;
    }


    .sleep-option:hover {
      background:
        var(--panel-hover);
    }


    /* =========================================================
       COUNTRIES
       ========================================================= */

    .station-groups {
      display: grid;

      gap: 22px;
    }


    .country-group {
      min-width: 0;
    }


    .country-header {
      display: flex;
      align-items: center;

      min-height: 52px;

      margin-bottom: 12px;

      padding:
        5px 8px
        5px 13px;

      border:
        1px solid var(--border);

      border-radius: 17px;

      background:
        var(--panel);
    }


    .country-toggle {
      appearance: none;

      min-width: 0;
      flex: 1;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 7px 5px;

      border: 0;

      background: transparent;

      text-align: left;

      cursor: pointer;
    }


    .country-flag {
      flex: 0 0 auto;

      font-size: 21px;

      line-height: 1;
    }


    .country-title {
      min-width: 0;

      overflow: hidden;

      font-size: 15px;
      font-weight: 760;

      letter-spacing: -.025em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .country-count {
      margin-left: auto;

      padding-left: 12px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 600;

      white-space: nowrap;
    }


    .country-chevron {
      width: 28px;
      height: 28px;

      flex: 0 0 28px;

      display: grid;
      place-items: center;

      color: var(--muted);

      transition:
        transform .2s ease;
    }


    .country-group.collapsed
    .country-chevron {
      transform:
        rotate(-90deg);
    }


    .country-favorite {
      appearance: none;

      width: 36px;
      height: 36px;

      flex: 0 0 36px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 11px;

      background: transparent;

      color: var(--muted);

      font-size: 19px;

      cursor: pointer;

      opacity: .6;
    }


    .country-favorite:hover,
    .country-favorite.active {
      color: var(--accent);

      background:
        rgba(var(--accent-rgb), .08);

      opacity: 1;
    }


    .country-stations {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(145px, 1fr)
        );

      gap: 12px;
    }


    /* =========================================================
       STATIONS
       ========================================================= */

    .station {
      position: relative;

      min-width: 0;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-lg);

      background:
        var(--panel);

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }


    .station:hover {
      background:
        var(--panel-hover);

      transform:
        translateY(-2px);
    }


    .station.active {
      border-color:
        rgba(var(--accent-rgb), .52);

      background:
        rgba(var(--accent-rgb), .11);
    }


    .station-select {
      appearance: none;

      width: 100%;

      min-height: 112px;

      padding: 17px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;

      border: 0;

      background: transparent;

      text-align: left;

      cursor: pointer;
    }


    .station-logo-wrap {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      padding: 5px;

      overflow: hidden;

      border-radius: 12px;

      background: #fff;

      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.05);
    }


    .station-logo {
      width: 100%;
      height: 100%;

      max-width: 100%;
      max-height: 100%;

      display: block;

      object-fit: contain;
    }


    .station[data-station-id="qmusic"]
    .station-logo,

    .station[data-station-id="qmusicbe"]
    .station-logo {
      width: 78%;
      height: 78%;
    }


    .station-logo-fallback {
      display: none;

      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;

      color: #111318;

      font-size: 10px;
      font-weight: 850;
    }


    .station-name {
      width: 100%;

      margin-top: 18px;

      padding-right: 20px;

      overflow: hidden;

      font-size: 14px;
      font-weight: 680;

      letter-spacing: -.025em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .favorite-button {
      appearance: none;

      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 5;

      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      font-size: 18px;

      cursor: pointer;

      opacity: .48;
    }


    .favorite-button:hover,
    .favorite-button.active {
      color: var(--accent);

      opacity: 1;
    }


    footer {
      display: flex;
      justify-content: center;

      margin-top: 28px;

      color: var(--muted);

      opacity: .64;

      font-size: 11px;
    }


    :focus-visible {
      outline:
        2px solid var(--text);

      outline-offset: 4px;
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 760px) {

      .app {
        width:
          min(
            100% - 24px,
            620px
          );
      }


      header {
        margin-bottom: 32px;
      }


      .player {
        grid-template-columns: 1fr;

        gap: 26px;

        margin-bottom: 38px;
      }


      .artwork {
        width:
          min(58vw, 255px);

        justify-self: center;
      }


      .player-info {
        text-align: center;
      }


      h1 {
        margin-inline: auto;

        font-size:
          clamp(40px, 12vw, 60px);
      }


      .program-title,
      .track-artist,
      .track-title {
        margin-left: auto;
        margin-right: auto;
      }


      .controls {
        justify-content: center;
      }


      .secondary-controls {
        width:
          min(300px, 100%);

        text-align: left;
      }


      .country-stations {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }


      footer {
        display: none;
      }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 420px) {

      .app {
        width:
          calc(100% - 20px);
      }


      .station-count {
        display: none;
      }


      .artwork {
        width:
          min(54vw, 205px);

        border-radius: 26px;
      }


      .controls {
        flex-direction: column;

        gap: 18px;
      }


      .secondary-controls {
        width:
          min(290px, 92%);
      }


      .station-select {
        min-height: 97px;

        padding: 14px;
      }


      .station-logo-wrap {
        width: 38px;
        height: 38px;
      }


      .country-header {
        min-height: 48px;

        padding-left: 9px;
      }


      .country-flag {
        font-size: 20px;
      }


      .country-count {
        display: none;
      }
    }


    @media (prefers-reduced-motion: reduce) {

      * {
        transition-duration:
          .01ms !important;

        animation-duration:
          .01ms !important;
      }
    }
  </style>
</head>


<body>

<div class="app">

  <header>

    <div class="brand">
      <span class="brand-dot"></span>
      radio.
    </div>

    <div
      id="stationCount"
      class="station-count"
    ></div>

  </header>


  <main>

    <section class="player">

      <div class="artwork">

        <div class="main-logo-surface">

          <img
            id="mainStationLogo"
            class="main-station-logo"
            alt=""
          >

          <div
            id="stationMark"
            class="station-mark"
          ></div>

        </div>


        <div class="playing-indicator">

          <span class="live-dot"></span>

          LIVE

        </div>

      </div>


      <div class="player-info">

        <h1 id="stationTitle"></h1>


        <div
          id="programTitle"
          class="program-title"
          hidden
        ></div>


        <div
          id="trackInfo"
          class="track"
          aria-live="polite"
          hidden
        >

          <a
            id="trackArtist"
            class="track-artist track-link"
          ></a>

          <a
            id="trackTitle"
            class="track-title track-link"
          ></a>

        </div>


        <div class="controls">

          <button
            id="playButton"
            class="play-button"
            type="button"
            aria-label="Afspelen"
          >

            <svg
              class="play-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M8 5v14l11-7z"/>
            </svg>

            <svg
              class="pause-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M7 5h4v14H7zm6 0h4v14h-4z"/>
            </svg>

          </button>

/* =========================================================
   WIKIPEDIA CACHE
   ========================================================= */

let wikiCache = {};


try {

  wikiCache =
    JSON.parse(
      localStorage.getItem(
        WIKI_CACHE_KEY
      ) ||
      "{}"
    );

}
catch {

  wikiCache = {};

}


function readWikiCache(
  key
) {

  const item =
    wikiCache[key];


  if (!item) {
    return undefined;
  }


  if (
    item.expires <
    Date.now()
  ) {

    delete wikiCache[key];

    return undefined;
  }


  return item.result || null;

}


function writeWikiCache(
  key,
  result
) {

  wikiCache[key] = {

    expires:
      Date.now() +
      WIKI_CACHE_TTL,

    result:
      result || null

  };


  const entries =
    Object.entries(
      wikiCache
    );


  if (
    entries.length > 200
  ) {

    entries
      .sort(
        (a, b) =>
          a[1].expires -
          b[1].expires
      )
      .slice(
        0,
        entries.length - 200
      )
      .forEach(
        ([key]) =>
          delete wikiCache[key]
      );

  }


  try {

    localStorage.setItem(
      WIKI_CACHE_KEY,
      JSON.stringify(
        wikiCache
      )
    );

  }
  catch {}

}


/* =========================================================
   TEXT HELPERS
   ========================================================= */

function cleanText(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  const text =
    String(value)
      .replace(
        /[\u0000-\u001f\u007f]/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if (
    !text ||
    text.length > 250
  ) {
    return "";
  }


  const invalid = [

    /^unknown$/i,
    /^undefined$/i,
    /^null$/i,

    /^no metadata/i,
    /^no information/i,

    /^metadata unavailable$/i,

    /^not available$/i,
    /^unavailable$/i,

    /^sin información$/i,
    /^sin informacion$/i,
    /^sin datos$/i,

    /^sem informação$/i,
    /^sem informacao$/i,

    /^offline$/i

  ];


  if (
    invalid.some(
      regex =>
        regex.test(text)
    )
  ) {
    return "";
  }


  return text;

}


function documentLines(
  doc
) {

  const raw =
    doc.body?.innerText ||
    doc.body?.textContent ||
    "";


  return raw
    .split(/\r?\n/)
    .map(cleanText)
    .filter(Boolean);

}


function documentHeadings(
  doc,
  selector =
    "h1,h2,h3,h4,h5,h6"
) {

  return [
    ...doc.querySelectorAll(
      selector
    )
  ]
  .map(
    element =>
      cleanText(
        element.textContent
      )
  )
  .filter(Boolean);

}


/* =========================================================
   FETCH
   ========================================================= */

async function fetchTextWithTimeout(
  url,
  timeout =
    REQUEST_TIMEOUT
) {

  const controller =
    new AbortController();


  const timer =
    window.setTimeout(
      () =>
        controller.abort(),
      timeout
    );


  try {

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    return await response.text();

  }

  finally {

    clearTimeout(
      timer
    );

  }

}


async function fetchTextSmart(
  url,
  cacheBust = false
) {

  let target =
    url;


  if (
    cacheBust
  ) {

    target +=
      (
        target.includes("?")
          ? "&"
          : "?"
      ) +
      "_radio=" +
      Math.floor(
        Date.now() /
        15000
      );

  }


  try {

    return await fetchTextWithTimeout(
      target,
      2200
    );

  }

  catch {}


  return await Promise.any(

    CORS_RELAYS.map(
      relay =>
        fetchTextWithTimeout(
          relay(target),
          REQUEST_TIMEOUT
        )
    )

  );

}


async function fetchJsonSmart(
  url
) {

  return JSON.parse(
    await fetchTextSmart(
      url,
      true
    )
  );

}


async function fetchDocument(
  url
) {

  const html =
    await fetchTextSmart(
      url,
      true
    );


  return new DOMParser()
    .parseFromString(
      html,
      "text/html"
    );

}

function getCountryDisplayOrder() {

  return [...COUNTRIES]
    .sort(
      (a, b) => {

        const af =
          favoriteCountries.has(
            a.code
          );


        const bf =
          favoriteCountries.has(
            b.code
          );


        if (
          af !== bf
        ) {

          return af
            ? -1
            : 1;

        }


        return (
          COUNTRIES.indexOf(a) -
          COUNTRIES.indexOf(b)
        );

      }
    );

}


function getCountryOrder(
  countryCode
) {

  return stations
    .map(
      (station, index) => ({
        station,
        index
      })
    )
    .filter(
      item =>
        item.station.country ===
        countryCode
    )
    .sort(
      (a, b) => {

        const af =
          favoriteIds.has(
            a.station.id
          );


        const bf =
          favoriteIds.has(
            b.station.id
          );


        if (
          af !== bf
        ) {

          return af
            ? -1
            : 1;

        }


        return a.index - b.index;

      }
    );

}


function getDisplayOrder() {

  return getCountryDisplayOrder()
    .flatMap(
      country =>
        getCountryOrder(
          country.code
        )
    );

}


function getVisibleDisplayOrder() {

  return getCountryDisplayOrder()
    .filter(
      country =>
        !collapsedCountries.has(
          country.code
        )
    )
    .flatMap(
      country =>
        getCountryOrder(
          country.code
        )
    );

}

    favorite.setAttribute(
      "aria-label",

      countryFavorite
        ? `${country.name} uit favorieten`
        : `${country.name} toevoegen aan favorieten`
    );


    favorite.addEventListener(
      "click",
      () => {

        toggleCountryFavorite(
          country.code
        );

      }
    );


    header.appendChild(
      toggle
    );


    header.appendChild(
      favorite
    );


    const grid =
      document.createElement(
        "div"
      );


    grid.className =
      "country-stations";


    grid.hidden =
      collapsed;


    for (
      const {
        station,
        index
      }
      of items
    ) {

      grid.appendChild(
        createStationCard(
          station,
          index
        )
      );

    }


    group.appendChild(
      header
    );


    group.appendChild(
      grid
    );


    stationsContainer.appendChild(
      group
    );

  }


  const favs =
    favoriteIds.size;


  const favoriteText =
    favs === 1
      ? "1 favoriet"
      : `${favs} favorieten`;


  stationCount.textContent =
    favs
      ? `${stations.length} stations · ${favoriteText}`
      : `${stations.length} stations`;

}

function clearTrack() {

  wikipediaGeneration++;

  resetWikipediaLinks();


  currentTrack = {
    artist: "",
    title: ""
  };


  currentTrackUpdatedAt =
    0;


  trackArtist.textContent =

function setTrack(
  artist,
  title
) {

  if (
    isContentSuppressed()
  ) {

    clearTrack();

    return true;

  }


  artist =
    cleanText(
      artist
    );


  title =
    cleanText(
      title
    );


  if (!title) {

    return false;

  }


  currentTrackUpdatedAt =
    Date.now();


  if (
    currentTrack.artist === artist &&
    currentTrack.title === title
  ) {

    trackInfo.hidden =
      false;


    return true;

  }


  currentTrack = {
    artist,
    title
  };


  trackInfo.className =
    artist
      ? "track"
      : "track single";


  trackArtist.textContent =
    artist;


  trackTitle.textContent =
    title;


  trackInfo.hidden =
    false;


  resetWikipediaLinks();


  updateWikipediaLinks(
    artist,
    title
  );


  updateMediaSession();


  return true;

}

   PROGRAM UI

function clearProgram() {

  currentProgram =
    "";


  currentProgramUpdatedAt =
    0;


  programTitle.textContent =
    "";

  updateMediaSession();

}


function isInvalidProgram(
  value
) {

  const text =
    cleanText(
      value
    );


  if (!text) {
    return true;
  }


  return [

    /^pagina onbeschikbaar$/i,
    /^deze pagina kon niet geladen worden$/i,

    /^live$/i,
    /^nu live$/i,
    /^kijk live$/i,
    /^luister live$/i,

    /^playlist$/i,
    /^programmering$/i,
    /^programma's$/i,
    /^programma’s$/i,

    /^nieuws$/i,
    /^contact$/i,

    /^volume$/i,

    /^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/i

  ]
  .some(
    regex =>
      regex.test(
        text
      )
  );

}


function setProgram(
  value
) {

  const text =
    cleanText(
      value
    );


  if (
    !text ||
    isInvalidProgram(text) ||
    isContentSuppressed()
  ) {

    clearProgram();

    return false;

  }


  currentProgram =
    text;


  currentProgramUpdatedAt =
    Date.now();


  programTitle.textContent =
    text;


  programTitle.hidden =
    false;


  updateMediaSession();


  return true;

}


/* =========================================================
   SELECT STATION
   ========================================================= */

function selectStation(
  index,
  autoPlay = false
) {

  if (
    index === currentIndex &&
    audio.src
  ) {

    if (
      autoPlay &&
      audio.paused
    ) {

      play();

    }


    return;

  }


  const wasPlaying =
    !audio.paused;


  currentIndex =
    index;


  metadataGeneration++;

  programGeneration++;

  wikipediaGeneration++;


  clearTimeout(
    preRollGuardTimer
  );


  preRollTrackGuardUntil =
    0;


  const station =
    stations[currentIndex];


  preRollGuardPending =
    Boolean(
      station.preRollTrackGuardSeconds
    );


  localStorage.setItem(
    "radio-station-id",
    station.id
  );


  stationTitle.textContent =
    station.name;


  stationMark.textContent =
    station.mark;


  document.documentElement
    .style
    .setProperty(
      "--accent",
      station.accent
    );


  document.documentElement
    .style
    .setProperty(
      "--accent-rgb",
      station.rgb
    );


  updateMainLogo();


  clearTrack();

  clearProgram();


  audio.pause();


  audio.src =
    station.stream;


  audio.load();


  status.textContent =
    "Zender geselecteerd";


  renderStations();

  updateBrowserIdentity();

  updateMediaSession();

  refreshMetadata();

  refreshProgram();


  if (
    wasPlaying ||
    autoPlay
  ) {

    play();

  }

}


/* =========================================================
   PRE-ROLL
   ========================================================= */

function beginPreRollGuard() {

  const station =
    stations[currentIndex];


  if (
    !preRollGuardPending ||
    !station.preRollTrackGuardSeconds
  ) {

    return;

  }


  preRollTrackGuardUntil =
    Infinity;


  clearTrack();

  clearProgram();

}


function activatePreRollTimer() {

  const station =
    stations[currentIndex];


  if (
    preRollTrackGuardUntil !==
      Infinity ||
    !station.preRollTrackGuardSeconds
  ) {

    return;

  }


  preRollGuardPending =
    false;


  preRollTrackGuardUntil =
    Date.now() +
    station.preRollTrackGuardSeconds *
    1000;


  clearTimeout(
    preRollGuardTimer
  );


  preRollGuardTimer =
    window.setTimeout(
      () => {

        preRollTrackGuardUntil =
          0;


        refreshMetadata();

        refreshProgram();

      },
      station.preRollTrackGuardSeconds *
      1000
    );

}


function isContentSuppressed() {

  if (
    preRollTrackGuardUntil ===
    Infinity
  ) {

    return true;

  }


  return (
    preRollTrackGuardUntil >
    Date.now()
  );

}

  status.textContent =
    "Verbinden…";


  beginPreRollGuard();


  try {

    await audio.play();

  catch {

    status.textContent =
      "Kan de stream niet starten";

}

    pause();

}

/* =========================================================
   TRACK SPLIT
   ========================================================= */

function splitTrack(
  value
) {

  const text =
    cleanText(
      value
    );


  if (!text) {

    return null;

  }


  const separators = [
    " - ",
    " – ",
    " — ",
    " | "
  ];


  for (
    const separator
    of separators
  ) {

    const position =
      text.indexOf(
        separator
      );


    if (
      position <= 0
    ) {

      continue;

    }


    const artist =
      cleanText(
        text.slice(
          0,
          position
        )
      );


    const title =
      cleanText(
        text.slice(
          position +
          separator.length
        )
      );


    if (
      artist &&
      title
    ) {

      return {
        artist,
        title
      };

    }

  }


  return null;

}


/* =========================================================
   STATION NOISE
   ========================================================= */

function isStationNoise(
  value,
  station
) {

  const text =
    cleanText(
      value
    )
    .toLowerCase();


  if (!text) {

    return true;

  }


  for (
    const noise
    of station.noise || []
  ) {

    const lowered =
      noise.toLowerCase();


    if (
      text === lowered ||
      text.startsWith(
        lowered +
        " - "
      )
    ) {

      return true;

    }

  }


  return false;

}


function isHardNoTrack(
  value
) {

  const text =
    cleanText(
      value
    );


  if (!text) {

    return true;

  }


  return (
    /^(ad break|ad start|commercial break|dynamic break)/i
      .test(text) ||

    /\breclame\b/i
      .test(text) ||

    /\bnieuws\b/i
      .test(text)
  );

}


/* =========================================================
   NPO TRACKS
   ========================================================= */

async function getNpoMetadata(
  provider
) {

  const data =
    await fetchJsonSmart(
      provider.url
    );


  const items =
    Array.isArray(
      data?.data
    )
      ? data.data
      : [];


  if (
    provider.currentWindow
  ) {

    const now =
      Date.now();


    const current =
      items.find(
        item => {

          const start =
            Date.parse(
              item.startdatetime
            );


          const end =
            Date.parse(
              item.enddatetime
            );


          if (
            !Number.isFinite(start) ||
            !Number.isFinite(end)
          ) {

            return false;

          }


          return (
            now >=
              start - 2500 &&
            now <=
              end + 2500
          );

        }
      );


    if (!current) {

      return {
        noTrack: true
      };

    }


    const artist =
      cleanText(
        current.artist
      );


    const title =
      cleanText(
        current.title
      );


    if (
      !artist ||
      !title
    ) {

      return {
        noTrack: true
      };

    }


    return {
      artist,
      title
    };

  }


  return {
    noTrack: true
  };

}


/* =========================================================
   538 TRITON
   ========================================================= */

function parseEpochMilliseconds(
  value
) {

  const number =
    Number(
      String(value || "")
        .trim()
    );


  if (
    !Number.isFinite(number)
  ) {

    return 0;

  }


  return (
    number >
    100000000000
  )
    ? number
    : number * 1000;

}


function parseDurationMilliseconds(
  value
) {

  const number =
    Number(
      String(value || "")
        .trim()
    );


  if (
    !Number.isFinite(number) ||
    number <= 0
  ) {

    return 0;

  }


  return (
    number < 1000
  )
    ? number * 1000
    : number;

}


async function getTritonMetadata(
  provider
) {

  const url =
    "https://np.tritondigital.com/public/nowplaying" +
    "?mountName=" +
    encodeURIComponent(
      provider.mount
    ) +
    "&numberToFetch=8";


  const xml =
    await fetchTextSmart(
      url,
      true
    );


  const doc =
    new DOMParser()
      .parseFromString(
        xml,
        "application/xml"
      );


  if (
    doc.querySelector(
      "parsererror"
    )
  ) {

    return null;

  }


  const block =
    doc.querySelector(
      "nowplaying-info"
    );


  if (!block) {

    return null;

  }


  /*
   * Triton 538:
   *
   * 0 = eventtype
   * 1 = duur
   * 2 = starttijd epoch
   * 3 = titel / event
   * 4 = artiest / adverteerder
   */

  const props =
    [
      ...block.querySelectorAll(
        "property"
      )
    ]
    .map(
      property =>
        cleanText(
          property.textContent
        )
    );


  if (
    !props.length
  ) {

    return null;

  }


  const type =
    (
      props[0] ||
      ""
    )
    .toLowerCase();


  const duration =
    parseDurationMilliseconds(
      props[1]
    );


  const start =
    parseEpochMilliseconds(
      props[2]
    );


  const title =
    cleanText(
      props[3]
    );


  const artist =
    cleanText(
      props[4]
    );


  if (
    /break|advert|commercial|spot|promo/
      .test(type)
  ) {

    return {
      noTrack: true
    };

  }


  if (
    start &&
    duration
  ) {

    const now =
      Date.now();


    const end =
      start +
      duration;


    if (
      now <
        start - 5000 ||
      now >
        end + 5000
    ) {

      return {
        noTrack: true
      };

    }

  }


  if (
    !artist ||
    !title ||
    artist.toLowerCase() ===
      "null" ||
    title.toLowerCase() ===
      "null"
  ) {

    return {
      noTrack: true
    };

  }


  return {
    artist,
    title
  };

}


/* =========================================================
   KINK TRACK
   ========================================================= */

async function getKinkMetadata(
  provider
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const lines =
    documentLines(
      doc
    );


  const index =
    lines.findIndex(
      line =>
        /^nu op kink$/i.test(
          line
        )
    );


  if (
    index < 0
  ) {

    return null;

  }


  const values = [];


  for (
    let i =
      index + 1;

    i <
      Math.min(
        lines.length,
        index + 8
      );

    i++
  ) {

    const line =
      lines[i];


    if (
      /^now on air\b/i.test(
        line
      ) ||
      /^deze week op kink/i.test(
        line
      )
    ) {

      break;

    }


    if (
      /^app de studio/i.test(
        line
      )
    ) {

      continue;

    }


    values.push(
      line
    );


    if (
      values.length === 2
    ) {

      return {
        artist:
          values[0],

        title:
          values[1]
      };

    }

  }


  return {
    noTrack: true
  };

}


/* =========================================================
   ONLINE RADIO BOX
   ========================================================= */

function extractOrbRows(
  doc
) {

  const rows = [];


  for (
    const row
    of doc.querySelectorAll(
      "tr"
    )
  ) {

    const cells =
      [
        ...row.querySelectorAll(
          "td"
        )
      ]
      .map(
        cell =>
          cleanText(
            cell.textContent
          )
      )
      .filter(Boolean);


    let time =
      cleanText(
        row
          .querySelector(
            ".tablelist-schedule__time"
          )
          ?.textContent
      );


    let text =
      cleanText(
        row
          .querySelector(
            ".track_history_item"
          )
          ?.textContent
      );


    if (
      !time &&
      cells.length >= 1
    ) {

      time =
        cells[0];

    }


    if (
      !text &&
      cells.length >= 2
    ) {

      text =
        cells[
          cells.length - 1
        ];

    }


    if (
      !time ||
      !text
    ) {

      continue;

    }


    rows.push({

      time,

      text,

      active:
        row.classList
          .contains(
            "active"
          ) ||
        Boolean(
          row.querySelector(
            ".active"
          )
        )

    });

  }


  return rows;

}


function clockToMinutes(
  value
) {

  const match =
    /^(\d{1,2}):(\d{2})$/
      .exec(
        cleanText(value)
      );


  if (!match) {

    return null;

  }


  return (
    Number(match[1]) *
    60 +
    Number(match[2])
  );

}


function getOrbPageClock(
  doc
) {

  const text =
    doc.body?.innerText ||
    doc.body?.textContent ||
    "";


  const match =
    text.match(
      /\b(?:nu|now)\s+in\s+[^)\n]{0,60}?(\d{1,2}:\d{2})\b/i
    );


  if (match) {

    return clockToMinutes(
      match[1]
    );

  }


  const now =
    new Date();


  return (
    now.getHours() *
    60 +
    now.getMinutes()
  );

}


function getClockAgeMinutes(
  time,
  nowMinutes
) {

  const value =
    clockToMinutes(
      time
    );


  if (
    value === null
  ) {

    return Infinity;

  }


  return (
    nowMinutes -
    value +
    1440
  ) % 1440;

}


function applyTrackOrder(
  split,
  provider
) {

  if (
    provider.order ===
    "title-artist"
  ) {

    return {
      artist:
        split.title,

      title:
        split.artist
    };

  }


  return split;

}


function classifyOrbText(
  value,
  station,
  provider
) {

  const text =
    cleanText(
      value
    );


  if (!text) {

    return {
      type:
        "block"
    };

  }


  const stationNoise =
    isStationNoise(
      text,
      station
    );


  /*
   * Branding zoals
   * "Studio Brussel" of
   * "Life is Music" mag worden
   * overgeslagen.
   */

  if (
    stationNoise
  ) {

    if (
      isHardNoTrack(
        text
      )
    ) {

      return {
        type:
          "block"
      };

    }


    return {
      type:
        "noise"
    };

  }


  const split =
    splitTrack(
      text
    );


  if (split) {

    return {
      type:
        "track",

      result:
        applyTrackOrder(
          split,
          provider
        )
    };

  }


  if (
    isHardNoTrack(
      text
    )
  ) {

    return {
      type:
        "block"
    };

  }


  /*
   * Onbekende niet-track-regel:
   * waarschijnlijk presentator,
   * praatblok of programma.
   *
   * Daarom niet terugvallen op
   * een oudere track.
   */

  return {
    type:
      "block"
  };

}


function evaluateOrbTimedRows(
  rows,
  startIndex,
  station,
  provider,
  pageClock
) {

  const maxAge =
    provider.maxAgeMinutes ??
    6;


  for (
    let i =
      startIndex;

    i < rows.length;

    i++
  ) {

    const row =
      rows[i];


    if (
      row.time
        .toLowerCase() ===
      "live"
    ) {

      continue;

    }


    if (
      !/^\d{1,2}:\d{2}$/
        .test(
          row.time
        )
    ) {

      continue;

    }


    const age =
      getClockAgeMinutes(
        row.time,
        pageClock
      );


    if (
      age >
      maxAge
    ) {

      return {
        noTrack: true
      };

    }


    const classification =
      classifyOrbText(
        row.text,
        station,
        provider
      );


    if (
      classification.type ===
      "noise"
    ) {

      continue;

    }


    if (
      classification.type ===
      "track"
    ) {

      return classification.result;

    }


    return {
      noTrack: true
    };

  }


  return {
    noTrack: true
  };

}


async function getOrbMetadata(
  provider,
  station
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const rows =
    extractOrbRows(
      doc
    );


  if (
    !rows.length
  ) {

    return null;

  }


  if (
    provider.format ===
    "classical"
  ) {

    return getClassicalOrbMetadata(
      rows,
      station,
      provider,
      doc
    );

  }


  const pageClock =
    getOrbPageClock(
      doc
    );


  const liveIndex =
    rows.findIndex(
      row =>
        row.active ||
        row.time
          .toLowerCase() ===
          "live"
    );


  if (
    liveIndex >= 0
  ) {

    const live =
      classifyOrbText(
        rows[liveIndex].text,
        station,
        provider
      );


    if (
      live.type ===
      "track"
    ) {

      return live.result;

    }


    if (
      live.type ===
      "block"
    ) {

      return {
        noTrack: true
      };

    }


    /*
     * Live-regel is alleen branding.
     * Kijk dan alleen naar de direct
     * daaropvolgende recente regels.
     */

    return evaluateOrbTimedRows(
      rows,
      liveIndex + 1,
      station,
      provider,
      pageClock
    );

  }


  /*
   * Geen Live-regel.
   * Alleen de allereerste actuele /
   * voldoende recente tijdregel mag
   * iets opleveren.
   */

  return evaluateOrbTimedRows(
    rows,
    0,
    station,
    provider,
    pageClock
  );

}


/* =========================================================
   KLARA
   ========================================================= */

function getClassicalOrbMetadata(
  rows,
  station,
  provider,
  doc
) {

  const pageClock =
    getOrbPageClock(
      doc
    );


  const maxAge =
    provider.maxAgeMinutes ??
    15;


  const useful = [];


  for (
    const row
    of rows
  ) {

    if (
      row.time
        .toLowerCase() !==
        "live" &&
      /^\d{1,2}:\d{2}$/
        .test(
          row.time
        )
    ) {

      const age =
        getClockAgeMinutes(
          row.time,
          pageClock
        );


      if (
        age >
        maxAge
      ) {

        break;

      }

    }


    if (
      isHardNoTrack(
        row.text
      )
    ) {

      return {
        noTrack: true
      };

    }


    if (
      isStationNoise(
        row.text,
        station
      )
    ) {

      continue;

    }


    useful.push(
      row
    );


    if (
      useful.length >= 4
    ) {

      break;

    }

  }


  if (
    !useful.length
  ) {

    return {
      noTrack: true
    };

  }


  for (
    const row
    of useful
  ) {

    const split =
      splitTrack(
        row.text
      );


    if (split) {

      return split;

    }

  }


  const values =
    useful
      .map(
        row =>
          cleanText(
            row.text
          )
      )
      .filter(Boolean);


  const result =
    classifyClassical(
      values
    );


  return (
    result ||
    {
      noTrack: true
    }
  );

}


function classifyClassical(
  values
) {

  values =
    values
      .map(
        cleanText
      )
      .filter(Boolean);


  if (
    values.length < 2
  ) {

    return null;

  }


  const workRegex =
    /(concerto|concert|sonat|symfon|symphon|suite|serenad|requiem|aria|partita|nocturne|prelude|fuga|fugue|rondo|opus|op\.|bwv|adagio|allegro|andante|wals|walz|mazurka|polonaise)/i;


  let workIndex =
    values.findIndex(
      value =>
        workRegex.test(
          value
        )
    );


  if (
    workIndex < 0
  ) {

    return null;

  }


  const work =
    values[
      workIndex
    ];


  const composer =
    values.find(
      (
        value,
        index
      ) =>
        index !==
          workIndex &&
        !/\(|orchestra|orkest|ensemble|piano|violin|viool|cello|koor|choir|tenor|sopraan|bariton/i
          .test(
            value
          )
    );


  if (
    !composer ||
    !work
  ) {

    return null;

  }


  return {
    artist:
      composer,

    title:
      work
  };

}


/* =========================================================
   TRACK ROUTER
   ========================================================= */

async function resolveMetadataProvider(
  provider,
  station
) {

  switch (
    provider.type
  ) {

    case "npo":

      return await getNpoMetadata(
        provider
      );


    case "triton":

      return await getTritonMetadata(
        provider
      );


    case "orb":

      return await getOrbMetadata(
        provider,
        station
      );


    case "kink":

      return await getKinkMetadata(
        provider
      );


    default:

      return null;

  }

}


/* =========================================================
   REFRESH TRACK
   ========================================================= */

async function refreshMetadata() {

  if (
    document.visibilityState ===
    "hidden"
  ) {

    return;

  }


  if (
    isContentSuppressed()
  ) {

    clearTrack();

    return;

  }


  const generation =
    metadataGeneration;


  const stationIndex =
    currentIndex;


  const station =
    stations[
      stationIndex
    ];


  if (
    !station.metadata?.length
  ) {

    clearTrack();

    return;

  }


  let resolved =
    false;


  for (
    const provider
    of station.metadata
  ) {

    if (
      generation !==
        metadataGeneration ||
      stationIndex !==
        currentIndex
    ) {

      return;

    }


    try {

      const result =
        await resolveMetadataProvider(
          provider,
          station
        );


      if (
        generation !==
          metadataGeneration ||
        stationIndex !==
          currentIndex
      ) {

        return;

      }


      if (
        result?.noTrack
      ) {

        clearTrack();

        return;

      }


      if (
        result?.title
      ) {

        setTrack(
          result.artist || "",
          result.title
        );


        return;

      }


      if (result) {

        resolved =
          true;

      }

    }

    catch {}

  }


  if (
    !resolved &&
    currentTrack.title &&
    Date.now() -
      currentTrackUpdatedAt >
      TRACK_STALE_MS
  ) {

    clearTrack();

  }


  if (
    !currentTrack.title
  ) {

    clearTrack();

  }

}


/* =========================================================
   PROGRAM PARSERS
   ========================================================= */

function cleanProgramValue(
  value,
  station
) {

  let text =
    cleanText(
      value
    );


  if (!text) {

    return "";

  }


  text =
    text.replace(
      /^nu live:\s*/i,
      ""
    );


  text =
    text.replace(
      /^nu live\s*/i,
      ""
    );


  text =
    text.replace(
      /^now on air[:\s]*/i,
      ""
    );


  if (
    isInvalidProgram(
      text
    )
  ) {

    return "";

  }


  if (
    station &&
    text.toLowerCase() ===
      station.name.toLowerCase()
  ) {

    return "";

  }


  return text;

}


/* ---------------------------------------------------------
   NPO LIVE
   --------------------------------------------------------- */

async function getNpoLiveProgram(
  provider,
  station
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const lines =
    documentLines(
      doc
    );


  for (
    let i = 0;
    i < lines.length;
    i++
  ) {

    const line =
      lines[i];


    const inline =
      line.match(
        /^nu live:\s*(.+)$/i
      );


    if (
      inline?.[1]
    ) {

      const result =
        cleanProgramValue(
          inline[1],
          station
        );


      if (result) {

        return result;

      }

    }


    if (
      /^nu live:?$/i.test(
        line
      )
    ) {

      for (
        let j =
          i + 1;

        j <
          Math.min(
            lines.length,
            i + 8
          );

        j++
      ) {

        const candidate =
          cleanProgramValue(
            lines[j],
            station
          );


        if (
          candidate &&
          !/^(luister|kijk|playlist|volume)/i
            .test(candidate)
        ) {

          return candidate;

        }

      }

    }

  }


  return "";

}


/* ---------------------------------------------------------
   NPO RADIO 5
   --------------------------------------------------------- */

async function getNpo5Program(
  provider,
  station
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const headings =
    documentHeadings(
      doc,
      "h2"
    );


  for (
    const heading
    of headings
  ) {

    const candidate =
      cleanProgramValue(
        heading,
        station
      );


    if (
      !candidate
    ) {

      continue;

    }


    if (
      /^(nieuws|artikelen|podcasts|muziek|playlist|gemist|meer van)/i
        .test(candidate)
    ) {

      continue;

    }


    return candidate;

  }


  return "";

}


/* ---------------------------------------------------------
   TALPA
   --------------------------------------------------------- */

async function getTalpaProgram(
  provider,
  station
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const lines =
    documentLines(
      doc
    );


  const start =
    lines.findIndex(
      line =>
        /^nu live$/i.test(
          line
        )
    );


  if (
    start < 0
  ) {

    return "";

  }


  const skip =
    /^(kijk live|luister live|stuur bericht|volume|playlist|programmering|radio|home)$/i;


  for (
    let i =
      start + 1;

    i <
      Math.min(
        lines.length,
        start + 20
      );

    i++
  ) {

    const line =
      lines[i];


    if (
      skip.test(line) ||
      /^\d{1,2}:\d{2}/
        .test(line) ||
      /^elke\s/i.test(line)
    ) {

      continue;

    }


    const candidate =
      cleanProgramValue(
        line,
        station
      );


    if (candidate) {

      return candidate;

    }

  }


  return "";

}

async function getMediahuisProgram(

) {

  const doc =
    await fetchDocument(

    );


  const headings =
    documentHeadings(

    );


  for (
    const heading
    of headings
  ) {

    const candidate =
      cleanProgramValue(
        heading,
        station
      );


    if (
      !candidate
    ) {

      continue;

    }


    if (
      /^(eerder op|meer van|nieuws|acties|win|ontdek|playlist|programma's|programma’s)/i
        .test(candidate)
    ) {

      continue;

    }


    return candidate;

  }


  return "";

}


/* ---------------------------------------------------------
   BNR
   --------------------------------------------------------- */

async function getBnrProgram(
  provider,
  station
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const headings =
    documentHeadings(
      doc,
      "h3"
    );


  for (
    const heading
    of headings
  ) {

    const candidate =
      cleanProgramValue(
        heading,
        station
      );


    if (
      !candidate
    ) {

      continue;

    }


    if (
      /^(luister live|kijk live|nieuws)/i
        .test(candidate)
    ) {

      continue;

    }


    return candidate;

  }


  return "";

}


/* ---------------------------------------------------------
   KINK
   --------------------------------------------------------- */

async function getKinkProgram(
  provider,
  station
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const lines =
    documentLines(
      doc
    );


  const start =
    lines.findIndex(
      line =>
        /^now on air\b/i.test(
          line
        )
    );


  if (
    start < 0
  ) {

    return "";

  }


  for (
    let i =
      start + 1;

    i <
      Math.min(
        lines.length,
        start + 5
      );

    i++
  ) {

    const candidate =
      cleanProgramValue(
        lines[i],
        station
      );


    if (
      candidate &&
      !/^nu op kink$/i.test(
        candidate
      )
    ) {

      return candidate;

    }

  }


  return "";

}


/* =========================================================
   PROGRAM ROUTER
   ========================================================= */

async function resolveProgram(
  provider,
  station
) {

  switch (
    provider.type
  ) {

    case "npo-live":

      return await getNpoLiveProgram(
        provider,
        station
      );


    case "npo5-home":

      return await getNpo5Program(
        provider,
        station
      );


    case "talpa-home":

      return await getTalpaProgram(
        provider,
        station
      );


    case "mediahuis-home":

      return await getMediahuisProgram(
        provider,
        station
      );


    case "bnr":

      return await getBnrProgram(
        provider,
        station
      );


    case "kink":

      return await getKinkProgram(
        provider,
        station
      );


    default:

      return "";

  }

}


/* =========================================================
   REFRESH PROGRAM
   ========================================================= */

async function refreshProgram() {

  if (
    document.visibilityState ===
    "hidden"
  ) {

    return;

  }


  if (
    isContentSuppressed()
  ) {

    clearProgram();

    return;

  }


  const generation =
    programGeneration;


  const stationIndex =
    currentIndex;


  const station =
    stations[
      stationIndex
    ];


  if (
    !station.program
  ) {

    clearProgram();

    return;

  }


  try {

    const value =
      await resolveProgram(
        station.program,
        station
      );


    if (
      generation !==
        programGeneration ||
      stationIndex !==
        currentIndex
    ) {

      return;

    }


    if (value) {

      setProgram(
        value
      );

      return;

    }


    if (
      currentProgram &&
      Date.now() -
        currentProgramUpdatedAt >
        PROGRAM_STALE_MS
    ) {

      clearProgram();

    }


    if (!currentProgram) {

      clearProgram();

    }

  }

  catch {

    if (
      generation ===
        programGeneration &&
      stationIndex ===
        currentIndex &&
      currentProgram &&
      Date.now() -
        currentProgramUpdatedAt >
        PROGRAM_STALE_MS
    ) {

      clearProgram();

    }

  }

}


/* =========================================================
   WIKIPEDIA
   ========================================================= */

function normalizeWikiText(
  value
) {

  return String(
    value || ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .toLowerCase()
  .replace(
    /&/g,
    " and "
  )
  .replace(
    /[^a-z0-9]+/g,
    " "
  )
  .trim();

}


function stripParentheses(
  value
) {

  return cleanText(
    String(value || "")
      .replace(
        /\s*\([^)]*\)\s*$/,
        ""
      )
  );

}


function stripHtml(
  value
) {

  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    value || "";


  return cleanText(
    div.textContent || ""
  );

}


function wikipediaUrl(
  language,
  title
) {

  return (
    `https://${language}.wikipedia.org/wiki/` +
    encodeURIComponent(
      title.replace(
        / /g,
        "_"
      )
    )
  );

}


async function wikipediaSearch(
  language,
  query
) {

  const url =
    `https://${language}.wikipedia.org/w/api.php` +
    "?action=query" +
    "&list=search" +
    "&srnamespace=0" +
    "&srlimit=5" +
    "&format=json" +
    "&origin=*" +
    "&srsearch=" +
    encodeURIComponent(
      query
    );


  const text =
    await fetchTextWithTimeout(
      url,
      REQUEST_TIMEOUT
    );


  const data =
    JSON.parse(
      text
    );


  return (
    data
      ?.query
      ?.search ||
    []
  );

}


function scoreWikipediaArtist(
  result,
  artist
) {

  const wanted =
    normalizeWikiText(
      artist
    );


  const title =
    normalizeWikiText(
      result.title
    );


  const titleBase =
    normalizeWikiText(
      stripParentheses(
        result.title
      )
    );


  const snippet =
    normalizeWikiText(
      stripHtml(
        result.snippet
      )
    );


  let score = 0;


  if (
    title === wanted
  ) {
    score += 120;
  }


  if (
    titleBase === wanted
  ) {
    score += 110;
  }


  if (
    title.includes(wanted)
  ) {
    score += 55;
  }


  if (
    snippet.includes(wanted)
  ) {
    score += 20;
  }


  if (
    /(band|zanger|zangeres|rapper|dj|muzikant|musicus|singer|musician|record producer|musical group|rock band|pop group)/
      .test(
        snippet
      )
  ) {
    score += 25;
  }


  return score;

}


async function findWikipediaArtist(
  artist
) {

  if (!artist) {
    return null;
  }


  const cacheKey =
    "artist:" +
    normalizeWikiText(
      artist
    );


  const cached =
    readWikiCache(
      cacheKey
    );


  if (
    cached !== undefined
  ) {
    return cached;
  }


  let best = null;


  for (
    const language
    of ["nl", "en"]
  ) {

    try {

      const results =
        await wikipediaSearch(
          language,
          `"${artist}"`
        );


      for (
        const result
        of results
      ) {

        const score =
          scoreWikipediaArtist(
            result,
            artist
          );


        if (
          !best ||
          score > best.score
        ) {

          best = {
            language,
            title:
              result.title,
            score
          };

        }

      }


      if (
        best &&
        best.score >= 100
      ) {

        break;

      }

    }

    catch {}

  }


  const match =
    best &&
    best.score >= 80
      ? {
          title:
            best.title,

          url:
            wikipediaUrl(
              best.language,
              best.title
            )
        }
      : null;


  writeWikiCache(
    cacheKey,
    match
  );


  return match;

}


function scoreWikipediaTrack(
  result,
  artist,
  track
) {

  const wantedArtist =
    normalizeWikiText(
      artist
    );


  const wantedTrack =
    normalizeWikiText(
      track
    );


  const title =
    normalizeWikiText(
      result.title
    );


  const titleBase =
    normalizeWikiText(
      stripParentheses(
        result.title
      )
    );


  const snippet =
    normalizeWikiText(
      stripHtml(
        result.snippet
      )
    );


  let score = 0;


  if (
    titleBase === wantedTrack
  ) {
    score += 70;
  }


  if (
    title.startsWith(
      wantedTrack + " "
    )
  ) {
    score += 50;
  }


  if (
    title.includes(
      wantedTrack
    )
  ) {
    score += 20;
  }


  if (
    wantedArtist &&
    title.includes(
      wantedArtist
    )
  ) {
    score += 35;
  }


  if (
    wantedArtist &&
    snippet.includes(
      wantedArtist
    )
  ) {
    score += 35;
  }


  if (
    /(single|nummer|lied|song|track|recording|opgenomen|uitgebracht|released)/
      .test(
        snippet
      )
  ) {
    score += 15;
  }


  return score;

}


async function findWikipediaTrack(
  artist,
  title
) {

  if (
    !artist ||
    !title
  ) {

    return null;

  }


  const cacheKey =
    "track:" +
    normalizeWikiText(
      artist
    ) +
    "|" +
    normalizeWikiText(
      title
    );


  const cached =
    readWikiCache(
      cacheKey
    );


  if (
    cached !== undefined
  ) {

    return cached;

  }


  let best = null;


  const searches = [

    {
      language: "nl",

      query:
        `"${title}" "${artist}" nummer`
    },

    {
      language: "en",

      query:
        `"${title}" "${artist}" song`
    }

  ];


  for (
    const search
    of searches
  ) {

    try {

      const results =
        await wikipediaSearch(
          search.language,
          search.query
        );


      for (
        const result
        of results
      ) {

        const score =
          scoreWikipediaTrack(
            result,
            artist,
            title
          );


        if (
          !best ||
          score > best.score
        ) {

          best = {
            language:
              search.language,

            title:
              result.title,

            score
          };

        }

      }


      if (
        best &&
        best.score >= 110
      ) {

        break;

      }

    }

    catch {}

  }


  const match =
    best &&
    best.score >= 90
      ? {
          title:
            best.title,

          url:
            wikipediaUrl(
              best.language,
              best.title
            )
        }
      : null;


  writeWikiCache(
    cacheKey,
    match
  );


  return match;

}


function applyWikipediaLink(
  element,
  result,
  label
) {

  if (!result) {

    return;

  }


  element.href =
    result.url;


  element.target =
    "_blank";


  element.rel =
    "noopener noreferrer";


  element.title =
    `${label} op Wikipedia: ${result.title}`;


  element.classList.add(
    "has-wiki"
  );

}


async function updateWikipediaLinks(
  artist,
  title
) {

  wikipediaGeneration++;


  const generation =
    wikipediaGeneration;


  if (
    !artist ||
    !title
  ) {

    return;

  }


  const expectedArtist =
    artist;


  const expectedTitle =
    title;


  const [
    artistResult,
    trackResult
  ] =
    await Promise.all([

      findWikipediaArtist(
        artist
      ),

      findWikipediaTrack(
        artist,
        title
      )

    ]);


  if (
    generation !==
      wikipediaGeneration ||
    currentTrack.artist !==
      expectedArtist ||
    currentTrack.title !==
      expectedTitle
  ) {

    return;

  }


  applyWikipediaLink(
    trackArtist,
    artistResult,
    artist
  );


  applyWikipediaLink(
    trackTitle,
    trackResult,
    `${artist} – ${title}`
  );

}

/* =========================================================
   SLEEP TIMER
   ========================================================= */

function openSleepMenu() {

  sleepMenu.hidden =
    false;


  sleepButton.setAttribute(
    "aria-expanded",
    "true"
  );

}


function closeSleepMenu() {

  sleepMenu.hidden =
    true;


  sleepButton.setAttribute(
    "aria-expanded",
    "false"
  );

}


sleepButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();


    if (
      sleepMenu.hidden
    ) {

      openSleepMenu();

    }

    else {

      closeSleepMenu();

    }

  }
);


document
  .querySelectorAll(
    ".sleep-option"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          setSleepTimer(
            Number(
              button.dataset.minutes
            )
          );


          closeSleepMenu();

        }
      );

    }
  );


document.addEventListener(
  "click",
  event => {

    if (
      !event.target.closest(
        ".sleep-wrap"
      )
    ) {

      closeSleepMenu();

    }

  }
);


function setSleepTimer(
  minutes
) {

  if (!minutes) {

    sleepUntil =
      0;


    localStorage.removeItem(
      "radio-sleep-until"
    );


    updateSleepTimer();


    return;

  }


  sleepUntil =
    Date.now() +
    minutes *
    60000;


  localStorage.setItem(
    "radio-sleep-until",
    String(
      sleepUntil
    )
  );


  updateSleepTimer();

}


function updateSleepTimer() {

  if (!sleepUntil) {

    sleepButton
      .classList
      .remove(
        "active"
      );


    sleepText.textContent =
      "";


    return;

  }


  const remaining =
    sleepUntil -
    Date.now();


  if (
    remaining <= 0
  ) {

    sleepUntil =
      0;


    localStorage.removeItem(
      "radio-sleep-until"
    );


    sleepButton
      .classList
      .remove(
        "active"
      );


    sleepText.textContent =
      "";


    if (
      !audio.paused
    ) {

      pause(
        "Slaaptimer afgelopen"
      );

    }


    return;

  }


  const totalSeconds =
    Math.ceil(
      remaining /
      1000
    );


  const minutes =
    Math.floor(
      totalSeconds /
      60
    );


  const seconds =
    totalSeconds %
    60;


  sleepButton
    .classList
    .add(
      "active"
    );


  sleepText.textContent =
    `${minutes}:${
      String(
        seconds
      )
      .padStart(
        2,
        "0"
      )
    }`;

}


window.setInterval(
  updateSleepTimer,
  1000
);


/* =========================================================
   NEXT / PREVIOUS
   ========================================================= */

function moveStation(
  direction
) {

  const order =
    getVisibleDisplayOrder()
      .map(
        item =>
          item.index
      );


  /*
   * Beide landen ingeklapt:
   * niet naar een verborgen station
   * navigeren.
   */

  if (
    !order.length
  ) {

    return;

  }


  const position =
    order.indexOf(
      currentIndex
    );


  let target;


  /*
   * Huidige station zit in een
   * ingeklapt land.
   */

  if (
    position < 0
  ) {

    target =
      direction > 0
        ? order[0]
        : order[
            order.length - 1
          ];

  }

  else {

    target =
      order[
        (
          position +
          direction +
          order.length
        ) %
        order.length
      ];

  }


  selectStation(
    target,
    !audio.paused
  );

}


function nextStation() {

  moveStation(
    1
  );

}


function previousStation() {

  moveStation(
    -1
  );

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      document.activeElement
        .tagName ===
      "INPUT"
    ) {

      return;

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      togglePlay();

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      event.preventDefault();

      nextStation();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      event.preventDefault();

      previousStation();

    }


    if (
      event.key ===
      "Escape"
    ) {

      closeSleepMenu();

    }

  }
);


/* =========================================================
   MEDIA SESSION
   ========================================================= */

function updateMediaSession() {

  if (
    !(
      "mediaSession"
      in navigator
    )
  ) {

    return;

  }


  const station =
    stations[
      currentIndex
    ];


  const metadata = {

    title:
      currentTrack.title ||
      station.name,

    artist:
      currentTrack.artist ||
      currentProgram ||
      "Live radio",

    album:
      station.name

  };


  const logo =
    getStationLogo(
      station
    );


  try {

    if (logo) {

      metadata.artwork = [
        {
          src:
            logo
        }
      ];

    }


    navigator
      .mediaSession
      .metadata =
      new MediaMetadata(
        metadata
      );

  }

  catch {

    delete metadata.artwork;


    navigator
      .mediaSession
      .metadata =
      new MediaMetadata(
        metadata
      );

  }

}


if (
  "mediaSession"
  in navigator
) {

  navigator
    .mediaSession
    .setActionHandler(
      "play",
      () =>
        play()
    );


  navigator
    .mediaSession
    .setActionHandler(
      "pause",
      () =>
        pause()
    );


  navigator
    .mediaSession
    .setActionHandler(
      "nexttrack",
      () =>
        nextStation()
    );


  navigator
    .mediaSession
    .setActionHandler(
      "previoustrack",
      () =>
        previousStation()
    );

}


/* =========================================================
   NETWORK
   ========================================================= */

window.addEventListener(
  "offline",
  () => {

    status.textContent =
      "Geen internetverbinding";

  }
);


window.addEventListener(
  "online",
  () => {

    status.textContent =
      audio.paused
        ? "Internetverbinding hersteld"
        : "Live";


    refreshMetadata();

    refreshProgram();

  }
);

   START
   ========================================================= */

function initialise() {

  const station =
    stations[
      currentIndex
    ];


  stationTitle.textContent =
    station.name;


  stationMark.textContent =
    station.mark;


  document.documentElement
    .style
    .setProperty(

    );


  document.documentElement
    .style
    .setProperty(
      "--accent-rgb",

    );


  audio.src =
    station.stream;


  preRollGuardPending =
    Boolean(
      station.preRollTrackGuardSeconds
    );


  updateVolumeBar();

  updateMuteUI();

  updateMainLogo();

  renderStations();

  updateBrowserIdentity();

  updateMediaSession();

  updateSleepTimer();

  refreshMetadata();

  refreshProgram();

}


initialise();
