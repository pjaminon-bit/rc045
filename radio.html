  }


  const block =
    doc.querySelector(
      "nowplaying-info"
    );


  if (!block) {

    return null;

  }


  const props =
    [
      ...block.querySelectorAll(
        "property"
      )
    ]
    .map(
      property =>
        cleanText(
          property.textContent
        )
    );


  if (
    !props.length
  ) {

    return null;

  }


  const type =
    (
      props[0] ||
      ""
    )
    .toLowerCase();


  const duration =
    parseDurationMilliseconds(
      props[1]
    );


  const start =
    parseEpochMilliseconds(
      props[2]
    );


  const title =
    cleanText(
      props[3]
    );


  const artist =
    cleanText(
      props[4]
    );


  if (
    /break|advert|commercial|spot|promo/
      .test(type)
  ) {

    return {
      noTrack: true
    };

  }


  if (
    start &&
    duration
  ) {

    const now =
      Date.now();


    const end =
      start +
      duration;


    if (
      now <
        start - 5000 ||
      now >
        end + 5000
    ) {

      return {
        noTrack: true
      };

    }

  }


  if (
    !artist ||
    !title ||
    artist.toLowerCase() ===
      "null" ||
    title.toLowerCase() ===
      "null"
  ) {

    return {
      noTrack: true
    };

  }


  return {
    artist,
    title
  };

}


/* =========================================================
   SKY RADIO DIRECT TRITON
   ========================================================= */

async function getTritonTrackMetadata(
  provider
) {

  /*
   * Rechtstreeks naar de publieke
   * Triton endpoint.
   */

  const url =
    "https://np.tritondigital.com/public/nowplaying" +
    "?mountName=" +
    encodeURIComponent(
      provider.mount
    ) +
    "&numberToFetch=2" +
    "&eventType=track" +
    "&rnd=" +
    Date.now();


  const xml =
    await fetchTextDirect(
      url
    );


  const doc =
    new DOMParser()
      .parseFromString(
        xml,
        "application/xml"
      );


  if (
    doc.querySelector(
      "parsererror"
    )
  ) {

    return null;

  }


  const block =
    doc.querySelector(
      "nowplaying-info"
    );


  if (!block) {

    return {
      noTrack: true
    };

  }


  /*
   * SKYRADIO eventType=track:
   *
   * 0 = duur (ms)
   * 1 = starttijd epoch (ms)
   * 2 = titel
   * 3 = artiest
   * 4 = ISRC
   */

  const props =
    [
      ...block.querySelectorAll(
        "property"
      )
    ]
    .map(
      property =>
        cleanText(
          property.textContent
        )
    );


  if (
    props.length < 4
  ) {

    return {
      noTrack: true
    };

  }


  const duration =
    parseDurationMilliseconds(
      props[0]
    );


  const start =
    parseEpochMilliseconds(
      props[1]
    );


  const title =
    cleanText(
      props[2]
    );


  const artist =
    cleanText(
      props[3]
    );


  if (
    !title ||
    !artist
  ) {

    return {
      noTrack: true
    };

  }


  /*
   * eventType=track geeft de laatste
   * song terug, óók als er daarna
   * inmiddels reclame is gestart.
   *
   * Daarom is het tijdvenster leidend.
   */

  if (
    start &&
    duration
  ) {

    const now =
      Date.now();


    const end =
      start +
      duration;


    if (
      now <
        start - 4000 ||
      now >
        end + 7000
    ) {

      return {
        noTrack: true
      };

    }

  }


  return {
    artist,
    title
  };

}

/* =========================================================
   REFRESH TRACK
   ========================================================= */

async function refreshMetadata() {

  if (
    document.visibilityState ===
    "hidden"
  ) {

    return;

  }


  if (
    isContentSuppressed()
  ) {

    clearTrack();

    return;

  }


  const generation =
    metadataGeneration;


  const stationIndex =
    currentIndex;


  const station =
    stations[
      stationIndex
    ];


  if (
    !station.metadata?.length
  ) {

    clearTrack();

    return;

  }


  let resolved =
    false;


  for (
    const provider
    of station.metadata
  ) {

    if (
      generation !==
        metadataGeneration ||
      stationIndex !==
        currentIndex
    ) {

      return;

    }


    try {

      const result =
        await resolveMetadataProvider(
          provider,
          station
        );


      if (
        generation !==
          metadataGeneration ||
        stationIndex !==
          currentIndex
      ) {

        return;

      }


      if (
        result &&
        Object.prototype.hasOwnProperty.call(
          result,
          "program"
        )
      ) {

        if (
          result.program
        ) {

          setProgram(
            result.program
          );

        }

        else {

          clearProgram();

        }

      }


      if (
        result?.noTrack
      ) {

        clearTrack();

        return;

      }


      if (
        result?.title
      ) {

        setTrack(
          result.artist || "",
          result.title
        );


        return;

      }


      if (result) {

        resolved =
          true;

      }

    }

    catch {}


  }


  if (
    !resolved &&
    currentTrack.title &&
    Date.now() -
      currentTrackUpdatedAt >
      TRACK_STALE_MS
  ) {

    clearTrack();

  }


  if (
    !currentTrack.title
  ) {

    clearTrack();

  }

}


/* =========================================================
   PROGRAM PARSERS
   ========================================================= */

function cleanProgramValue(
  value,
  station
) {

  let text =
    cleanText(
      value
    );


  if (!text) {

    return "";

  }


  text =
    text.replace(
      /^nu live:\s*/i,
      ""
    );


  text =
    text.replace(
      /^nu live\s*/i,
      ""
    );


  text =
    text.replace(
      /^now on air[:\s]*/i,
      ""
    );


  if (
    isInvalidProgram(
      text
    )
  ) {

    return "";

  }


  if (
    station &&
    text.toLowerCase() ===
      station.name.toLowerCase()
  ) {

    return "";

  }


  return text;

}


async function getNpoLiveProgram(
  provider,
  station
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const lines =
    documentLines(
      doc
    );


  for (
    let i = 0;
    i < lines.length;
    i++
  ) {

    const line =
      lines[i];


    const inline =
      line.match(
        /^nu live:\s*(.+)$/i
      );


    if (
      inline?.[1]
    ) {

      const result =
        cleanProgramValue(
          inline[1],
          station
        );


      if (result) {

        return result;

      }

    }


    if (
      /^nu live:?$/i.test(
        line
      )
    ) {

      for (
        let j =
          i + 1;

        j <
          Math.min(
            lines.length,
            i + 8
          );

        j++
      ) {

        const candidate =
          cleanProgramValue(
            lines[j],
            station
          );


        if (
          candidate &&
          !/^(luister|kijk|playlist|volume)/i
            .test(candidate)
        ) {

          return candidate;

        }

      }

    }

  }


  return "";

}

      !candidate
    ) {

      continue;

    }


    if (
      /^(nieuws|artikelen|podcasts|muziek|playlist|gemist|meer van)/i
        .test(candidate)
    ) {

    }


    return candidate;

  }

}


async function getTalpaProgram(
  provider,
  station
) {

  const doc =
    await fetchDocument(
      provider.url
    );


  const lines =
    documentLines(
      doc
    );


  const start =
    lines.findIndex(
      line =>
        /^nu live$/i.test(
          line
        )
    );


  if (
    start < 0
  ) {

    return "";

  }


  const skip =
    /^(kijk live|luister live|stuur bericht|volume|playlist|programmering|radio|home)$/i;


  for (
    let i =
      start + 1;

    i <
      Math.min(
        lines.length,
        start + 20
      );

    i++
  ) {

    const line =
      lines[i];


    if (
      skip.test(line) ||
      /^\d{1,2}:\d{2}/
        .test(line) ||
      /^elke\s/i.test(line)
    ) {

      continue;

    }


    const candidate =
      cleanProgramValue(
        line,
        station
      );


    if (candidate) {

      return candidate;

    }

  }


  return "";

}

/* =========================================================
   REFRESH PROGRAM
   ========================================================= */

async function refreshProgram() {

  if (
    document.visibilityState ===
    "hidden"
  ) {

    return;

  }


  if (
    isContentSuppressed()
  ) {

    clearProgram();

    return;

  }


  const generation =
    programGeneration;


  const stationIndex =
    currentIndex;


  const station =
    stations[
      stationIndex
    ];


  if (
    !station.program
  ) {

    const hasEmbeddedProgram =
      station.metadata?.some(
        provider =>
          provider.type ===
          "be"
      );


    if (
      hasEmbeddedProgram
    ) {

      if (
        currentProgram &&
        Date.now() -
          currentProgramUpdatedAt >
          PROGRAM_STALE_MS
      ) {

        clearProgram();

      }


      return;

    }


    clearProgram();

    return;

  }


  try {

    const value =
      await resolveProgram(
        station.program,
        station
      );


    if (
      generation !==
        programGeneration ||
      stationIndex !==
        currentIndex
    ) {

      return;

    }


    if (value) {

      setProgram(
        value
      );

      return;

    }


    if (
      currentProgram &&
      Date.now() -
        currentProgramUpdatedAt >
        PROGRAM_STALE_MS
    ) {

      clearProgram();

    }


    if (!currentProgram) {

      clearProgram();

    }

  }

  catch {

    if (
      generation ===
        programGeneration &&
      stationIndex ===
        currentIndex &&
      currentProgram &&
      Date.now() -
        currentProgramUpdatedAt >
        PROGRAM_STALE_MS
    ) {

      clearProgram();

    }

  }

}


/* =========================================================
   WIKIPEDIA
   ========================================================= */

function normalizeWikiText(
  value
) {

  return String(
    value || ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .toLowerCase()
  .replace(
    /&/g,
    " and "
  )
  .replace(
    /[^a-z0-9]+/g,
    " "
  )
  .trim();

}


function stripParentheses(
  value
) {

  return cleanText(
    String(value || "")
      .replace(
        /\s*\([^)]*\)\s*$/,
        ""
      )
  );

}


function stripHtml(
  value
) {

  const div =
    document.createElement(
      "div"
    );


  div.innerHTML =
    value || "";


  return cleanText(
    div.textContent || ""
  );

}


function wikipediaUrl(
  language,
  title
) {

  return (
    `https://${language}.wikipedia.org/wiki/` +
    encodeURIComponent(
      title.replace(
        / /g,
        "_"
      )
    )
  );

}


async function wikipediaSearch(
  language,
  query
) {

  const url =
    `https://${language}.wikipedia.org/w/api.php` +
    "?action=query" +
    "&list=search" +
    "&srnamespace=0" +
    "&srlimit=5" +
    "&format=json" +
    "&origin=*" +
    "&srsearch=" +
    encodeURIComponent(
      query
    );


  const text =
    await fetchTextWithTimeout(
      url,
      REQUEST_TIMEOUT
    );


  const data =
    JSON.parse(
      text
    );


  return (
    data
      ?.query
      ?.search ||
    []
  );

}


function scoreWikipediaArtist(
  result,
  artist
) {

  const wanted =
    normalizeWikiText(
      artist
    );


  const title =
    normalizeWikiText(
      result.title
    );


  const titleBase =
    normalizeWikiText(
      stripParentheses(
        result.title
      )
    );


  const snippet =
    normalizeWikiText(
      stripHtml(
        result.snippet
      )
    );


  let score = 0;


  if (
    title === wanted
  ) {
    score += 120;
  }


  if (
    titleBase === wanted
  ) {
    score += 110;
  }


  if (
    title.includes(wanted)
  ) {
    score += 55;
  }


  if (
    snippet.includes(wanted)
  ) {
    score += 20;
  }


  if (
    /(band|zanger|zangeres|rapper|dj|muzikant|musicus|singer|musician|record producer|musical group|rock band|pop group)/
      .test(
        snippet
      )
  ) {
    score += 25;
  }


  return score;

}


async function findWikipediaArtist(
  artist
) {

  if (!artist) {
    return null;
  }


  const cacheKey =
    "artist:" +
    normalizeWikiText(
      artist
    );


  const cached =
    readWikiCache(
      cacheKey
    );


  if (
    cached !== undefined
  ) {
    return cached;
  }


  let best = null;


  for (
    const language
    of ["nl", "en"]
  ) {

    try {

      const results =
        await wikipediaSearch(
          language,
          `"${artist}"`
        );


      for (
        const result
        of results
      ) {

        const score =
          scoreWikipediaArtist(
            result,
            artist
          );


        if (
          !best ||
          score > best.score
        ) {

          best = {
            language,
            title:
              result.title,
            score
          };

        }

      }


      if (
        best &&
        best.score >= 100
      ) {

        break;

      }

    }

    catch {}

  }


  const match =
    best &&
    best.score >= 80
      ? {
          title:
            best.title,

          url:
            wikipediaUrl(
              best.language,
              best.title
            )
        }
      : null;


  writeWikiCache(
    cacheKey,
    match
  );


  return match;

}


function scoreWikipediaTrack(
  result,
  artist,
  track
) {

  const wantedArtist =
    normalizeWikiText(
      artist
    );


  const wantedTrack =
    normalizeWikiText(
      track
    );


  const title =
    normalizeWikiText(
      result.title
    );


  const titleBase =
    normalizeWikiText(
      stripParentheses(
        result.title
      )
    );


  const snippet =
    normalizeWikiText(
      stripHtml(
        result.snippet
      )
    );


  let score = 0;


  if (
    titleBase === wantedTrack
  ) {
    score += 70;
  }


  if (
    title.startsWith(
      wantedTrack + " "
    )
  ) {
    score += 50;
  }


  if (
    title.includes(
      wantedTrack
    )
  ) {
    score += 20;
  }


  if (
    wantedArtist &&
    title.includes(
      wantedArtist
    )
  ) {
    score += 35;
  }


  if (
    wantedArtist &&
    snippet.includes(
      wantedArtist
    )
  ) {
    score += 35;
  }


  if (
    /(single|nummer|lied|song|track|recording|opgenomen|uitgebracht|released)/
      .test(
        snippet
      )
  ) {
    score += 15;
  }


  return score;

}


async function findWikipediaTrack(
  artist,
  title
) {

  if (
    !artist ||
    !title
  ) {

    return null;

  }


  const cacheKey =
    "track:" +
    normalizeWikiText(
      artist
    ) +
    "|" +
    normalizeWikiText(
      title
    );


  const cached =
    readWikiCache(
      cacheKey
    );


  if (
    cached !== undefined
  ) {

    return cached;

  }


  let best = null;


  const searches = [

    {
      language: "nl",

      query:
        `"${title}" "${artist}" nummer`
    },

    {
      language: "en",

      query:
        `"${title}" "${artist}" song`
    }

  ];


  for (
    const search
    of searches
  ) {

    try {

      const results =
        await wikipediaSearch(
          search.language,
          search.query
        );


      for (
        const result
        of results
      ) {

        const score =
          scoreWikipediaTrack(
            result,
            artist,
            title
          );


        if (
          !best ||
          score > best.score
        ) {

          best = {
            language:
              search.language,

            title:
              result.title,

            score
          };

        }

      }


      if (
        best &&
        best.score >= 110
      ) {

        break;

      }

    }

    catch {}

  }


  const match =
    best &&
    best.score >= 90
      ? {
          title:
            best.title,

          url:
            wikipediaUrl(
              best.language,
              best.title
            )
        }
      : null;


  writeWikiCache(
    cacheKey,
    match
  );


  return match;

}


function applyWikipediaLink(
  element,
  result,
  label
) {

  if (!result) {

    return;

  }


  element.href =
    result.url;


  element.target =
    "_blank";


  element.rel =
    "noopener noreferrer";


  element.title =
    `${label} op Wikipedia: ${result.title}`;


  element.classList.add(
    "has-wiki"
  );

}


async function updateWikipediaLinks(
  artist,
  title
) {

  wikipediaGeneration++;


  const generation =
    wikipediaGeneration;


  if (
    !artist ||
    !title
  ) {

    return;

  }


  const expectedArtist =
    artist;


  const expectedTitle =
    title;


  const [
    artistResult,
    trackResult
  ] =
    await Promise.all([

      findWikipediaArtist(
        artist
      ),

      findWikipediaTrack(
        artist,
        title
      )

    ]);


  if (
    generation !==
      wikipediaGeneration ||
    currentTrack.artist !==
      expectedArtist ||
    currentTrack.title !==
      expectedTitle
  ) {

    return;

  }


  applyWikipediaLink(
    trackArtist,
    artistResult,
    artist
  );


  applyWikipediaLink(
    trackTitle,
    trackResult,
    `${artist} – ${title}`
  );

}

              sleepCustomInput
                .focus();


              sleepCustomInput
                .select();

            }


            return;

          }


          setSleepTimer(
            Number(
              button.dataset.minutes
            )
          );


          closeSleepMenu();

        }
      );

    }
  );


sleepCustomForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const minutes =
      Number(
        sleepCustomInput.value
      );


    const valid =
      Number.isInteger(
        minutes
      ) &&
      minutes >= 1 &&
      minutes <=
        MAX_SLEEP_MINUTES;


    sleepCustomError.hidden =
      valid;


    if (!valid) {

      sleepCustomInput.focus();

      return;

    }


    setSleepTimer(
      minutes
    );


    sleepCustomInput.value =
      "";


    closeSleepMenu();

  }
);


sleepCustomInput.addEventListener(
  "input",
  () => {

    sleepCustomError.hidden =
      true;

  }
);


document.addEventListener(
  "click",
  event => {

    if (
      !event.target.closest(
        ".sleep-wrap"
      )
    ) {

      closeSleepMenu();

    }

  }
);


function setSleepTimer(
  minutes
) {

  if (
    minutes === 0
  ) {

    sleepUntil =
      0;


    localStorage.removeItem(
      "radio-sleep-until"
    );


    updateSleepTimer();


    return;

  }


  if (
    !Number.isInteger(
      minutes
    ) ||
    minutes < 1 ||
    minutes >
      MAX_SLEEP_MINUTES
  ) {

    return;

  }


  sleepUntil =
    Date.now() +
    minutes *
    60000;


  localStorage.setItem(
    "radio-sleep-until",
    String(
      sleepUntil
    )
  );


  updateSleepTimer();

}


function updateSleepTimer() {

  if (!sleepUntil) {

    sleepButton
      .classList
      .remove(
        "active"
      );


    sleepText.textContent =
      "";


    return;

  }


  const remaining =
    sleepUntil -
    Date.now();


  if (
    remaining <= 0
  ) {

    sleepUntil =
      0;


    localStorage.removeItem(
      "radio-sleep-until"
    );


    sleepButton
      .classList
      .remove(
        "active"
      );


    sleepText.textContent =
      "";


    if (
      !audio.paused
    ) {

      pause(
        "Slaaptimer afgelopen"
      );

    }


    return;

  }


  const totalSeconds =
    Math.ceil(
      remaining /
      1000
    );


  const minutes =
    Math.floor(
      totalSeconds /
      60
    );


  const seconds =
    totalSeconds %
    60;


  sleepButton
    .classList
    .add(
      "active"
    );


  sleepText.textContent =
    `${minutes}:${
      String(
        seconds
      )
      .padStart(
        2,
        "0"
      )
    }`;

}


window.setInterval(
  updateSleepTimer,
  1000
);


/* =========================================================
   NEXT / PREVIOUS
   ========================================================= */

function moveStation(
  direction
) {

  const order =
    getVisibleDisplayOrder()
      .map(
        item =>
          item.index
      );


  if (
    !order.length
  ) {

    return;

  }


  const position =
    order.indexOf(
      currentIndex
    );


  let target;


  if (
    position < 0
  ) {

    target =
      direction > 0
        ? order[0]
        : order[
            order.length - 1
          ];

  }

  else {

    target =
      order[
        (
          position +
          direction +
          order.length
        ) %
        order.length
      ];

  }


  selectStation(
    target,
    isPlaybackActive()
  );

}


function nextStation() {

  moveStation(
    1
  );

}


function previousStation() {

  moveStation(
    -1
  );

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      document.activeElement
        .tagName ===
      "INPUT"
    ) {

      return;

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      togglePlay();

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      event.preventDefault();

      nextStation();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      event.preventDefault();

      previousStation();

    }


    if (
      event.key ===
      "Escape"
    ) {

      closeSleepMenu();

      closeRouteMenu();

    }

  }
);


/* =========================================================
   MEDIA SESSION
   ========================================================= */

function updateMediaSession() {

  if (
    !(
      "mediaSession"
      in navigator
    )
  ) {

    return;

  }


  const station =
    stations[
      currentIndex
    ];


  const metadata = {

    title:
      currentTrack.title ||
      station.name,

    artist:
      currentTrack.artist ||
      currentProgram ||
      "Live radio",

    album:
      station.name

  };


  const logo =
    getStationLogo(
      station
    );


  try {

    if (logo) {

      metadata.artwork = [
        {
          src:
            logo
        }
      ];

    }


    navigator
      .mediaSession
      .metadata =
      new MediaMetadata(
        metadata
      );

  }

  catch {

    delete metadata.artwork;


    navigator
      .mediaSession
      .metadata =
      new MediaMetadata(
        metadata
      );

  }

}


if (
  "mediaSession"
  in navigator
) {

  navigator
    .mediaSession
    .setActionHandler(
      "play",
      () =>
        play()
    );


  navigator
    .mediaSession
    .setActionHandler(
      "pause",
      () =>
        pause()
    );


  navigator
    .mediaSession
    .setActionHandler(
      "nexttrack",
      () =>
        nextStation()
    );


  navigator
    .mediaSession
    .setActionHandler(
      "previoustrack",
      () =>
        previousStation()
    );

}


/* =========================================================
   NETWORK
   ========================================================= */

window.addEventListener(
  "offline",
  () => {

    status.textContent =
      "Geen internetverbinding";

  }
);


window.addEventListener(
  "online",
  () => {

    status.textContent =
      audio.paused
        ? "Internetverbinding hersteld"
        : "Live";


    refreshMetadata();

    refreshProgram();


    if (
      playbackRequested &&
      audio.paused &&
      !isCasting()
    ) {

      reconnectAttempts =
        0;


      scheduleReconnect(
        "online",
        500
      );

    }

  }
);


/* =========================================================
   START
   ========================================================= */

function initialise() {

  document.body
    .classList
    .add(
      "awaiting-first-play"
    );


  const station =
    stations[
      currentIndex
    ];


  stationTitle.textContent =
    station.name;


  stationMark.textContent =
    station.mark;


  document.documentElement
    .style
    .setProperty(
      "--accent",
      station.accent
    );


  document.documentElement
    .style
    .setProperty(
      "--accent-rgb",
      station.rgb
    );


  audio.src =
    station.stream;


  preRollGuardPending =
    Boolean(
      station.preRollTrackGuardSeconds
    );


  updateVolumeBar();

  updateMuteUI();

  updateMainLogo();

  renderStations();

  updateBrowserIdentity();

  updateMediaSession();

  updateSleepTimer();

  initialiseAirPlay();


  if (
    window.__radioCastApiAvailable
  ) {

    initialiseCastApi();

  }


  refreshMetadata();

  refreshProgram();

}


initialise();

</script>


<script>
(() => {

  /*
   * =========================================================
   * COMPACTE STICKY MINIPLAYER
   * =========================================================
   *
   * Dit script haalt zelf GEEN metadata op.
   *
   * Het spiegelt uitsluitend informatie die
   * de bestaande hoofdplayer reeds in de DOM
   * heeft gezet.
   *
   * Daardoor hoeven refreshMetadata(),
   * refreshProgram(), setTrack(), providers,
   * stale checks en pre-roll-logica niet te
   * worden aangepast.
   */

  const largePlayer =
    document.querySelector(
      ".player"
    );


  const miniPlayer =
    document.getElementById(
      "miniPlayer"
    );


  const miniPlayerMain =
    document.getElementById(
      "miniPlayerMain"
    );


  const miniPlayerLogo =
    document.getElementById(
      "miniPlayerLogo"
    );


  const miniPlayerMark =
    document.getElementById(
      "miniPlayerMark"
    );


  const miniPlayerStation =
    document.getElementById(
      "miniPlayerStation"
    );


  const miniPlayerMeta =
    document.getElementById(
      "miniPlayerMeta"
    );


  const miniPrevious =
    document.getElementById(
      "miniPrevious"
    );


  const miniPlay =
    document.getElementById(
      "miniPlay"
    );


  const miniNext =
    document.getElementById(
      "miniNext"
    );


  const sourceStationTitle =
    document.getElementById(
      "stationTitle"
    );


  const sourceProgramTitle =
    document.getElementById(
      "programTitle"
    );


  const sourceTrackInfo =
    document.getElementById(
      "trackInfo"
    );


  const sourceTrackArtist =
    document.getElementById(
      "trackArtist"
    );


  const sourceTrackTitle =
    document.getElementById(
      "trackTitle"
    );


  const sourceMainLogo =
    document.getElementById(
      "mainStationLogo"
    );


  const sourceStationMark =
    document.getElementById(
      "stationMark"
    );


  if (
    !largePlayer ||
    !miniPlayer
  ) {

    return;

  }


  function textOf(
    element
  ) {

    return (
      element
        ?.textContent ||
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

  }


  function syncMiniLogo() {

    const src =
      sourceMainLogo
        ?.getAttribute(
          "src"
        ) ||
      "";


    const sourceLogoVisible =
      Boolean(
        src &&
        sourceMainLogo
          ?.style
          ?.display !==
          "none"
      );


    if (
      sourceLogoVisible
    ) {

      miniPlayerLogo.hidden =
        false;


      miniPlayerMark.hidden =
        true;


      if (
        miniPlayerLogo
          .getAttribute(
            "src"
          ) !==
        src
      ) {

        miniPlayerLogo.src =
          src;

      }


      return;

    }


    miniPlayerLogo.hidden =
      true;


    miniPlayerMark.hidden =
      false;


    miniPlayerMark.textContent =
      textOf(
        sourceStationMark
      );

  }


  function syncMiniPlayer() {

    miniPlayerStation.textContent =
      textOf(
        sourceStationTitle
      ) ||
      "radio.";


    let meta =
      "";


    /*
     * Gebruik alleen trackinformatie
     * wanneer de bestaande track-UI
     * deze daadwerkelijk toont.
     */

    if (
      sourceTrackInfo &&
      !sourceTrackInfo.hidden
    ) {

      const artist =
        textOf(
          sourceTrackArtist
        );


      const title =
        textOf(
          sourceTrackTitle
        );


      if (title) {

        meta =
          artist
            ? `${artist} · ${title}`
            : title;

      }

    }


    /*
     * Als de hoofdplayer geen track
     * toont, spiegel dan eventueel het
     * bestaande programma.
     */

    if (
      !meta &&
      sourceProgramTitle &&
      !sourceProgramTitle.hidden
    ) {

      meta =
        textOf(
          sourceProgramTitle
        );

    }


    miniPlayerMeta.textContent =
      meta ||
      "Live radio";


    syncMiniLogo();


    const playing =
      document.body
        .classList
        .contains(
          "is-playing"
        );


    miniPlay.setAttribute(
      "aria-label",
      playing
        ? "Pauzeren"
        : "Afspelen"
    );

  }


  miniPlayerLogo.addEventListener(
    "error",
    () => {

      miniPlayerLogo.hidden =
        true;


      miniPlayerMark.hidden =
        false;


      miniPlayerMark.textContent =
        textOf(
          sourceStationMark
        );

    }
  );


  /*
   * Klik op logo/tekst:
   * soepel terug naar de grote player.
   */

  miniPlayerMain.addEventListener(
    "click",
    () => {

      const reducedMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        )
        .matches;


      largePlayer.scrollIntoView({
        behavior:
          reducedMotion
            ? "auto"
            : "smooth",

        block:
          "start"
      });

    }
  );


  /*
   * Hergebruik de bestaande bediening.
   */

  miniPlay.addEventListener(
    "click",
    () => {

      togglePlay();

    }
  );


  miniPrevious.addEventListener(
    "click",
    () => {

      previousStation();

    }
  );


  miniNext.addEventListener(
    "click",
    () => {

      nextStation();

    }
  );


  /*
   * De miniplayer verschijnt pas zodra
   * de grote player volledig uit het
   * zicht is gescrold.
   */

  const playerObserver =
    new IntersectionObserver(
      entries => {

        const entry =
          entries[0];


        if (!entry) {

          return;

        }


        const largePlayerVisible =
          entry.isIntersecting;


        document.body
          .classList
          .toggle(
            "mini-player-visible",
            !largePlayerVisible
          );


        miniPlayer.setAttribute(
          "aria-hidden",
          largePlayerVisible
            ? "true"
            : "false"
        );


        miniPlayer.inert =
          largePlayerVisible;


        if (
          !largePlayerVisible
        ) {

          syncMiniPlayer();

        }

      },
      {
        threshold:
          .01
      }
    );


  playerObserver.observe(
    largePlayer
  );


  /*
   * MutationObserver kijkt uitsluitend
   * naar de reeds bestaande zichtbare
   * player-UI.
   *
   * Er worden geen metadatafuncties
   * aangeroepen.
   */

  const contentObserver =
    new MutationObserver(
      syncMiniPlayer
    );


  [
    sourceStationTitle,
    sourceProgramTitle,
    sourceTrackInfo,
    sourceTrackArtist,
    sourceTrackTitle,
    sourceMainLogo,
    sourceStationMark
  ]
  .filter(Boolean)
  .forEach(
    element => {

      contentObserver.observe(
        element,
        {
          attributes:
            true,

          childList:
            true,

          characterData:
            true,

          subtree:
            true
        }
      );

    }
  );


  /*
   * De bestaande player zet is-playing
   * op body. Door alleen die klasse te
   * observeren blijft play/pauze in de
   * miniplayer synchroon.
   */

  contentObserver.observe(
    document.body,
    {
      attributes:
        true,

      attributeFilter: [
        "class"
      ]
    }
  );


  syncMiniPlayer();

})();
</script>
