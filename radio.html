<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    id="themeColor"
    name="theme-color"
    content="#080a0f"
  >

  <link
    id="dynamicFavicon"
    rel="icon"
    href=""
  >

  <title>radio.</title>

  <script>
    (() => {
      try {
        const stored =
          localStorage.getItem(
            "radio-theme"
          );

        document.documentElement.dataset.theme =
          ["light", "dark"].includes(stored)
            ? stored
            : "system";
      }
      catch {
        document.documentElement.dataset.theme =
          "system";
      }
    })();
  </script>

  <style>
    :root {
      color-scheme: dark;

      --bg: #080a0f;
      --panel: rgba(255,255,255,.055);
      --panel-hover: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.09);

      --text: #f7f7f8;
      --muted: #9297a2;

      --accent: #e63946;
      --accent-rgb: 230,57,70;

      --logo-surface: #fff;

      --play-bg: #f7f7f8;
      --play-fg: #080a0f;

      --menu-bg: #171a21;

      --shadow:
        0 30px 80px rgba(0,0,0,.35);

      --radius-xl: 32px;
      --radius-lg: 22px;
    }


    :root[data-theme="light"] {
      color-scheme: light;

      --bg: #f3f5f8;

      --panel: rgba(255,255,255,.72);
      --panel-hover: rgba(255,255,255,.98);
      --border: rgba(15,18,24,.09);

      --text: #111318;
      --muted: #6f7581;

      --play-bg: #111318;
      --play-fg: #fff;

      --menu-bg: #fff;

      --shadow:
        0 26px 65px rgba(26,32,44,.13);
    }


    :root[data-theme="dark"] {
      color-scheme: dark;
    }


    @media (prefers-color-scheme: light) {
      :root[data-theme="system"] {
        color-scheme: light;

        --bg: #f3f5f8;

        --panel: rgba(255,255,255,.72);
        --panel-hover: rgba(255,255,255,.98);
        --border: rgba(15,18,24,.09);

        --text: #111318;
        --muted: #6f7581;

        --play-bg: #111318;
        --play-fg: #fff;

        --menu-bg: #fff;

        --shadow:
          0 26px 65px rgba(26,32,44,.13);
      }
    }


    * {
      box-sizing: border-box;
    }


    [hidden] {
      display: none !important;
    }


    html {
      -webkit-text-size-adjust: 100%;
    }


    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100svh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(var(--accent-rgb), .16),
          transparent 40%
        ),
        var(--bg);

      transition:
        background .45s ease,
        color .25s ease;
    }


    button,
    input {
      font: inherit;
    }


    button {
      color: inherit;
    }


    .app {
      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      min-height: 100svh;

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      padding:
        max(24px, env(safe-area-inset-top))
        0
        max(24px, env(safe-area-inset-bottom));
    }


    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom:
        clamp(30px, 6vh, 70px);
    }


    .brand {
      display: flex;
      align-items: center;

      gap: 11px;

      font-size: 20px;
      font-weight: 760;

      letter-spacing: -.04em;
    }


    .brand-dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 5px rgba(var(--accent-rgb), .12),
        0 0 28px rgba(var(--accent-rgb), .65);
    }


    .station-count {
      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }


    .header-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 14px;
    }


    .theme-switcher {
      position: relative;

      width: 92px;
      height: 32px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;

      padding: 2px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(128,128,128,.08);

      isolation: isolate;
    }


    .theme-slider-knob {
      position: absolute;

      top: 3px;
      left: 3px;

      z-index: 0;

      width: 26px;
      height: 26px;

      border-radius: 50%;

      background: var(--text);

      box-shadow:
        0 2px 8px rgba(0,0,0,.12);

      pointer-events: none;

      transform: translateX(0);

      transition:
        transform .22s ease,
        background .22s ease;
    }


    .theme-switcher[data-state="system"]
    .theme-slider-knob {
      transform: translateX(29px);
    }


    .theme-switcher[data-state="dark"]
    .theme-slider-knob {
      transform: translateX(58px);
    }


    .theme-option {
      appearance: none;

      position: relative;
      z-index: 1;

      width: 28px;
      height: 28px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 50%;

      color: var(--muted);
      background: transparent;

      cursor: pointer;

      opacity: .7;

      transition:
        color .18s ease,
        opacity .18s ease;
    }


    .theme-option svg {
      width: 16px;
      height: 16px;
    }


    .theme-option-system {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: -.03em;
    }


    .theme-option:hover {
      color: var(--text);
      opacity: 1;
    }


    .theme-option.active {
      color: var(--bg);
      opacity: 1;
    }


    main {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }


    .player {
      display: grid;

      grid-template-columns:
        minmax(200px, 285px)
        minmax(0, 1fr);

      gap:
        clamp(28px, 5vw, 64px);

      align-items: center;

      margin-bottom:
        clamp(34px, 6vh, 58px);
    }


    .artwork {
      position: relative;

      aspect-ratio: 1;

      display: grid;
      place-items: center;

      overflow: hidden;

      border-radius:
        var(--radius-xl);

      background:
        linear-gradient(
          145deg,
          rgba(var(--accent-rgb), .98),
          rgba(var(--accent-rgb), .42)
        );

      box-shadow:
        0 34px 80px rgba(var(--accent-rgb), .16),
        inset 0 1px 0 rgba(255,255,255,.2);
    }


    .artwork::before,
    .artwork::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,.14);

      pointer-events: none;
    }


    .artwork::before {
      width: 76%;
      height: 76%;
    }


    .artwork::after {
      width: 48%;
      height: 48%;
    }


    .main-logo-surface {
      position: relative;
      z-index: 2;

      width: 58%;
      aspect-ratio: 1;

      display: grid;
      place-items: center;

      padding: 11%;

      border-radius: 26%;

      background:
        var(--logo-surface);

      box-shadow:
        0 18px 45px rgba(0,0,0,.17),
        inset 0 0 0 1px rgba(0,0,0,.04);
    }


    .main-station-logo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      transition:
        opacity .2s ease,
        transform .25s ease;
    }


    .station-mark {
      display: none;

      color: #111318;

      font-size:
        clamp(42px, 6vw, 74px);

      font-weight: 850;

      line-height: 1;
      letter-spacing: -.075em;
    }


    .playing-indicator {
      position: absolute;

      right: 16px;
      bottom: 16px;

      z-index: 3;

      height: 32px;

      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 8px;

      border-radius: 999px;

      color: #fff;

      background:
        rgba(0,0,0,.36);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      font-size: 11px;
      font-weight: 750;

      letter-spacing: .08em;

      opacity: .72;
    }


    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #fff;
    }


    body.is-playing .live-dot {
      animation:
        pulse 1.5s infinite;
    }


    @keyframes pulse {
      50% {
        opacity: .25;
        transform: scale(.8);
      }
    }


    .player-info {
      min-width: 0;
    }


    h1 {
      margin: 0;

      max-width: 720px;

      font-size:
        clamp(40px, 6vw, 72px);

      font-weight: 790;

      line-height: .98;
      letter-spacing: -.065em;

      text-wrap: balance;
    }


    .program-title {
      width: fit-content;
      max-width: 100%;

      margin-top: 15px;

      color: var(--muted);

      font-size:
        clamp(14px, 1.7vw, 17px);

      font-weight: 620;

      line-height: 1.3;

      letter-spacing: -.015em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track {
      margin-top: 14px;
    }


    .track-artist,
    .track-title {
      display: block;

      width: fit-content;
      max-width: 100%;

      text-decoration: none;

      cursor: default;

      transition:
        color .16s ease,
        opacity .16s ease;
    }


    .track-artist {
      color: var(--text);

      font-size:
        clamp(16px, 2vw, 20px);

      font-weight: 650;

      letter-spacing: -.025em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track-title {
      margin-top: 4px;

      color: var(--muted);

      font-size:
        clamp(14px, 1.7vw, 17px);

      font-weight: 500;

      letter-spacing: -.015em;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .track.single .track-artist {
      display: none;
    }


    .track-link.has-wiki {
      cursor: pointer;

      text-decoration-line: underline;
      text-decoration-style: dotted;
      text-decoration-thickness: 1px;

      text-underline-offset: 4px;

      text-decoration-color:
        rgba(var(--accent-rgb), .6);
    }


    .track-link.has-wiki::after {
      content: " ↗";

      font-size: .68em;
      font-weight: 700;

      opacity: .48;

      vertical-align: .1em;
    }


    .track-link.has-wiki:hover {
      color: var(--accent);

      text-decoration-color:
        var(--accent);
    }


    .track-link.has-wiki:hover::after {
      opacity: .9;
    }


    .controls {
      display: flex;
      align-items: center;

      gap: 20px;

      margin-top: 27px;
    }


    .play-button {
      appearance: none;

      position: relative;

      width: 72px;
      height: 72px;

      flex: 0 0 72px;

      display: grid;
      place-items: center;

      padding: 0;

      overflow: hidden;

      border: 0;
      border-radius: 50%;

      background:
        var(--play-bg);

      color:
        var(--play-fg);

      cursor: pointer;

      isolation: isolate;

      box-shadow:
        var(--shadow);

      transition:
        transform .16s ease;
    }


    .play-button::after {
      content: "";

      position: absolute;

      top: -18%;
      bottom: -18%;
      left: -52%;

      z-index: 0;

      width: 42%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(var(--accent-rgb), .15),
          rgba(var(--accent-rgb), .58),
          rgba(255,255,255,.48),
          rgba(var(--accent-rgb), .34),
          transparent
        );

      opacity: 0;

      pointer-events: none;

      transform:
        translateX(-170%)
        rotate(14deg);
    }


    body.awaiting-first-play
    .play-button {
      animation:
        play-attention 4.8s ease-in-out infinite;
    }


    body.awaiting-first-play
    .play-button::after {
      animation:
        play-sweep 4.8s
        cubic-bezier(.4,0,.2,1)
        infinite;
    }


    @keyframes play-attention {
      0%,
      54%,
      100% {
        box-shadow:
          var(--shadow);
      }

      63% {
        box-shadow:
          var(--shadow),
          0 0 0 2px rgba(var(--accent-rgb), .13),
          0 0 24px rgba(var(--accent-rgb), .18);
      }

      79% {
        box-shadow:
          var(--shadow),
          0 0 0 5px rgba(var(--accent-rgb), .05);
      }
    }


    @keyframes play-sweep {
      0%,
      55% {
        opacity: 0;

        transform:
          translateX(-170%)
          rotate(14deg);
      }

      60% {
        opacity: .9;
      }

      76% {
        opacity: .95;

        transform:
          translateX(430%)
          rotate(14deg);
      }

      77%,
      100% {
        opacity: 0;

        transform:
          translateX(430%)
          rotate(14deg);
      }
    }


    .play-button:hover {
      transform: scale(1.055);
    }


    .play-button:active {
      transform: scale(.96);
    }


    .play-button svg {
      position: relative;
      z-index: 1;

      width: 27px;
      height: 27px;
    }


    .play-icon {
      margin-left: 4px;
    }


    body.is-playing .play-icon {
      display: none;
    }


    .pause-icon {
      display: none;
    }


    body.is-playing .pause-icon {
      display: block;
    }


    .secondary-controls {
      width:
        min(310px, 100%);
    }


    .status {
      margin-bottom: 12px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 550;
    }


    .status:empty {
      display: none;
    }


    .control-row {
      display: flex;
      align-items: center;

      gap: 10px;
    }


    .icon-button {
      appearance: none;

      width: 38px;
      height: 38px;

      flex: 0 0 38px;

      display: grid;
      place-items: center;

      padding: 0;

      border:
        1px solid transparent;

      border-radius: 12px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;
    }


    .icon-button:hover {
      color: var(--text);

      background:
        var(--panel-hover);
    }


    .icon-button svg {
      width: 19px;
      height: 19px;
    }


    .route-wrap {
      position: relative;

      width: 38px;
      height: 38px;

      flex: 0 0 38px;
    }


    .route-button.active {
      color: var(--accent);

      border-color:
        rgba(var(--accent-rgb), .28);

      background:
        rgba(var(--accent-rgb), .10);
    }


    .route-menu {
      position: absolute;

      right: 0;
      bottom: calc(100% + 10px);

      z-index: 30;

      width: 206px;

      padding: 7px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      background:
        var(--menu-bg);

      box-shadow:
        0 20px 55px rgba(0,0,0,.22);
    }


    .route-menu-title {
      padding: 7px 9px 6px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: .02em;
    }


    .route-option {
      appearance: none;

      width: 100%;

      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) 8px;
      align-items: center;

      gap: 9px;

      padding: 9px;

      border: 0;
      border-radius: 11px;

      background: transparent;

      color: var(--text);

      text-align: left;

      cursor: pointer;
    }


    .route-option:hover {
      background:
        var(--panel-hover);
    }


    .route-option-icon {
      width: 32px;
      height: 32px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      color: var(--muted);

      background:
        var(--panel);
    }


    .route-option-icon svg {
      width: 18px;
      height: 18px;
    }


    .route-option-copy {
      min-width: 0;
    }


    .route-option-name {
      display: block;

      font-size: 13px;
      font-weight: 700;

      line-height: 1.2;
    }


    .route-option-subtitle {
      display: block;

      margin-top: 2px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 550;

      line-height: 1.2;
    }


    .route-option-state {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: transparent;
    }


    .route-option.active
    .route-option-state {
      background: var(--accent);

      box-shadow:
        0 0 0 4px rgba(var(--accent-rgb), .10);
    }


    .mute-button.muted {
      color: #fff;

      background: #e5484d;

      border-color: #e5484d;

      box-shadow:
        0 0 0 4px rgba(229,72,77,.20),
        0 8px 22px rgba(229,72,77,.22);
    }


    .volume-on-icon {
      display: block;
    }


    .volume-off-icon {
      display: none;
    }


    .mute-button.muted .volume-on-icon {
      display: none;
    }


    .mute-button.muted .volume-off-icon {
      display: block;
    }


    .volume-slider {
      flex: 1;

      min-width: 50px;
    }


    input[type="range"] {
      width: 100%;

      appearance: none;
      -webkit-appearance: none;

      height: 4px;

      border-radius: 999px;

      background:
        linear-gradient(
          to right,
          var(--text) 0,
          var(--text) var(--volume),
          rgba(128,128,128,.23) var(--volume),
          rgba(128,128,128,.23) 100%
        );

      cursor: pointer;
    }


    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background:
        var(--text);
    }


    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;

      border: 0;
      border-radius: 50%;

      background:
        var(--text);
    }


    .sleep-wrap {
      position: relative;
    }


    .sleep-button {
      width: auto;

      min-width: 38px;

      padding: 0 10px;

      gap: 6px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .sleep-button.active {
      color: var(--accent);

      border-color:
        rgba(var(--accent-rgb), .28);

      background:
        rgba(var(--accent-rgb), .10);
    }


    .sleep-text {
      display: none;

      font-size: 11px;
      font-weight: 750;
    }


    .sleep-button.active .sleep-text {
      display: block;
    }


    .sleep-menu {
      position: absolute;

      right: 0;
      bottom:
        calc(100% + 10px);

      z-index: 20;

      width: 190px;

      padding: 6px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      background:
        var(--menu-bg);

      box-shadow:
        0 20px 55px rgba(0,0,0,.20);
    }


    .sleep-option {
      appearance: none;

      width: 100%;

      padding: 10px 11px;

      border: 0;
      border-radius: 10px;

      background: transparent;

      text-align: left;

      cursor: pointer;
    }


    .sleep-option:hover {
      background:
        var(--panel-hover);
    }


    .sleep-custom {
      margin-top: 4px;
      padding: 8px 6px 6px;

      border-top:
        1px solid var(--border);
    }


    .sleep-custom-row {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr) auto;

      gap: 6px;
    }


    .sleep-custom-input {
      width: 100%;
      min-width: 0;

      padding: 9px 10px;

      border:
        1px solid var(--border);
      border-radius: 9px;

      color: var(--text);
      background:
        rgba(128,128,128,.08);

      outline: none;
    }


    .sleep-custom-input:focus {
      border-color:
        rgba(var(--accent-rgb), .42);

      box-shadow:
        0 0 0 3px rgba(var(--accent-rgb), .08);
    }


    .sleep-custom-submit {
      appearance: none;

      padding: 0 10px;

      border:
        1px solid var(--border);
      border-radius: 9px;

      color: var(--text);
      background:
        var(--panel);

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }


    .sleep-custom-submit:hover {
      background:
        var(--panel-hover);
    }


    .sleep-custom-error {
      margin-top: 6px;

      color: var(--accent);

      font-size: 10px;
      font-weight: 650;

      line-height: 1.3;
    }


    .station-groups {
      display: grid;

      gap: 14px;
    }


    .country-group {
      min-width: 0;
    }


    .country-header {
      display: flex;
      align-items: center;

      min-height: 52px;

      margin-bottom: 12px;

      padding:
        5px 8px
        5px 13px;

      border:
        1px solid var(--border);

      border-radius: 17px;

      background:
        var(--panel);
    }


    .country-toggle {
      appearance: none;

      min-width: 0;
      flex: 1;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 7px 5px;

      border: 0;

      background: transparent;

      text-align: left;

      cursor: pointer;
    }


    .country-flag {
      flex: 0 0 auto;

      font-size: 21px;

      line-height: 1;
    }


    .country-title {
      min-width: 0;

      overflow: hidden;

      font-size: 15px;
      font-weight: 760;

      letter-spacing: -.025em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .country-count {
      margin-left: auto;

      padding-left: 12px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 600;

      white-space: nowrap;
    }


    .country-chevron {
      width: 34px;
      height: 34px;

      flex: 0 0 34px;

      display: grid;
      place-items: center;

      color: var(--muted);

      font-size: 22px;
      line-height: 1;

      transition:
        transform .2s ease;
    }


    .country-group.collapsed
    .country-chevron {
      transform:
        rotate(-90deg);
    }


    .country-favorite {
      appearance: none;

      width: 36px;
      height: 36px;

      flex: 0 0 36px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 11px;

      background: transparent;

      color: var(--muted);

      font-size: 19px;

      cursor: pointer;

      opacity: .6;
    }


    .country-favorite:hover,
    .country-favorite.active {
      color: var(--accent);

      background:
        rgba(var(--accent-rgb), .08);

      opacity: 1;
    }


    .country-stations {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(170px, 1fr)
        );

      gap: 12px;
    }


    .station {
      position: relative;

      min-width: 0;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-lg);

      background:
        var(--panel);

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }


    .station:hover {
      background:
        var(--panel-hover);

      transform:
        translateY(-2px);
    }


    .station.active {
      border-color:
        rgba(var(--accent-rgb), .52);

      background:
        rgba(var(--accent-rgb), .11);
    }


    .station-select {
      appearance: none;

      width: 100%;

      min-height: 112px;

      padding: 17px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;

      border: 0;

      background: transparent;

      text-align: left;

      cursor: pointer;
    }


    .station-logo-wrap {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      padding: 5px;

      overflow: hidden;

      border-radius: 12px;

      background: #fff;

      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.05);
    }


    .station-logo {
      width: 100%;
      height: 100%;

      max-width: 100%;
      max-height: 100%;

      display: block;

      object-fit: contain;
    }


    .station[data-station-id="qmusic"]
    .station-logo,

    .station[data-station-id="qmusicbe"]
    .station-logo {
      width: 78%;
      height: 78%;
    }


    .station-logo-fallback {
      display: none;

      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;

      color: #111318;

      font-size: 10px;
      font-weight: 850;
    }


    .station-name {
      width: 100%;

      margin-top: 18px;

      padding-right: 20px;

      overflow: hidden;

      font-size: 14px;
      font-weight: 680;

      letter-spacing: -.025em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .favorite-button {
      appearance: none;

      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 5;

      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 10px;

      background: transparent;

      color: var(--muted);

      font-size: 18px;

      cursor: pointer;

      opacity: .48;
    }


    .favorite-button:hover,
    .favorite-button.active {
      color: var(--accent);

      opacity: 1;
    }


    /* =========================================================
       COMPACTE STICKY MINIPLAYER
       ========================================================= */

    .mini-player {
      position: fixed;

      left: 50%;
      bottom:
        max(
          14px,
          env(safe-area-inset-bottom)
        );

      z-index: 100;

      width:
        min(
          680px,
          calc(100% - 28px)
        );

      opacity: 0;

      pointer-events: none;

      transform:
        translate(
          -50%,
          calc(100% + 34px)
        )
        scale(.985);

      transition:
        opacity .22s ease,
        transform .28s
          cubic-bezier(.2,.8,.2,1);
    }


    body.mini-player-visible
    .mini-player {
      opacity: 1;

      pointer-events: auto;

      transform:
        translate(-50%, 0)
        scale(1);
    }


    body.mini-player-visible
    .station-groups {
      padding-bottom: 92px;
    }


    .mini-player-inner {
      position: relative;

      min-height: 66px;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 9px 10px;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 21px;

      background:
        var(--menu-bg);

      box-shadow:
        0 20px 65px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.06);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);
    }


    .mini-player-inner::before {
      content: "";

      position: absolute;

      top: 10px;
      bottom: 10px;
      left: 0;

      width: 3px;

      border-radius:
        0 999px 999px 0;

      background:
        var(--accent);

      box-shadow:
        0 0 16px rgba(var(--accent-rgb), .38);
    }


    .mini-player-main {
      appearance: none;

      min-width: 0;
      flex: 1;

      display: flex;
      align-items: center;

      gap: 11px;

      padding: 0;

      border: 0;

      color: inherit;
      background: transparent;

      text-align: left;

      cursor: pointer;
    }


    .mini-player-logo-surface {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      display: grid;
      place-items: center;

      padding: 7px;

      overflow: hidden;

      border-radius: 13px;

      background:
        var(--logo-surface);

      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.05);
    }


    .mini-player-logo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
    }


    .mini-player-mark {
      display: grid;
      place-items: center;

      width: 100%;
      height: 100%;

      color: #111318;

      font-size: 11px;
      font-weight: 850;

      letter-spacing: -.04em;
    }


    .mini-player-copy {
      min-width: 0;

      display: block;

      flex: 1;
    }


    .mini-player-station,
    .mini-player-meta {
      display: block;

      overflow: hidden;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .mini-player-station {
      color: var(--text);

      font-size: 13px;
      font-weight: 760;

      line-height: 1.25;
      letter-spacing: -.02em;
    }


    .mini-player-meta {
      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 560;

      line-height: 1.25;
    }


    .mini-player-controls {
      flex: 0 0 auto;

      display: flex;
      align-items: center;

      gap: 4px;
    }


    .mini-control {
      appearance: none;

      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 12px;

      color: var(--muted);
      background: transparent;

      cursor: pointer;

      transition:
        color .16s ease,
        background .16s ease,
        transform .16s ease;
    }


    .mini-control:hover {
      color: var(--text);

      background:
        var(--panel-hover);
    }


    .mini-control:active {
      transform:
        scale(.94);
    }


    .mini-control svg {
      width: 18px;
      height: 18px;
    }


    .mini-play-button {
      width: 44px;
      height: 44px;

      border-radius: 50%;

      color:
        var(--play-fg);

      background:
        var(--play-bg);

      box-shadow:
        0 8px 24px rgba(0,0,0,.16);
    }


    .mini-play-button:hover {
      color:
        var(--play-fg);

      background:
        var(--play-bg);

      transform:
        scale(1.045);
    }


    .mini-pause-icon {
      display: none;
    }


    body.is-playing
    .mini-play-icon {
      display: none;
    }


    body.is-playing
    .mini-pause-icon {
      display: block;
    }


    footer {
      display: flex;
      justify-content: center;

      margin-top: 28px;

      color: var(--muted);

      opacity: .64;

      font-size: 11px;
    }


    :focus-visible {
      outline:
        2px solid var(--text);

      outline-offset: 4px;
    }


    @media (max-width: 760px) {

      .app {
        width:
          min(
            100% - 24px,
            620px
          );
      }


      header {
        margin-bottom: 32px;
      }


      .player {
        grid-template-columns: 1fr;

        gap: 22px;

        margin-bottom: 32px;
      }


      .artwork {
        width:
          min(50vw, 220px);

        justify-self: center;
      }


      .player-info {
        text-align: center;
      }


      h1 {
        margin-inline: auto;

        font-size:
          clamp(40px, 12vw, 60px);
      }


      .program-title,
      .track-artist,
      .track-title {
        margin-left: auto;
        margin-right: auto;
      }


      .controls {
        justify-content: center;
      }


      .secondary-controls {
        width:
          min(300px, 100%);

        text-align: left;
      }


      .country-stations {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }


      footer {
        display: none;
      }
    }


    @media (max-width: 520px) {

      .mini-player {
        bottom:
          max(
            8px,
            env(safe-area-inset-bottom)
          );

        width:
          calc(100% - 16px);
      }


      .mini-player-inner {
        min-height: 60px;

        gap: 8px;

        padding: 7px 8px;

        border-radius: 18px;
      }


      .mini-player-logo-surface {
        width: 42px;
        height: 42px;

        flex-basis: 42px;

        padding: 6px;

        border-radius: 12px;
      }


      .mini-player-station {
        font-size: 12px;
      }


      .mini-player-meta {
        margin-top: 3px;

        font-size: 10px;
      }


      .mini-previous,
      .mini-next {
        display: none;
      }


      .mini-play-button {
        width: 42px;
        height: 42px;
      }


      body.mini-player-visible
      .station-groups {
        padding-bottom: 82px;
      }

    }


    @media (max-width: 420px) {

      .app {
        width:
          calc(100% - 20px);
      }


      .station-count {
        display: none;
      }


      .artwork {
        width:
          min(46vw, 180px);

        border-radius: 26px;
      }


      .controls {
        flex-direction: column;

        gap: 18px;
      }


      .secondary-controls {
        width:
          min(290px, 92%);
      }


      .station-select {
        min-height: 97px;

        padding: 14px;
      }


      .station-logo-wrap {
        width: 38px;
        height: 38px;
      }


      .country-header {
        min-height: 48px;

        padding-left: 9px;
      }


      .country-flag {
        font-size: 20px;
      }


      .country-count {
        display: none;
      }
    }


    @media (prefers-reduced-motion: reduce) {

      * {
        transition-duration:
          .01ms !important;

        animation-duration:
          .01ms !important;
      }


      body.awaiting-first-play
      .play-button,
      body.awaiting-first-play
      .play-button::after {
        animation: none;
      }
    }
  </style>
</head>


<body>

<div class="app">

  <header>

    <div class="brand">
      <span class="brand-dot"></span>
      radio.
    </div>

    <div class="header-tools">

      <div
        id="stationCount"
        class="station-count"
      ></div>

      <div
        id="themeSwitcher"
        class="theme-switcher"
        role="group"
        aria-label="Weergavemodus"
        data-state="system"
      >

        <span
          class="theme-slider-knob"
          aria-hidden="true"
        ></span>

        <button
          class="theme-option"
          type="button"
          data-theme-choice="light"
          aria-label="Lichte modus"
          title="Licht"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M12 2.5v2M12 19.5v2M4.3 4.3l1.4 1.4M18.3 18.3l1.4 1.4M2.5 12h2M19.5 12h2M4.3 19.7l1.4-1.4M18.3 5.7l1.4-1.4"/>
          </svg>
        </button>

        <button
          class="theme-option theme-option-system"
          type="button"
          data-theme-choice="system"
          aria-label="Systeeminstelling volgen"
          title="Systeem"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3.5" y="5" width="17" height="11" rx="2"/>
            <path d="M9 20h6M12 16v4"/>
          </svg>
        </button>

        <button
          class="theme-option"
          type="button"
          data-theme-choice="dark"
          aria-label="Donkere modus"
          title="Donker"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 15.1A8.3 8.3 0 0 1 8.9 4a8.5 8.5 0 1 0 11.1 11.1Z"/>
          </svg>
        </button>

      </div>

    </div>

  </header>


  <main>

    <section class="player">

      <div class="artwork">

        <div class="main-logo-surface">

          <img
            id="mainStationLogo"
            class="main-station-logo"
            alt=""
          >

          <div
            id="stationMark"
            class="station-mark"
          ></div>

        </div>


        <div class="playing-indicator">

          <span class="live-dot"></span>

          LIVE

        </div>

      </div>


      <div class="player-info">

        <h1 id="stationTitle"></h1>


        <div
          id="programTitle"
          class="program-title"
          hidden
        ></div>


        <div
          id="trackInfo"
          class="track"
          aria-live="polite"
          hidden
        >

          <a
            id="trackArtist"
            class="track-artist track-link"
          ></a>

          <a
            id="trackTitle"
            class="track-title track-link"
          ></a>

        </div>


        <div class="controls">

          <button
            id="playButton"
            class="play-button"
            type="button"
            aria-label="Afspelen"
          >

            <svg
              class="play-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M8 5v14l11-7z"/>
            </svg>

            <svg
              class="pause-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M7 5h4v14H7zm6 0h4v14h-4z"/>
            </svg>

          </button>


          <div class="secondary-controls">

            <div
              id="status"
              class="status"
            ></div>


            <div class="control-row">

              <button
                id="muteButton"
                class="icon-button mute-button"
                type="button"
                aria-label="Geluid dempen"
              >

                <svg
                  class="volume-on-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M11 5 6 9H2v6h4l5 4z"/>
                  <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                  <path d="M18 6a8 8 0 0 1 0 12"/>
                </svg>


                <svg
                  class="volume-off-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M11 5 6 9H2v6h4l5 4z"/>
                  <path d="m16 9 5 5"/>
                  <path d="m21 9-5 5"/>
                </svg>

              </button>


              <div class="volume-slider">

                <input
                  id="volume"
                  type="range"
                  min="0"
                  max="1"
                  step=".01"
                  value=".75"
                  aria-label="Volume"
                  style="--volume:75%"
                >

              </div>


              <div
                id="routeWrap"
                class="route-wrap"
                hidden
              >

                <button
                  id="routeButton"
                  class="icon-button route-button"
                  type="button"
                  aria-label="Afspelen op"
                  title="Afspelen op"
                  aria-expanded="false"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M4 18.5a1.5 1.5 0 0 1 1.5 1.5"/>
                    <path d="M4 14a6 6 0 0 1 6 6"/>
                    <path d="M4 9.5A10.5 10.5 0 0 1 14.5 20"/>
                    <rect x="9" y="4" width="11" height="8" rx="2"/>
                  </svg>
                </button>


                <div
                  id="routeMenu"
                  class="route-menu"
                  hidden
                >

                  <div
                    class="route-menu-title"
                  >
                    Afspelen op
                  </div>


                  <button
                    id="airPlayRouteOption"
                    class="route-option"
                    type="button"
                    hidden
                  >

                    <span
                      class="route-option-icon"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <rect x="4" y="3.5" width="16" height="11" rx="2"/>
                        <path d="m12 14.5-5 6h10z"/>
                      </svg>
                    </span>

                    <span
                      class="route-option-copy"
                    >
                      <span
                        class="route-option-name"
                      >
                        AirPlay
                      </span>

                      <span
                        class="route-option-subtitle"
                      >
                        Apple-apparaten
                      </span>
                    </span>

                    <span
                      class="route-option-state"
                      aria-hidden="true"
                    ></span>

                  </button>


                  <button
                    id="castRouteOption"
                    class="route-option"
                    type="button"
                    hidden
                  >

                    <span
                      class="route-option-icon"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="M4 18.5a1.5 1.5 0 0 1 1.5 1.5"/>
                        <path d="M4 14a6 6 0 0 1 6 6"/>
                        <path d="M4 9.5A10.5 10.5 0 0 1 14.5 20"/>
                        <path d="M9 4h9a2 2 0 0 1 2 2v8"/>
                      </svg>
                    </span>

                    <span
                      class="route-option-copy"
                    >
                      <span
                        class="route-option-name"
                      >
                        Chromecast
                      </span>

                      <span
                        class="route-option-subtitle"
                      >
                        Google-apparaten
                      </span>
                    </span>

                    <span
                      class="route-option-state"
                      aria-hidden="true"
                    ></span>

                  </button>

                </div>

              </div>


              <div class="sleep-wrap">

                <button
                  id="sleepButton"
                  class="icon-button sleep-button"
                  type="button"
                  aria-label="Slaaptimer"
                  aria-expanded="false"
                >

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="8"/>
                    <path d="M12 8v4l2.5 2"/>
                  </svg>

                  <span
                    id="sleepText"
                    class="sleep-text"
                  ></span>

                </button>


                <div
                  id="sleepMenu"
                  class="sleep-menu"
                  hidden
                >

                  <button
                    class="sleep-option"
                    data-minutes="15"
                  >
                    15 minuten
                  </button>

                  <button
                    class="sleep-option"
                    data-minutes="30"
                  >
                    30 minuten
                  </button>

                  <button
                    class="sleep-option"
                    data-minutes="60"
                  >
                    60 minuten
                  </button>

                  <button
                    class="sleep-option"
                    data-custom="true"
                  >
                    Aangepast…
                  </button>


                  <div
                    id="sleepCustomWrap"
                    class="sleep-custom"
                    hidden
                  >
                    <form
                      id="sleepCustomForm"
                      novalidate
                    >
                      <div class="sleep-custom-row">
                        <input
                          id="sleepCustomInput"
                          class="sleep-custom-input"
                          type="number"
                          min="1"
                          max="720"
                          step="1"
                          inputmode="numeric"
                          autocomplete="off"
                          placeholder="1–720 min"
                          aria-label="Aangepaste slaaptimer in minuten"
                        >

                        <button
                          class="sleep-custom-submit"
                          type="submit"
                        >
                          Start
                        </button>
                      </div>

                      <div
                        id="sleepCustomError"
                        class="sleep-custom-error"
                        role="alert"
                        hidden
                      >
                        Vul 1–720 minuten in.
                      </div>
                    </form>
                  </div>


                  <button
                    class="sleep-option"
                    data-minutes="0"
                  >
                    Timer uit
                  </button>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </section>


    <section
      id="stations"
      class="station-groups"
      aria-label="Radiostations"
    ></section>

  </main>


  <footer>
    Spatie: play/pauze · ← →: zender wisselen
  </footer>

</div>


<div
  id="miniPlayer"
  class="mini-player"
  role="region"
  aria-label="Miniplayer"
  aria-hidden="true"
  inert
>
  <div class="mini-player-inner">

    <button
      id="miniPlayerMain"
      class="mini-player-main"
      type="button"
      aria-label="Terug naar grote player"

    );

}
catch {

  wikiCache = {};

}


function readWikiCache(
  key
) {

  const item =
    wikiCache[key];


  if (!item) {
    return undefined;
  }


  if (
    item.expires <
    Date.now()
  ) {

    delete wikiCache[key];

    return undefined;
  }


  return item.result || null;

}


function writeWikiCache(
  key,
  result
) {

  wikiCache[key] = {

    expires:
      Date.now() +
      WIKI_CACHE_TTL,

    result:
      result || null

  };


  const entries =
    Object.entries(
      wikiCache
    );


  if (
    entries.length > 200
  ) {

    entries
      .sort(
        (a, b) =>
          a[1].expires -
          b[1].expires
      )
      .slice(
        0,
        entries.length - 200
      )
      .forEach(
        ([key]) =>
          delete wikiCache[key]
      );

  }


  try {

    localStorage.setItem(
      WIKI_CACHE_KEY,
      JSON.stringify(
        wikiCache
      )
    );

  }
  catch {}

}


/* =========================================================
   TEXT HELPERS
   ========================================================= */

function cleanText(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  const text =
    String(value)
      .replace(
        /[\u0000-\u001f\u007f]/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if (
    !text ||
    text.length > 250
  ) {
    return "";
  }


  const invalid = [

    /^\[?unknown\]?$/i,
    /^undefined$/i,
    /^null$/i,

    /^no metadata/i,
    /^no information/i,

    /^metadata unavailable$/i,

    /^not available$/i,
    /^unavailable$/i,

    /^sin información$/i,
    /^sin informacion$/i,
    /^sin datos$/i,

    /^sem informação$/i,
    /^sem informacao$/i,

    /^offline$/i

  ];


  if (
    invalid.some(
      regex =>
        regex.test(text)
    )
  ) {
    return "";
  }


  return text;

}


function documentLines(
  doc
) {

  const raw =
    doc.body?.innerText ||
    doc.body?.textContent ||
    "";


  return raw
    .split(/\r?\n/)
    .map(cleanText)
    .filter(Boolean);

}


function documentHeadings(
  doc,
  selector =
    "h1,h2,h3,h4,h5,h6"
) {

  return [
    ...doc.querySelectorAll(
      selector
    )
  ]
  .map(
    element =>
      cleanText(
        element.textContent
      )
  )
  .filter(Boolean);

}


/* =========================================================
   FETCH
   ========================================================= */

async function fetchTextWithTimeout(
  url,
  timeout =
    REQUEST_TIMEOUT
) {

  const controller =
    new AbortController();


  const timer =
    window.setTimeout(
      () =>
        controller.abort(),
      timeout
    );


  try {

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    return await response.text();

  }

  finally {

    clearTimeout(
      timer
    );

  }

}


async function fetchTextDirect(
  url
) {

  return await fetchTextWithTimeout(
    url,
    REQUEST_TIMEOUT
  );

}


async function fetchTextSmart(
  url,
  cacheBust = false
) {

  let target =
    url;


  if (
    cacheBust
  ) {

    target +=
      (
        target.includes("?")
          ? "&"
          : "?"
      ) +
      "_radio=" +
      Math.floor(
        Date.now() /
        15000
      );

  }


  return await fetchTextWithTimeout(
    target,
    REQUEST_TIMEOUT
  );

}


async function fetchJsonSmart(
  url
) {

  return JSON.parse(
    await fetchTextSmart(
      url,
      true
    )
  );

}


async function fetchJsonPost(
  url,
  payload,
  headers = {}
) {

  const controller =
    new AbortController();


  const timer =
    window.setTimeout(
      () =>
        controller.abort(),
      REQUEST_TIMEOUT
    );


  try {

    const response =
      await fetch(
        url,
        {
          method:
            "POST",

          signal:
            controller.signal,

          cache:
            "no-store",

          headers: {
            "Accept":
              "application/json",

            "Content-Type":
              "application/json",

            ...headers
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    return await response.json();

  }

  finally {

    clearTimeout(
      timer
    );

  }

}


async function fetchDocument(
  url
) {

  const html =
    await fetchTextSmart(
      url,
      true
    );


  return new DOMParser()
    .parseFromString(
      html,
      "text/html"
    );

}

function isCasting() {

}


function isPlaybackActive() {

  if (
    isCasting()
  ) {

function updatePlaybackUiFromCast() {

}


function createCastMediaInfo() {

  const station =
    stations[currentIndex];


  const mediaInfo =
    new chrome.cast.media.MediaInfo(
      station.stream,
      "audio/mpeg"
    );


  mediaInfo.streamType =
    chrome.cast.media.StreamType.LIVE;


  const metadata =
    new chrome.cast.media.MusicTrackMediaMetadata();


  metadata.title =
    currentTrack.title ||
    station.name;


  metadata.songName =
    currentTrack.title ||
    station.name;


  metadata.artist =
    currentTrack.artist ||
    currentProgram ||
    "Live radio";


  metadata.albumName =
    station.name;


  const logo =
    getStationLogo(
      station
    );


  if (
    logo &&
    window.chrome?.cast?.Image
  ) {

    metadata.images = [
      new chrome.cast.Image(
        logo
      )
    ];

  }


  mediaInfo.metadata =
    metadata;


  return mediaInfo;

}


async function loadCurrentStationOnCast(
  autoplay = true
) {

  if (
    !isCasting()
  ) {

    return false;

  }


  const context =
    cast.framework.CastContext
      .getInstance();


  const session =
    context.getCurrentSession();


  if (!session) {

    return false;

  }


  const station =
    stations[currentIndex];


  const mediaInfo =
    createCastMediaInfo();


  const request =
    new chrome.cast.media.LoadRequest(
      mediaInfo
    );


  request.autoplay =
    Boolean(autoplay);


  status.textContent =
    "Cast · Verbinden…";


  try {

    await session.loadMedia(
      request
    );


    castLoadedStationId =
      station.id;


    playbackRequested =
      Boolean(autoplay);


    updatePlaybackUiFromCast();


    return true;

  }

  catch {

    status.textContent =
      "Cast kon stream niet starten";


    return false;

  }

}


function updateCastAvailability(
  castState
) {

  if (
    !castApiReady
  ) {

    castAvailable =
      false;


    updateRouteUi();


    return;

  }


  const state =
    castState ||
    cast.framework.CastContext
      .getInstance()
      .getCastState();


  castAvailable =
    state !==
    cast.framework.CastState
      .NO_DEVICES_AVAILABLE;


  updateRouteUi();

}


async function requestCastSession() {

  if (
    !castApiReady ||
    !castAvailable
  ) {

    return;

  }


  closeRouteMenu();


  try {

    await cast.framework.CastContext
      .getInstance()
      .requestSession();

  }

  catch {}

}


castRouteOption.addEventListener(
  "click",
  requestCastSession
);


function handleCastSessionStateChange(
  event
) {

  const state =
    event.sessionState;


  if (
    state ===
      cast.framework.SessionState.SESSION_STARTED
  ) {

    const shouldPlay =
      playbackRequested ||
      !audio.paused;


    audio.pause();


    loadCurrentStationOnCast(
      shouldPlay
    );


    updateRouteUi();


    return;

  }


  if (
    state ===
      cast.framework.SessionState.SESSION_RESUMED
  ) {

    audio.pause();


    window.setTimeout(
      () => {

        const remoteStream =
          castPlayer
            ?.mediaInfo
            ?.contentId ||
          "";


        const remoteStation =
          stations.find(
            station =>
              station.stream ===
              remoteStream
          );


        if (remoteStation) {

          castLoadedStationId =
            remoteStation.id;

        }


        playbackRequested =
          Boolean(
            castPlayer
              ?.isMediaLoaded &&
            !castPlayer
              ?.isPaused
          );


        updatePlaybackUiFromCast();

      },
      0
    );


    return;

  }


  if (
    state ===
      cast.framework.SessionState.SESSION_ENDED
  ) {

    castLoadedStationId =
      "";


    playbackRequested =
      false;


    document.body
      .classList
      .remove(
        "is-playing"
      );


    playButton.setAttribute(
      "aria-label",
      "Afspelen"
    );


    status.textContent =
      "Cast verbroken";


    updateBrowserIdentity();

    updateRouteUi();

  }

}


function initialiseCastApi() {

  if (
    castApiReady ||
    !window.cast?.framework ||
    !window.chrome?.cast?.media
  ) {

    return;

  }


  const context =
    cast.framework.CastContext
      .getInstance();


  context.setOptions({
    receiverApplicationId:
      chrome.cast.media
        .DEFAULT_MEDIA_RECEIVER_APP_ID,

    autoJoinPolicy:
      chrome.cast.AutoJoinPolicy
        .ORIGIN_SCOPED
  });


  castPlayer =
    new cast.framework.RemotePlayer();


  castPlayerController =
    new cast.framework.RemotePlayerController(
      castPlayer
    );


  context.addEventListener(
    cast.framework.CastContextEventType
      .SESSION_STATE_CHANGED,
    handleCastSessionStateChange
  );


  context.addEventListener(
    cast.framework.CastContextEventType
      .CAST_STATE_CHANGED,
    event => {

      updateCastAvailability(
        event.castState
      );

    }
  );


  castPlayerController.addEventListener(
    cast.framework.RemotePlayerEventType
      .IS_CONNECTED_CHANGED,
    () => {

      if (
        castPlayer.isConnected
      ) {

        audio.pause();

      }


      updatePlaybackUiFromCast();

      updateRouteUi();

    }
  );


  castPlayerController.addEventListener(
    cast.framework.RemotePlayerEventType
      .PLAYER_STATE_CHANGED,
    updatePlaybackUiFromCast
  );


  castPlayerController.addEventListener(
    cast.framework.RemotePlayerEventType
      .IS_MEDIA_LOADED_CHANGED,
    updatePlaybackUiFromCast
  );


  castPlayerController.addEventListener(
    cast.framework.RemotePlayerEventType
      .VOLUME_LEVEL_CHANGED,
    updateVolumeBar
  );


  castPlayerController.addEventListener(
    cast.framework.RemotePlayerEventType
      .IS_MUTED_CHANGED,
    updateMuteUI
  );


  castApiReady =
    true;


  updateCastAvailability();

}


window.__radioInitCastApi =
  initialiseCastApi;


if (
  window.__radioCastApiAvailable
) {

  initialiseCastApi();

}

/* =========================================================
   THEME
   ========================================================= */

const THEME_KEY =
  "radio-theme";


const themeQuery =
  window.matchMedia(
    "(prefers-color-scheme: light)"
  );


let themePreference =
  document.documentElement
    .dataset
    .theme ||
  "system";


function getResolvedTheme() {

  if (
    themePreference ===
    "system"
  ) {

    return themeQuery.matches
      ? "light"
      : "dark";

  }


  return themePreference;

}


function updateThemeColor() {

  themeColor.content =
    getResolvedTheme() ===
    "light"
      ? "#f3f5f8"
      : "#080a0f";

}


function applyTheme(
  choice,
  persist = true
) {

  if (
    ![
      "system",
      "light",
      "dark"
    ].includes(choice)
  ) {

    choice =
      "system";

  }


  themePreference =
    choice;


  document.documentElement
    .dataset
    .theme =
    choice;


  if (
    themeSwitcher
  ) {

    themeSwitcher.dataset.state =
      choice;

  }


  for (
    const button
    of themeButtons
  ) {

    const active =
      button.dataset
        .themeChoice ===
      choice;


    button.classList.toggle(
      "active",
      active
    );


    button.setAttribute(
      "aria-pressed",
      active
        ? "true"
        : "false"
    );

  }


  if (persist) {

    try {

      localStorage.setItem(
        THEME_KEY,
        choice
      );

    }

    catch {}

  }


  updateThemeColor();

}


for (
  const button
  of themeButtons
) {

  button.addEventListener(
    "click",
    () => {

      applyTheme(
        button.dataset
          .themeChoice
      );

    }
  );

}


applyTheme(
  themePreference,
  false
);


themeQuery.addEventListener?.(
  "change",
  () => {

    if (
      themePreference ===
      "system"
    ) {

      updateThemeColor();

    }

  }
);

function getCountryDisplayOrder() {

  return [...COUNTRIES]
    .sort(
      (a, b) => {

        const af =
          favoriteCountries.has(
            a.code
          );


        const bf =
          favoriteCountries.has(
            b.code
          );


        if (
          af !== bf
        ) {

          return af
            ? -1
            : 1;

        }


        return (
          COUNTRIES.indexOf(a) -
          COUNTRIES.indexOf(b)
        );

      }
    );

}


function getCountryOrder(
  countryCode
) {

  return stations
    .map(
      (station, index) => ({
        station,
        index
      })
    )
    .filter(
      item =>
        item.station.country ===
        countryCode
    )
    .sort(
      (a, b) => {

        const af =
          favoriteIds.has(
            a.station.id
          );


        const bf =
          favoriteIds.has(
            b.station.id
          );


        if (
          af !== bf
        ) {

          return af
            ? -1
            : 1;

        }


        return a.index - b.index;

      }
    );

}


function getDisplayOrder() {

  return getCountryDisplayOrder()
    .flatMap(
      country =>
        getCountryOrder(
          country.code
        )
    );

}


function getVisibleDisplayOrder() {

  return getCountryDisplayOrder()
    .filter(
      country =>
        !collapsedCountries.has(
          country.code
        )
    )
    .flatMap(
      country =>
        getCountryOrder(
          country.code
        )
    );

}


function toggleFavorite(

  if (

  localStorage.setItem(

      <span class="country-title">
        ${country.name}
      </span>

      <span class="country-count">
        ${items.length} stations
      </span>

      <span class="country-chevron">
        ▾
      </span>

    `;


    toggle.addEventListener(
      "click",
      () => {

        toggleCountryCollapsed(
          country.code
        );

      }
    );


    const favorite =
      document.createElement(
        "button"
      );


    favorite.type =
      "button";


    favorite.className =
      "country-favorite";


    favorite.classList.toggle(
      "active",
      countryFavorite
    );


    favorite.textContent =
      countryFavorite
        ? "★"
        : "☆";


    favorite.setAttribute(
      "aria-label",

      countryFavorite
        ? `${country.name} uit favorieten`
        : `${country.name} toevoegen aan favorieten`
    );


    favorite.addEventListener(
      "click",
      () => {

        toggleCountryFavorite(
          country.code
        );

      }
    );


    header.appendChild(
      toggle
    );


    header.appendChild(
      favorite
    );


    const grid =
      document.createElement(
        "div"
      );


    grid.className =
      "country-stations";


    grid.hidden =
      collapsed;


    for (
      const {
        station,
        index
      }
      of items
    ) {

      grid.appendChild(
        createStationCard(
          station,
          index
        )
      );

    }


    group.appendChild(
      header
    );


    group.appendChild(
      grid
    );


    stationsContainer.appendChild(
      group
    );

  }


  const favs =
    favoriteIds.size;


  const favoriteText =
    favs === 1
      ? "1 favoriet"
      : `${favs} favorieten`;


  stationCount.textContent =
    favs
      ? `${stations.length} stations · ${favoriteText}`
      : `${stations.length} stations`;

}

}

  resetWikipediaLinks();


  trackInfo.hidden =

  trackTitle.textContent =
    "";

}


function clearTrack() {

  wikipediaGeneration++;

  resetWikipediaLinks();


  currentTrack = {
    artist: "",
    title: ""
  };


  currentTrackUpdatedAt =
    0;


  trackArtist.textContent =
    "";


  trackTitle.textContent =
    "";


  trackInfo.hidden =

}


function setTrack(
  artist,
  title
) {

  if (
    isContentSuppressed()
  ) {

    clearTrack();

    return true;

  }


  artist =
    cleanText(
      artist
    );


  title =
    cleanText(
      title
    );


  if (!title) {

    Date.now();


  if (
    currentTrack.artist === artist &&
    currentTrack.title === title
  ) {

    trackInfo.hidden =

    return true;

  }


  currentTrack = {
    artist,
    title
  };


  trackInfo.className =
    artist
      ? "track"
      : "track single";


  trackArtist.textContent =
    artist;


  trackTitle.textContent =
    title;


  trackInfo.hidden =
    false;


  resetWikipediaLinks();


  updateWikipediaLinks(
    artist,
    title
  );


  updateMediaSession();


  return true;

}


/* =========================================================
   PROGRAM UI
   ========================================================= */

function clearProgram() {

  currentProgram =
    "";


  currentProgramUpdatedAt =
    0;


  programTitle.textContent =
    "";


  programTitle.hidden =
    true;


  updateMediaSession();

}


function isInvalidProgram(
  value
) {

  const text =
    cleanText(
      value
    );


  if (!text) {
    return true;
  }


  return [

    /^pagina onbeschikbaar$/i,
    /^deze pagina kon niet geladen worden$/i,

    /^live$/i,
    /^nu live$/i,
    /^kijk live$/i,
    /^luister live$/i,

    /^playlist$/i,
    /^programmering$/i,
    /^programma's$/i,
    /^programma’s$/i,

    /^nieuws$/i,
    /^contact$/i,

    /^volume$/i,

    /^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/i

  ]
  .some(
    regex =>
      regex.test(
        text
      )
  );

}


function setProgram(
  value
) {

  const text =
    cleanText(
      value
    );


  if (
    !text ||
    isInvalidProgram(text) ||
    isContentSuppressed()
  ) {

    clearProgram();

    return false;

  }


  currentProgram =
    text;


  currentProgramUpdatedAt =
    Date.now();


  programTitle.textContent =
    text;


  programTitle.hidden =
    false;


  updateMediaSession();


  return true;

}


/* =========================================================
   SELECT STATION
   ========================================================= */

function selectStation(
  index,
  autoPlay = false
) {

  if (
    index === currentIndex &&
    audio.src
  ) {

    if (
      autoPlay &&
      !isPlaybackActive()
    ) {

      play();

    }


    return;

  }


  const wasPlaying =
    isPlaybackActive();


  cancelReconnect();


  reconnectAttempts =
    0;


  currentIndex =
    index;


  metadataGeneration++;

  programGeneration++;

  wikipediaGeneration++;


  clearTimeout(
    preRollGuardTimer
  );


  preRollTrackGuardUntil =
    0;


  const station =
    stations[currentIndex];


  preRollGuardPending =
    Boolean(
      station.preRollTrackGuardSeconds
    );


  localStorage.setItem(
    "radio-station-id",
    station.id
  );


  stationTitle.textContent =
    station.name;


  stationMark.textContent =
    station.mark;


  document.documentElement
    .style
    .setProperty(
      "--accent",
      station.accent
    );


  document.documentElement
    .style
    .setProperty(
      "--accent-rgb",
      station.rgb
    );


  updateMainLogo();


  clearTrack();

  clearProgram();


  audio.pause();


  audio.src =
    station.stream;


  audio.load();


  status.textContent =
    "Zender geselecteerd";


  renderStations();

  updateBrowserIdentity();

  updateMediaSession();

  refreshMetadata();

  refreshProgram();


  if (
    wasPlaying ||
    autoPlay
  ) {

    play();

  }

  else {

    playbackRequested =
      false;

  }

}


/* =========================================================
   PRE-ROLL
   ========================================================= */

function beginPreRollGuard() {

  const station =
    stations[currentIndex];


  if (
    !preRollGuardPending ||
    !station.preRollTrackGuardSeconds
  ) {

    return;

  }


  preRollTrackGuardUntil =
    Infinity;


  clearTrack();

  clearProgram();

}


function activatePreRollTimer() {

  const station =
    stations[currentIndex];


  if (
    preRollTrackGuardUntil !==
      Infinity ||
    !station.preRollTrackGuardSeconds
  ) {

    return;

  }


  preRollGuardPending =
    false;


  preRollTrackGuardUntil =
    Date.now() +
    station.preRollTrackGuardSeconds *
    1000;


  clearTimeout(
    preRollGuardTimer
  );


  preRollGuardTimer =
    window.setTimeout(
      () => {

        preRollTrackGuardUntil =
          0;


        refreshMetadata();

        refreshProgram();

      },
      station.preRollTrackGuardSeconds *
      1000
    );

}


/* =========================================================
   STREAM RECOVERY
   ========================================================= */

function isContentSuppressed() {

  if (
    preRollTrackGuardUntil ===
    Infinity
  ) {

    return true;

  }


  return (
    preRollTrackGuardUntil >
    Date.now()
  );

}


const MAX_RECONNECT_ATTEMPTS =
  5;


function cancelReconnect() {

  clearTimeout(
    reconnectTimer
  );


  reconnectTimer =
    null;

}


function scheduleReconnect(
  reason,
  delay = 900
) {

  if (
    !playbackRequested ||
    navigator.onLine === false
  ) {

    return;

  }


  const stationIndex =
    currentIndex;


  cancelReconnect();


  reconnectTimer =
    window.setTimeout(
      async () => {

        if (
          stationIndex !==
            currentIndex ||
          !playbackRequested ||
          navigator.onLine ===
            false
        ) {

          return;

        }


        if (
          reason === "stalled" &&
          !audio.paused &&
          audio.readyState >=
            HTMLMediaElement.HAVE_FUTURE_DATA
        ) {

          reconnectAttempts =
            0;

          return;

        }


        reconnectAttempts++;


        if (
          reconnectAttempts >
            MAX_RECONNECT_ATTEMPTS
        ) {

          status.textContent =
            "Verbinding verbroken";


          return;

        }


        status.textContent =
          "Opnieuw verbinden…";


        const stream =
          stations[currentIndex]
            .stream;


        try {

          audio.pause();


          audio.src =
            stream;


          audio.load();


          await audio.play();

        }

        catch {

          scheduleReconnect(
            "error",
            Math.min(
              6000,
              900 *
              Math.pow(
                1.7,
                reconnectAttempts
              )
            )
          );

        }

      },
      delay
    );

}


/* =========================================================
   AUDIO
   ========================================================= */

async function play() {

  document.body
    .classList
    .remove(
      "awaiting-first-play"
    );


  playbackRequested =
    true;


  beginPreRollGuard();


  if (
    isCasting()
  ) {

    if (
      castLoadedStationId !==
        stations[currentIndex].id ||
      !castPlayer.isMediaLoaded
    ) {

      await loadCurrentStationOnCast(
        true
      );


      return;

    }


    if (
      castPlayer.isPaused
    ) {

      castPlayerController
        .playOrPause();

    }


    status.textContent =
      "Cast · Live";


    return;

  }


  status.textContent =
    "Verbinden…";


  try {

    await audio.play();

  }

  catch {

    status.textContent =
      "Stream tijdelijk niet beschikbaar";


    scheduleReconnect(
      "error",
      1000
    );

  }

}


function pause(
  message =
    "Gepauzeerd"
) {

  playbackRequested =
    false;


  cancelReconnect();


  reconnectAttempts =
    0;


  if (
    isCasting()
  ) {

    if (
      castPlayer.isMediaLoaded &&
      !castPlayer.isPaused
    ) {

      castPlayerController
        .playOrPause();

    }


    status.textContent =
      typeof message === "string"
        ? `Cast · ${message}`
        : "Cast · Gepauzeerd";


    return;

  }


  audio.pause();


  status.textContent =
    typeof message === "string"
      ? message
      : "Gepauzeerd";

}


function togglePlay() {

  if (
    isPlaybackActive()
  ) {

    pause();

  }

  else {

    play();

  }

}


playButton.addEventListener(
  "click",
  togglePlay
);


audio.addEventListener(

  () => {

    cancelReconnect();


    reconnectAttempts =
      0;


    document.body
      .classList
      .add(
        "is-playing"
      );


    playButton.setAttribute(
      "aria-label",
      "Pauzeren"
    );


    status.textContent =

  }
);


audio.addEventListener(

    if (

    ) {

    }

      );


    playButton.setAttribute(

    );


    updateBrowserIdentity();

  }
);


audio.addEventListener(

  () => {

    if (
      isCasting()
    ) {

      return;

    }


    if (
      playbackRequested
    ) {

      status.textContent =
        "Bufferen…";

    }

  }
);


audio.addEventListener(
  "stalled",
  () => {

    if (
      isCasting()
    ) {

      return;

    }


    if (
      playbackRequested
    ) {

      status.textContent =
        "Stream buffert…";


      scheduleReconnect(
        "stalled",

      );

    }

  }
);


audio.addEventListener(

  () => {

    if (
      isCasting()
    ) {

      return;

    }


    if (
      playbackRequested
    ) {

      );

    }

  }
);

    ) {

    }


    if (

    ) {

  const level =
    isCasting() &&
    castPlayer

          0,
          Math.min(
            1,
            Number(
              castPlayer.volumeLevel
            ) || 0
          )
        )
      : audio.volume;


  volume.value =
    level;

    "--volume",
    `${level * 100}%`
  );

    ) {

/* =========================================================
   TRACK SPLIT
   ========================================================= */

function splitTrack(
  value
) {

  const text =
    cleanText(
      value
    );


  if (!text) {

    return null;

  }


  const separators = [
    " - ",
    " – ",
    " — ",
    " | "
  ];


  for (
    const separator
    of separators
  ) {

    const position =
      text.indexOf(
        separator
      );


    if (
      position <= 0
    ) {

      continue;

    }


    const artist =
      cleanText(
        text.slice(
          0,
          position
        )
      );


    const title =
      cleanText(
        text.slice(
          position +
          separator.length
        )
      );


    if (
      artist &&
      title
    ) {

      return {
        artist,
        title
      };

    }

  }


  return null;

}


/* =========================================================
   STATION NOISE
   ========================================================= */

function isStationNoise(
  value,
  station
) {

  const text =
    cleanText(
      value
    )
    .toLowerCase();


  if (!text) {

    return true;

  }


  for (
    const noise
    of station.noise || []
  ) {

    const lowered =
      noise.toLowerCase();


    if (
      text === lowered ||
      text.startsWith(
        lowered +
        " - "
      )
    ) {

      return true;

    }

  }


  return false;

}


function isHardNoTrack(
  value
) {

  const text =
    cleanText(
      value
    );


  if (!text) {

    return true;

  }


  return (
    /^(ad break|ad start|commercial break|dynamic break)/i
      .test(text) ||

    /\breclame\b/i
      .test(text) ||

    /\bnieuws\b/i
      .test(text)
  );

}


/* =========================================================
   NPO MINIPLAYER
   ========================================================= */

const npoMiniCache =
  new Map();


async function getNpoMiniData(
  provider
) {

  const channel =
    provider.channel;


  if (!channel) {

    return null;

  }


  const cached =
    npoMiniCache.get(
      channel
    );


  if (
    cached &&
    Date.now() -
      cached.at <
      10000
  ) {

    return cached.data;

  }


  const data =
    await fetchJsonSmart(
      "https://www.nporadio2.nl/api/miniplayer/info?channel=" +
      encodeURIComponent(
        channel
      )
    );


  npoMiniCache.set(
    channel,
    {
      at:
        Date.now(),

      data
    }
  );


  return data;

}


function parseNpoLocalDate(
  value
) {

  const text =
    cleanText(
      value
    );


  if (!text) {

    return 0;

  }


  const parsed =
    Date.parse(
      text.replace(
        " ",
        "T"
      )
    );


  return Number.isFinite(parsed)
    ? parsed
    : 0;

}


async function getNpoMiniMetadata(
  provider
) {

  const response =
    await getNpoMiniData(
      provider
    );


  const track =
    response
      ?.data
      ?.radioTrackPlays
      ?.data
      ?.[0];


  if (!track) {

    return {
      noTrack: true
    };

  }


  const from =
    parseNpoLocalDate(
      track.from
    );


  const until =
    parseNpoLocalDate(
      track.until
    );


  const now =
    Date.now();


  if (
    from &&
    until &&
    (
      now < from - 5000 ||
      now > until + 7000
    )
  ) {

    return {
      noTrack: true
    };

  }


  const artist =
    cleanText(
      track.artist
    );


  const title =
    cleanText(
      track.song
    );


  if (
    !artist ||
    !title
  ) {

    return {
      noTrack: true
    };

  }


  return {
    artist,
    title
  };

}


async function getNpoMiniProgram(
  provider,
  station
) {

  const response =
    await getNpoMiniData(
      provider
    );


  const broadcast =
    response
      ?.data
      ?.radioBroadcasts
      ?.data
      ?.[0];


  return cleanProgramValue(
    broadcast?.name,
    station
  );

}


/* =========================================================
   DPG TRACKS
   ========================================================= */

async function getDpgMetadata(
  provider
) {

  const data =
    await fetchJsonSmart(
      provider.url
    );


  const track =
    data
      ?.played_tracks
      ?.[0];


  if (!track) {

    return null;

  }


  const title =
    cleanText(
      track.title
    );


  const artist =
    cleanText(
      track.artist?.name
    );


  if (
    !title ||
    !artist
  ) {

    return {
      noTrack: true
    };

  }


  const start =
    Date.parse(
      track.played_at ||
      ""
    );


  const duration =
    Number(
      track.duration
    ) * 1000;


  if (
    Number.isFinite(start) &&
    Number.isFinite(duration) &&
    duration > 0
  ) {

    const now =
      Date.now();


    if (
      now <
        start - 5000 ||
      now >
        start +
        duration +
        15000
    ) {

      return {
        noTrack: true
      };

    }

  }


  return {
    artist,
    title
  };

}


/* =========================================================
   ARROW TRACKS
   ========================================================= */

async function getArrowMetadata(
  provider
) {

  const data =
    await fetchJsonSmart(

    );

    );

/* =========================================================
   TRITON HELPERS
   ========================================================= */

function parseEpochMilliseconds(
  value
) {

  const number =
    Number(
      String(value || "")
        .trim()
    );


  if (
    !Number.isFinite(number)
  ) {

    return 0;

  }


  return (
    number >
    100000000000
  )
    ? number
    : number * 1000;

}


function parseDurationMilliseconds(
  value
) {

  const number =
    Number(
      String(value || "")
        .trim()
    );


  if (
    !Number.isFinite(number) ||
    number <= 0
  ) {

    return 0;

  }


  return (
    number < 1000
  )
    ? number * 1000
    : number;

}


/* =========================================================

async function getTritonMetadata(

) {

    ) +

  const xml =

    );

      .parseFromString(

      );


  if (
    doc.querySelector(
      "parsererror"
    )
  ) {
